# Namespace-agnostic: the gateway's kubernetes executor sets namespace app-tor-remote-access (contract §3).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: tor-remote-access
      app.kubernetes.io/part-of: onemind-apps
    includeSelectors: false
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: tor-remote-access-app
    files:
      - tor_access.py
