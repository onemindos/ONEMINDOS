# SPDX-License-Identifier: Apache-2.0
# The onion service key (the .onion address) and the devices' public keys. A plain uninstall keeps
# this volume, so a reinstall gets the same address; "delete data" removes it (contract 12.5).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tor-remote-access-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
