# SPDX-License-Identifier: Apache-2.0
# Vikunja 2.8.0 (github.com/go-vikunja/vikunja), image docker.io/vikunja/vikunja. The image runs as UID 1000, listens on
# 3456, keeps its SQLite database at /db/vikunja.db (VIKUNJA_DATABASE_PATH) and uploads in /app/vikunja/files.
# GET /api/v1/info is anonymous and answers 200 (checked by running the pinned image as UID 1000 with all
# capabilities dropped).
#
# Pod: non-root, RuntimeDefault seccomp, no service-account token; containers: no privilege escalation, all capabilities dropped.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vikunja
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vikunja
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: vikunja
        image: docker.io/vikunja/vikunja:2.8.0@sha256:35d937baf3b5d5803bed6b9e11d007448b7b536df9e4346dc35551e1072636c3
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3456
          protocol: TCP
        env:
        # Matches a port-forward: OneMind v0 has no ingress or certificates for apps yet.
        - name: VIKUNJA_SERVICE_PUBLICURL
          value: http://localhost:3456/
        startupProbe:
          httpGet:
            path: /api/v1/info
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /api/v1/info
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/info
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /db
          subPath: db
        - name: data
          mountPath: /app/vikunja/files
          subPath: files
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vikunja-data
