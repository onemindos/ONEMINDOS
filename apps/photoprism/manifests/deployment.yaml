# SPDX-License-Identifier: Apache-2.0
# PhotoPrism 261029 (release 261029-963b58c50), configured as upstream's setup/docker/compose.yaml at that
# tag: PhotoPrism with MariaDB 12.3 (12.3.3 pinned) and the same mariadbd options. PhotoPrism runs as
# 1000:1000 (its documented user: option), so PHOTOPRISM_DISABLE_CHOWN; TLS is off (plain HTTP behind the
# OneMind gateway). The secrets init container generates the initial admin password and the database
# password once; both programs read them through *_FILE variables (PhotoPrism internal/config/env.go
# FlagFilePath; the MariaDB image's MARIADB_*_FILE). MariaDB is a native sidecar on 127.0.0.1 only, as
# UID 999. GET /api/v1/status is PhotoPrism's status endpoint. Upstream's compose sets seccomp and
# AppArmor unconfined; this package keeps RuntimeDefault and turns off InnoDB native AIO (io_uring),
# which that profile may block (--innodb-use-native-aio=0, the one option added to upstream's list).
#
# Pod: non-root, RuntimeDefault seccomp, no service-account token; containers: no privilege escalation, all capabilities dropped.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoprism
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: photoprism
  template:
    metadata:
      labels:
        app.kubernetes.io/name: photoprism
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: secrets
        image: docker.io/photoprism/photoprism:261029@sha256:9409cf8e5a6ebcbe3170d14537556cbc20997aaa307096d6eeedbfc5eeef6719
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -e
          # Generated once on the storage volume, readable by the pod's group (fsGroup) only.
          umask 027
          mkdir -p /photoprism/storage/.onemind
          for f in admin-password db-password; do
            [ -s /photoprism/storage/.onemind/$f ] || tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24 > /photoprism/storage/.onemind/$f
          done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: storage
          mountPath: /photoprism/storage
      - name: mariadb
        image: docker.io/library/mariadb:12.3.3@sha256:4ebbcf100a3ba320766dfa0e1af008df12261301db6ef72798c7650f70794aed
        imagePullPolicy: IfNotPresent
        restartPolicy: Always
        args:
        - mariadbd
        - --bind-address=127.0.0.1
        - --innodb-buffer-pool-size=512M
        - --transaction-isolation=READ-COMMITTED
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        - --max-connections=512
        - --innodb-rollback-on-timeout=OFF
        - --innodb-lock-wait-timeout=120
        - --innodb-use-native-aio=0
        env:
        - name: MARIADB_AUTO_UPGRADE
          value: '1'
        - name: MARIADB_INITDB_SKIP_TZINFO
          value: '1'
        - name: MARIADB_DATABASE
          value: photoprism
        - name: MARIADB_USER
          value: photoprism
        - name: MARIADB_PASSWORD_FILE
          value: /run/onemind/db-password
        - name: MARIADB_ROOT_PASSWORD_FILE
          value: /run/onemind/db-password
        startupProbe:
          exec:
            command:
            - healthcheck.sh
            - --connect
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - healthcheck.sh
            - --connect
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: db
          mountPath: /var/lib/mysql
        - name: storage
          mountPath: /run/onemind
          subPath: .onemind
          readOnly: true
      containers:
      - name: photoprism
        image: docker.io/photoprism/photoprism:261029@sha256:9409cf8e5a6ebcbe3170d14537556cbc20997aaa307096d6eeedbfc5eeef6719
        imagePullPolicy: IfNotPresent
        workingDir: /photoprism
        env:
        - name: PHOTOPRISM_ADMIN_USER
          value: admin
        - name: PHOTOPRISM_ADMIN_PASSWORD_FILE
          value: /photoprism/storage/.onemind/admin-password
        - name: PHOTOPRISM_AUTH_MODE
          value: password
        - name: PHOTOPRISM_SITE_URL
          value: http://localhost:2342/
        - name: PHOTOPRISM_HTTP_PORT
          value: '2342'
        - name: PHOTOPRISM_DISABLE_TLS
          value: 'true'
        - name: PHOTOPRISM_DEFAULT_TLS
          value: 'false'
        - name: PHOTOPRISM_DISABLE_CHOWN
          value: 'true'
        - name: PHOTOPRISM_ORIGINALS_LIMIT
          value: '5000'
        - name: PHOTOPRISM_UPLOAD_LIMIT
          value: '5000'
        - name: PHOTOPRISM_DATABASE_DRIVER
          value: mysql
        - name: PHOTOPRISM_DATABASE_SERVER
          value: 127.0.0.1:3306
        - name: PHOTOPRISM_DATABASE_NAME
          value: photoprism
        - name: PHOTOPRISM_DATABASE_USER
          value: photoprism
        - name: PHOTOPRISM_DATABASE_PASSWORD_FILE
          value: /photoprism/storage/.onemind/db-password
        ports:
        - name: http
          containerPort: 2342
          protocol: TCP
        startupProbe:
          httpGet:
            path: /api/v1/status
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/v1/status
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/status
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '4'
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: storage
          mountPath: /photoprism/storage
        - name: originals
          mountPath: /photoprism/originals
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: photoprism-storage
      - name: originals
        persistentVolumeClaim:
          claimName: photoprism-originals
      - name: db
        persistentVolumeClaim:
          claimName: photoprism-db
