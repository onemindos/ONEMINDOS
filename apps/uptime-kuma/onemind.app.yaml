apiVersion: onemind.app/v1alpha1
kind: App
metadata:
  id: uptime-kuma
  name: Uptime Kuma
  version: "2.5.10"
  description: Self-hosted uptime monitoring for websites, ports and services, with status pages and notifications
  category: monitoring
  icon: icon.svg
  license: MIT
  source: https://github.com/louislam/uptime-kuma
spec:
  archs: [amd64, arm64]
  requires: {gpu: false, minMemoryMb: 256}
  web: {port: 3001}
  manifests: manifests/
