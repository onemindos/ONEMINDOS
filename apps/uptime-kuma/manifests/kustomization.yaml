# Uptime Kuma for OneMind. Namespace-agnostic: the gateway installs it into app-uptime-kuma (contract §3).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: uptime-kuma
      app.kubernetes.io/part-of: onemind-apps
    includeSelectors: false
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
