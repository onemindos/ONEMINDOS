# librechat.yaml (CONFIG_PATH). Version from librechat.example.yaml at v0.8.8. The one endpoint
# is the Ollama Market app on the same box, as the LibreChat docs page "Ollama" configures it
# (name must start with "ollama" for fetch: true). Other providers can be added here later.
apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
data:
  librechat.yaml: |
    version: 1.3.17
    cache: true
    endpoints:
      custom:
        - name: "Ollama"
          apiKey: "ollama"
          baseURL: "http://ollama.app-ollama.svc.cluster.local:11434/v1/"
          models:
            default: ["llama3.2"]
            fetch: true
          titleConvo: true
          titleModel: "current_model"
          modelDisplayLabel: "Ollama"
