# Web UI and HTTP API on Service port 5000.
apiVersion: v1
kind: Service
metadata:
  name: libretranslate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: libretranslate
  ports:
  - name: http
    port: 5000
    targetPort: http
    protocol: TCP
