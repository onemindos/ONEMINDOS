# Bumped from 1.9.6 to 1.10.0 on 2026-11-27; the upstream files cited here were read at 1.9.6 and not re-read at 1.10.0.
# LibreTranslate 1.10.0, upstream image docker.io/libretranslate/libretranslate (built without bundled
# models: build arg with_models=false). The image config (read from the registry on 2026-11-19) runs as
# the user libretranslate (UID/GID 1032), listens on 5000 and starts ./scripts/entrypoint.sh, which first
# runs LibreTranslate once to download any missing language models, then starts gunicorn.
#
# Models: Argos Translate keeps them under ~/.local (here /home/libretranslate/.local), so that path is a
# PVC. The first start downloads the models for LT_LOAD_ONLY from the Argos package index (internet
# needed once); after that the app runs offline. LT_UPDATE_MODELS is left at its default (false), so it
# never fetches again on its own.
#
# Pod: non-root (UID 1032), fsGroup 1032 so the PVC is writable, RuntimeDefault seccomp, no
# service-account token. Container: no privilege escalation, all capabilities dropped. The root
# filesystem stays writable because the app writes its metrics and API-key databases under /app/db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: libretranslate
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: libretranslate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: libretranslate
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1032
        runAsGroup: 1032
        fsGroup: 1032
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: libretranslate
        image: docker.io/libretranslate/libretranslate:v1.10.0@sha256:6cf78d417741c979a12ba4f9731284b1e66066dc090c8c810174a442e0926ba2
        imagePullPolicy: IfNotPresent
        env:
        # Settings from libretranslate/default_values.py (each is the LT_ prefix plus the option name).
        # Four languages keep the first download and memory small; add codes here for more.
        - name: LT_LOAD_ONLY
          value: "en,es,fr,de"
        # Number of gunicorn workers; each loads the models, so memory grows with it.
        - name: LT_THREADS
          value: "2"
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        # The first start downloads the models, which can take minutes: up to 15 minutes allowed.
        startupProbe:
          httpGet:
            path: /languages
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /languages
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /languages
            port: http
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        # A OneMind choice (upstream publishes no figures): two workers with four languages.
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: models
          mountPath: /home/libretranslate/.local
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: libretranslate-models
