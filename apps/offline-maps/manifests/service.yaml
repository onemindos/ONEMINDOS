# SPDX-License-Identifier: Apache-2.0
# 8080: the map viewer. 8081: go-pmtiles' Z/X/Y tile API (/<map name>/{z}/{x}/{y}.mvt and
# /<map name>.json TileJSON) for other map clients.
apiVersion: v1
kind: Service
metadata:
  name: offline-maps
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: offline-maps
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: tiles
      port: 8081
      targetPort: tiles
      protocol: TCP
