apiVersion: apps/v1
kind: Deployment
metadata:
  name: offline-maps
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # One ReadWriteOnce volume: stop the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: offline-maps
  template:
    metadata:
      labels:
        app.kubernetes.io/name: offline-maps
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Both images default to root; nothing here needs it. 65532 is the distroless "nonroot"
      # user of the go-pmtiles image, used for both containers so they share the volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The viewer: page, map archives (HTTP range requests) and the pinned browser assets.
        - name: viewer
          image: docker.io/library/python:3.14.10-slim-trixie@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
          # -I: isolated mode; -B: no .pyc files, so the root filesystem stays read-only.
          command: ["python3", "-I", "-B", "/opt/onemind/map_viewer.py"]
          env:
            - name: PORT
              value: "8080"
            - name: MAPS_DIR
              value: /data/maps
            - name: MAP_PACKS_DIR
              value: /packs
            - name: ASSETS_DIR
              value: /data/assets
          envFrom:
            - configMapRef:
                name: onemind-settings
                optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: packs
              mountPath: /packs
              readOnly: true
            - name: viewer
              mountPath: /opt/onemind
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # go-pmtiles: the tile API for other map clients, and the tool the owner runs to cut a
        # region out of the public Protomaps build (README "Add a map": kubectl exec ... extract).
        - name: pmtiles
          image: docker.io/protomaps/go-pmtiles:v1.31.2@sha256:06574f01f55a78f78f887bc7ebf729a5c093c0d6e17d9876300cfcb0758b59d3
          args: ["serve", "/data/maps", "--port=8081", "--cache-size=32"]
          ports:
            - name: tiles
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: tiles
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: offline-maps-data
        - name: packs
          persistentVolumeClaim:
            claimName: offline-maps-packs
            readOnly: true
        - name: viewer
          configMap:
            name: offline-maps-viewer
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
