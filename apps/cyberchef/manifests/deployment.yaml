# SPDX-License-Identifier: Apache-2.0
# Bumped from 11.5.0 to 11.6.0 on 2026-11-27; the upstream files cited here were read at 11.5.0 and not re-read at 11.6.0.
# CyberChef 11.6.0, upstream image ghcr.io/gchq/cyberchef (built by gchq/CyberChef's release workflow).
# The image config (read from the registry on 2026-11-19) is nginx-unprivileged style: USER 101, port
# 8080, pid file in /tmp. CyberChef is static files only; every operation runs in the browser, so
# nothing is stored on the server.
#
# Pod: non-root (UID 101), RuntimeDefault seccomp, no service-account token. Container: read-only root
# filesystem with small scratch volumes for nginx's cache and /tmp, no privilege escalation, all
# capabilities dropped.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberchef
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cyberchef
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyberchef
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cyberchef
        image: ghcr.io/gchq/cyberchef:11.6.0@sha256:847b3a20804815014babe9cfa628a1fd1980d92f98240f48cfc6c8e2f5ff7a14
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        # nginx serving static files; a OneMind choice (upstream publishes no figures).
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: nginx-cache
        emptyDir:
          sizeLimit: 64Mi
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
