# SPDX-License-Identifier: Apache-2.0
# Scaffolded by sdk/tools/app-scaffold from github.com/qbittorrent/qBittorrent (contract §9.2).
# The qBittorrent repo has no compose file; its official image is built in
# github.com/qbittorrent/docker-qbittorrent-nox, completed from that repo's Dockerfile (user
# qbtUser, UID 1000), entrypoint.sh (writes /config/qBittorrent/config/qBittorrent.conf on first
# start, WebUI port 8080, torrent port 6881; started as non-root it runs qbittorrent-nox directly)
# and Readme.md (--read-only with a /tmp tmpfs is supported; stop timeout 1800 s).
#
# QBT_LEGAL_NOTICE is left unset on purpose: upstream says to set it to "confirm" "only if you have
# read the legal notice". Without it, qbittorrent-nox prints the notice to the log and keeps
# running (src/app/legalnotice.cpp, non-interactive path); README.md shows it to the owner.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Readme.md: "set --stop-timeout 1800" so qBittorrent can save resume data before it stops.
      terminationGracePeriodSeconds: 1800
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qbittorrent
          image: docker.io/qbittorrentofficial/qbittorrent-nox:5.3.0-2@sha256:43b2d352cf76330a7ca34c7320b9b74227d6f31e662e0e123d0457206b09a7ea
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: bt-tcp
              containerPort: 6881
              protocol: TCP
            - name: bt-udp
              containerPort: 6881
              protocol: UDP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          # Upstream publishes no sizing; a OneMind choice. Memory grows with the number of active
          # torrents and the disk cache.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: downloads
          persistentVolumeClaim:
            claimName: qbittorrent-downloads
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
