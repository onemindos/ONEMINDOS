# library_chat.py comes from the ConfigMap; the image is the stock python image, nothing installed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-chat
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: library-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: library-chat
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Stateless: no volume, no history kept. Runs as nobody (65534), not the image's root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: library-chat
          image: docker.io/library/python:3.14.10-slim-trixie@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
          # -I: isolated mode (no PYTHON* variables, no current directory on the path);
          # -B: no .pyc files, so the root filesystem can stay read-only.
          command: ["python3", "-I", "-B", "/opt/onemind/library_chat.py"]
          env:
            - name: PORT
              value: "8080"
            - name: KIWIX_URL
              value: http://kiwix.app-kiwix.svc.cluster.local:8080
            - name: OLLAMA_URL
              value: http://ollama.app-ollama.svc.cluster.local:11434
          envFrom:
            - configMapRef:
                name: onemind-settings
                optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          # The model runs in Ollama; this process only searches, cuts text and waits.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /opt/onemind
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: library-chat-app
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
