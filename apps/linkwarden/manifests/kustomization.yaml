# Namespace-agnostic: the gateway's kubernetes executor sets namespace app-linkwarden (contract §3).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    app.kubernetes.io/name: linkwarden
    app.kubernetes.io/part-of: onemind-apps
  includeSelectors: false
resources:
- deployment.yaml
- pvc.yaml
- service.yaml
