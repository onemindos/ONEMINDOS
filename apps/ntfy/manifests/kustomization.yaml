# Namespace-agnostic: the gateway's kubernetes executor sets namespace app-ntfy (contract §3).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: ntfy
      app.kubernetes.io/part-of: onemind-apps
    includeSelectors: false
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
