# Upstream references (v2.37.2): docs/install.md "Docker" and "Kubernetes"/"Kustomize",
# docs/config.md config table and "Health checks".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # SQLite files on a ReadWriteOnce volume have a single writer: stop the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
    spec:
      automountServiceAccountToken: false
      # The image sets no USER (runs as root by default). Upstream documents running it as any
      # UID:GID (`-u UID:GID`, docs/install.md), so it runs non-root here.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ntfy
          image: docker.io/binwiederhier/ntfy:v2.37.2@sha256:1875ddcf815c8a3c981d6d78c67a93452d0abba79b1ab9520b1f5f5238902bd7
          args: ["serve"]
          env:
            # Default listen-http is :80, which a non-root process cannot bind without
            # NET_BIND_SERVICE; :8080 keeps all capabilities dropped.
            - name: NTFY_LISTEN_HTTP
              value: ":8080"
            - name: NTFY_CACHE_FILE
              value: /var/lib/ntfy/cache.db
            # Access control on, deny by default: topics are private until the owner creates
            # a user (README first-run steps; docs/config.md "Access control").
            - name: NTFY_AUTH_FILE
              value: /var/lib/ntfy/user.db
            - name: NTFY_AUTH_DEFAULT_ACCESS
              value: deny-all
            - name: NTFY_ENABLE_LOGIN
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # /v1/ready: 200 when the server should receive clients; /v1/health: liveness
          # (docs/config.md "Health checks").
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Sized from the upstream Kustomize example (requests 150m/150Mi, limits 200m/300Mi)
          # with the CPU limit of the upstream Deployment example (500m).
          resources:
            requests:
              cpu: 150m
              memory: 150Mi
            limits:
              cpu: 500m
              memory: 300Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/ntfy
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data
