# SPDX-License-Identifier: Apache-2.0
# ClusterIP only: the web page is reached through the gateway proxy, never published on the node.
apiVersion: v1
kind: Service
metadata:
  name: firefox
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: firefox
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
