; Neko's runtime/supervisord.conf (v3.2.0) with the user switching removed, so it runs as uid 1000 (supervisord
; refuses to switch users when it is not root) and logs to the container log. Apps add programs in
; /etc/neko/supervisord/*.conf with the same environment line and no user= key.
[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

[include]
files=/etc/neko/supervisord/*.conf

[program:x-server]
environment=HOME="/home/neko",USER="neko"
command=/usr/bin/X %(ENV_DISPLAY)s -config /etc/neko/xorg.conf -noreset -nolisten tcp
autorestart=true
priority=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pulseaudio]
environment=HOME="/home/neko",USER="neko",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/pulseaudio --log-level=error --disallow-module-loading --disallow-exit --exit-idle-time=-1
autorestart=true
priority=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
environment=HOME="/home/neko",USER="neko",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox
autorestart=true
priority=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:neko]
environment=HOME="/home/neko",USER="neko",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/neko serve --server.static "/var/www"
stopsignal=INT
stopwaitsecs=3
autorestart=true
priority=800
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
