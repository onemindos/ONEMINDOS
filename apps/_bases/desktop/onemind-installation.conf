# The box's Flatpak installation as the streaming pod sees it (issue #1097): the box mounts /data/onemind/flatpak
# read-only at the same path, so `flatpak run --installation=onemind` finds the apps the host service installed.
# Same name and path as os/rootfs/layers/onemind/etc/flatpak/installations.d/onemind.conf.
[Installation "onemind"]
Path=/data/onemind/flatpak
DisplayName=OneMind desktop apps
StorageType=harddisk
