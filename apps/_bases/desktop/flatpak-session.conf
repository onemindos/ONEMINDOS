; The program that shows a Flathub app on the streamed screen (issue #1097). The base keeps it as .disabled so the
; desktop base alone starts nothing; the desktop-apps runtime image renames it to flatpak-session.conf.
[program:flatpak-session]
environment=HOME="/home/neko",USER="neko",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/local/bin/onemind-desktop-session
autorestart=true
priority=900
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
