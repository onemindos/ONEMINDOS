# Web UI and API on 3000 (bin/docker/Dockerfile EXPOSE). The database has no Service.
apiVersion: v1
kind: Service
metadata:
  name: metabase
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: metabase
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
