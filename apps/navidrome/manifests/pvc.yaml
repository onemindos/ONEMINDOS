# SPDX-License-Identifier: Apache-2.0
# /data: database, cache and navidrome.toml. /music: the library Navidrome scans (read-only use).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-music
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
