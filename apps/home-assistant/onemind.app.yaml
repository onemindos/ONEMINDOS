# OneMind app manifest (contract sdk/contracts/poc-v0.md section 4).
# Sources: github.com/home-assistant/core release 2026.11.1 (tag commit d8a0dc698c89),
# LICENSE.md at that tag (Apache-2.0), image index digest read with crane on 2026-11-12.
apiVersion: onemind.app/v1alpha1
kind: App
metadata:
  id: home-assistant
  name: Home Assistant
  version: "2026.11.1"
  description: Open source home automation that puts local control and privacy first
  category: home-automation
  icon: icon.svg
  license: Apache-2.0
  source: https://github.com/home-assistant/core
  # §9.3 facts from the GitHub API (repos/home-assistant/core and its releases/latest), read 2026-11-12.
  links:
    docs: https://www.home-assistant.io/docs/
    github: https://github.com/home-assistant/core
    website: https://www.home-assistant.io
    support: https://github.com/home-assistant/core/issues
  upstream: {release: "2026.11.1", released_at: "2026-11-09T18:52:28Z", archived: false}
  tier: blocked   # set by CI (sdk/tools/app-gate --tier write), not by hand
spec:
  archs: [amd64, arm64]
  requires: {gpu: false, minMemoryMb: 2048}
  web: {port: 8123}
  manifests: manifests/
  updates: {channel: stable, automerge: patch}
