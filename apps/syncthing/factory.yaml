# SPDX-License-Identifier: Apache-2.0
# App factory recipe (sdk/tools/app-factory, .github/workflows/app-factory.yml). Why this app: the upstream image's
# Alpine base has brotli-libs 1.2.0-r1 (CRITICAL CVE-2026-111497, fixed in 1.2.1-r0) and upstream has not rebuilt.
apiVersion: onemind.factory/v1alpha1
kind: Recipe
app: syncthing
upstream:
  github: syncthing/syncthing
  tag_pattern: '^v\d+\.\d+\.\d+$'
  image: docker.io/syncthing/syncthing
  image_tag: "{version}"                   # release v2.1.7 is image tag 2.1.7
build:
  strategy: overlay
  restore_user: root                       # the image sets no USER; the manifest runs it as 1000
  patch:
    apk: [brotli-libs]
target:
  image: ghcr.io/onemindos/apps/syncthing
rebuild_after_days: 7
