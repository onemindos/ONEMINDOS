# OneMind config for Eclipse Mosquitto 2.1.x. Based on upstream docker/2.1-alpine/README.md and
# www/pages/documentation/dynamic-security.md at tag v2.1.2.
#
# Differences from the image's own default config (docker/2.1-alpine/mosquitto.conf):
# - no anonymous access (the image default is `allow_anonymous true`);
# - no `protocol http_api` dashboard listener on 9883: it is not exposed in this package.

listener 1883
allow_anonymous false

# Authentication and access control. On first start, with no config file present, the plugin writes
# a default config with users `admin` and `democlient` and random passwords stored in plain text at
# /mosquitto/data/dynamic-security.json.pw (README first-run steps: read it, change the passwords,
# delete the file).
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Retained messages and persistent sessions survive a restart (upstream docker README, "Configuration").
persistence_location /mosquitto/data/
plugin /usr/lib/mosquitto_persist_sqlite.so

log_dest stdout
