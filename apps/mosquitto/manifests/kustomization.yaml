# SPDX-License-Identifier: Apache-2.0
# Namespace-agnostic: the gateway's kubernetes executor sets namespace app-mosquitto (contract §3).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/part-of: onemind-apps
  includeSelectors: false
# The name gets a content hash, so a config change rolls the Deployment. start.sh writes the runtime
# config (with the optional NATS bridge) from it; see the README, "Bridge to NATS".
configMapGenerator:
- name: mosquitto-config
  files:
  - mosquitto.conf
  - start.sh
resources:
- pvc.yaml
- deployment.yaml
- service.yaml
