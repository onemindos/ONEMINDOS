# MQTT only (no web UI). In-cluster clients use mosquitto.app-mosquitto.svc:1883.
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
  - name: mqtt
    port: 1883
    targetPort: mqtt
    protocol: TCP
