# Scaffolded by sdk/tools/app-scaffold from github.com/AdguardTeam/AdGuardHome (contract §9.2),
# then completed from upstream at tag v0.107.80: the command-line options (options.go: --web-addr,
# "Address to serve the web UI on") and the image config (ENTRYPOINT /opt/adguardhome/AdGuardHome,
# CMD --no-check-update -c /opt/adguardhome/conf/AdGuardHome.yaml -w /opt/adguardhome/work).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-home
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard-home
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image runs as root so it can bind DNS on port 53. Here it runs as UID 1000 instead,
      # with no capabilities: the namespaced sysctl net.ipv4.ip_unprivileged_port_start (in the
      # Kubernetes "safe" set) lets an unprivileged process bind ports below 1024 in this pod's
      # own network namespace only.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      initContainers:
        # Creates the subPath directories as the app user. Without this the kubelet creates a
        # missing subPath as root, which the non-root app cannot write on volumes that do not
        # apply fsGroup (k3s local-path).
        - name: volume-dirs
          image: docker.io/adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
          command: ["sh", "-c", "mkdir -p /mnt/conf /mnt/work"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /mnt
      containers:
        - name: adguard-home
          image: docker.io/adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
          # The image CMD plus --web-addr, which pins the web UI (setup wizard and dashboard) to
          # port 3000 on every start, so the Service and spec.web.port stay correct after setup.
          args:
            - --no-check-update
            - -c
            - /opt/adguardhome/conf/AdGuardHome.yaml
            - -w
            - /opt/adguardhome/work
            - --web-addr
            - 0.0.0.0:3000
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          # GET / answers with a redirect (to /install.html before setup, /login.html after),
          # which the kubelet counts as success.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          # Upstream publishes no sizing; a OneMind choice with room for large blocklists.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
            - name: data
              mountPath: /opt/adguardhome/work
              subPath: work
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: adguard-home-data
