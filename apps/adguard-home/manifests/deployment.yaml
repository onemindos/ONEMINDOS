# Scaffolded by sdk/tools/app-scaffold from github.com/AdguardTeam/AdGuardHome (contract §9.2),
# then completed from upstream at tag v0.107.80: the command-line options (options.go: --web-addr,
# "Address to serve the web UI on") and the image config (ENTRYPOINT /opt/adguardhome/AdGuardHome,
# CMD --no-check-update -c /opt/adguardhome/conf/AdGuardHome.yaml -w /opt/adguardhome/work).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-home
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard-home
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image runs as root and cannot run as any other user here: on its first launch (no
      # AdGuardHome.yaml yet) AdGuard Home exits with "you must run it as administrator" unless
      # it is UID 0 or holds CAP_NET_BIND_SERVICE in the *ambient* set (internal/home/home.go
      # checkNetworkPermissions, internal/aghnet/net_linux.go canBindPrivilegedPorts at v0.107.80),
      # and Kubernetes cannot give a non-root container ambient capabilities. So runAsNonRoot is
      # not set (contract §9.4 check 8: non-root "where the image allows"), as for home-assistant.
      # Root here holds only NET_BIND_SERVICE (see the container) and cannot gain more.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adguard-home
          image: docker.io/adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
          # The image CMD plus --web-addr, which pins the web UI (setup wizard and dashboard) to
          # port 3000 on every start, so the Service and spec.web.port stay correct after setup.
          args:
            - --no-check-update
            - -c
            - /opt/adguardhome/conf/AdGuardHome.yaml
            - -w
            - /opt/adguardhome/work
            - --web-addr
            - 0.0.0.0:3000
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          # GET / answers with a redirect (to /install.html before setup, /login.html after),
          # which the kubelet counts as success.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          # Upstream publishes no sizing; a OneMind choice with room for large blocklists.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # NET_BIND_SERVICE binds DNS on port 53. It is also required to start at all: the image
          # marks its binary with a file capability (Dockerfile: `setcap 'cap_net_bind_service=+eip'
          # /opt/adguardhome/AdGuardHome`), and with every capability dropped the kernel refuses to
          # exec such a file ("operation not permitted"). Every other capability is dropped.
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
            - name: data
              mountPath: /opt/adguardhome/work
              subPath: work
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: adguard-home-data
