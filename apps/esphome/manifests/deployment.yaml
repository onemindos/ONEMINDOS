# Bumped from 2026.10.2 to 2026.11.1 on 2026-11-27; the upstream files cited here were read at 2026.10.2 and not re-read at 2026.11.1.
# ESPHome 2026.11.1, official image ghcr.io/esphome/esphome (github.com/esphome/esphome, docker/Dockerfile
# and docker/docker_entrypoint.sh at tag 2026.10.2): CMD dashboard /config, port 6052, HEALTHCHECK on
# GET /version. The entrypoint keeps PlatformIO packages and toolchains under /cache when it is mounted,
# "not writable when the container runs as a non-root user" otherwise; HOME points there too so the
# compilers can write their state as UID 1000. Compiling firmware is CPU and memory heavy.
#
# Pod: non-root, RuntimeDefault seccomp, no service-account token; containers: no privilege escalation, all capabilities dropped.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: esphome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: esphome
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: esphome
        image: ghcr.io/esphome/esphome:2026.11.1@sha256:eb1a5383cb1ce62df8683d7d728deaa5d8d78f0de0c6dccc9e3215cda53a1c6f
        imagePullPolicy: IfNotPresent
        env:
        - name: HOME
          value: /cache/home
        ports:
        - name: http
          containerPort: 6052
          protocol: TCP
        startupProbe:
          httpGet:
            path: /version
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /version
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /version
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /config
        - name: cache
          mountPath: /cache
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: esphome-config
      - name: cache
        persistentVolumeClaim:
          claimName: esphome-cache
