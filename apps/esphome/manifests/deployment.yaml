# ESPHome 2026.10.2, official image ghcr.io/esphome/esphome (github.com/esphome/esphome, docker/Dockerfile
# and docker/docker_entrypoint.sh at tag 2026.10.2): CMD dashboard /config, port 6052, HEALTHCHECK on
# GET /version. The entrypoint keeps PlatformIO packages and toolchains under /cache when it is mounted,
# "not writable when the container runs as a non-root user" otherwise; HOME points there too so the
# compilers can write their state as UID 1000. Compiling firmware is CPU and memory heavy.
#
# Pod: non-root, RuntimeDefault seccomp, no service-account token; containers: no privilege escalation, all capabilities dropped.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: esphome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: esphome
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: esphome
        image: ghcr.io/esphome/esphome:2026.10.2@sha256:4a918585150e95e7675be84a347384ff308fde1bd32d0e4472666e1252cc0e8f
        imagePullPolicy: IfNotPresent
        env:
        - name: HOME
          value: /cache/home
        ports:
        - name: http
          containerPort: 6052
          protocol: TCP
        startupProbe:
          httpGet:
            path: /version
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /version
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /version
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /config
        - name: cache
          mountPath: /cache
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: esphome-config
      - name: cache
        persistentVolumeClaim:
          claimName: esphome-cache
