# SPDX-License-Identifier: Apache-2.0
# Scaffolded by sdk/tools/app-scaffold from github.com/mealie-recipes/mealie (contract §9.2), then
# completed from upstream at tag v3.30.0: docker/Dockerfile (user abc, UID 911; port 9000; volume
# /app/data), docker/entry.sh (when the process already runs as PUID, default 911, it skips the
# root-only user switch), docker/healthcheck.sh (GET /api/app/about) and docker/docker-compose.yml
# (DB_ENGINE sqlite, ALLOW_SIGNUP false).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 911
        runAsGroup: 911
        fsGroup: 911
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.30.0@sha256:90f83da6f3ab0a421efc827118a556168573930105f13fa3321768f42163d784
          env:
            - name: DB_ENGINE
              value: sqlite
            - name: ALLOW_SIGNUP
              value: "false"
            # The URL the browser uses: the port-forward in README.md "First run".
            - name: BASE_URL
              value: http://localhost:9000
            - name: TZ
              value: UTC
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          # Database migrations run on the first start.
          startupProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          # Upstream publishes no sizing; a OneMind choice.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
