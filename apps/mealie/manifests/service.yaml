# Web UI and API on 9000 (APP_PORT in docker/Dockerfile).
apiVersion: v1
kind: Service
metadata:
  name: mealie
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mealie
  ports:
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
