# SPDX-License-Identifier: Apache-2.0
# The adapter code comes from the ConfigMap; the image is the stock python image, nothing installed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modbus-adapter
spec:
  replicas: 1   # one poller per device: two would read and publish every value twice
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: modbus-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modbus-adapter
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Stateless: no volume, keeps only the latest values in memory. Runs as nobody (65534).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: docker.io/library/python:3.14.10-slim-trixie@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
          # -I: isolated mode (no PYTHON* variables, no current directory on the path);
          # -B: no .pyc files, so the root filesystem can stay read-only.
          command: ["python3", "-I", "-B", "/opt/onemind/modbus_adapter.py"]
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: onemind-settings
                optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /opt/onemind
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: modbus-adapter-code
