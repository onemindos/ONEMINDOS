# SPDX-License-Identifier: Apache-2.0
# Scaffolded by sdk/tools/app-scaffold from github.com/umami-software/umami (contract §9.2), then
# completed from upstream at tag v3.5.0: docker-compose.yml (postgres:15, DATABASE_URL, APP_SECRET,
# TWO_FACTOR_ENCRYPTION_KEY, healthcheck GET /api/heartbeat), Dockerfile (USER nextjs, UID 1001;
# port 3000; CMD sh scripts/start-docker.sh), src/lib/app-secret.ts (refuses to start without
# APP_SECRET) and src/lib/two-factor/crypto.ts (the 2FA key is 256 bits in hex).
#
# PostgreSQL 15 runs as a native sidecar on 127.0.0.1 only and trusts local connections, so no
# database password or Secret exists. Both keys are generated once onto the database volume and
# exported by the container command before upstream's own start script runs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: umami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umami
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: secrets
          image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /mnt/onemind
              f=/mnt/onemind/secrets.env
              if [ ! -s "$f" ]; then
                umask 077
                hex() { node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))"; }
                printf 'APP_SECRET=%s\nTWO_FACTOR_ENCRYPTION_KEY=%s\n' "$(hex)" "$(hex)" > "$f"
              fi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db
              mountPath: /mnt
        - name: db
          image: docker.io/library/postgres:15.19-alpine@sha256:eab009ce9447a891d9482702d370bbf132c18563bb87cfdcc2b815c6d3b0372f
          restartPolicy: Always
          args: ["postgres", "-c", "listen_addresses=127.0.0.1"]
          env:
            - name: POSTGRES_USER
              value: umami
            - name: POSTGRES_DB
              value: umami
            # Only 127.0.0.1 and the pod's own socket reach this server.
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            # A subdirectory, so the data directory is owned by the postgres user even when the
            # volume root is not.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "umami", "-d", "umami"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "umami", "-d", "umami"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db
              mountPath: /var/lib/postgresql/data
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
          # Upstream's CMD, after loading the generated keys.
          args: ["sh", "-c", "set -a && . /onemind/secrets.env && set +a && exec sh scripts/start-docker.sh"]
          env:
            - name: DATABASE_URL
              value: postgresql://umami@127.0.0.1:5432/umami
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # Database migrations run on the first start (scripts/check-db.js).
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          # Upstream publishes no sizing; a OneMind choice.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db
              mountPath: /onemind
              subPath: onemind
              readOnly: true
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: umami-db
