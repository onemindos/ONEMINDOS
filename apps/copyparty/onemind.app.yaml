# copyparty: Market batch 5 (contract sdk/contracts/poc-v0.md §9.5), scaffolded by
# sdk/tools/app-scaffold (§9.2) and completed from primary sources: scripts/docker/README.md,
# scripts/docker/Dockerfile.ac, scripts/docker/innvikler.sh, copyparty/httpcli.py and
# docs/examples/docker/basic-docker-compose/copyparty.conf at v1.20.27.
# Image digest and archs from crane; licence from the GitHub licence API.
apiVersion: onemind.app/v1alpha1
kind: App
metadata:
  id: copyparty
  name: "copyparty"
  version: "1.20.27"
  description: "File server in one program: browse, upload, download and share files from a browser."
  # Market category slug from docs/design/TAXONOMY.md §1 (sub-tags are listed in README.md until
  # the schema has metadata.tags).
  category: files
  age_rating: 12   # proposed minimum age (apps/README.md rubric); the owner can override per app
  age_reason: "File server for uploading and sharing files; holds whatever people put in it."
  icon: icon.svg
  license: "MIT"
  licenceClass: L1
  source: https://github.com/9001/copyparty
  # §9.3 facts from the GitHub API (repos/9001/copyparty), read 2026-11-12. The repo sets no
  # homepage, so the website link is the repo's README.
  links:
    docs: "https://github.com/9001/copyparty#readme"
    github: "https://github.com/9001/copyparty"
    website: "https://github.com/9001/copyparty#readme"
    support: "https://github.com/9001/copyparty/issues"
  upstream: {release: "v1.20.27", released_at: "2026-11-22T22:53:22Z", archived: false}
  # unblocked 2026-11-23 (#147): v1.20.27 scans clean of fixable CRITICALs on amd64 and arm64 (README.md)
  tier: community   # set by CI (sdk/tools/app-gate --tier write), not by hand
spec:
  archs: [amd64, arm64]
  requires: {gpu: false, minMemoryMb: 512}
  web: {port: 3923}
  manifests: manifests/
  # automerge stays none until renovate.json lists this app (validate-apps check 9).
  updates: {channel: stable, automerge: none}
