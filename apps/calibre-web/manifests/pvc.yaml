# /config: app.db (users, settings) and logs. /books: the Calibre library (metadata.db plus book files).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-config
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-books
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
