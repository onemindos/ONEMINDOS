# Web UI and REST API on 8000. The database and Valkey have no Service.
apiVersion: v1
kind: Service
metadata:
  name: paperless-ngx
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paperless-ngx
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
