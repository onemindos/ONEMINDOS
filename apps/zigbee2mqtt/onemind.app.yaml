apiVersion: onemind.app/v1alpha1
kind: App
metadata:
  id: zigbee2mqtt
  name: Zigbee2MQTT
  version: "2.14.3"
  description: Bridges Zigbee devices to MQTT, so sensors, lights and switches work without a vendor hub
  category: home-automation
  icon: icon.svg
  license: GPL-3.0
  source: https://github.com/Koenkk/zigbee2mqtt
  # §9.3 facts from the GitHub API (repos/Koenkk/zigbee2mqtt and its releases/latest), read 2026-11-12.
  links:
    docs: https://www.zigbee2mqtt.io/guide/getting-started/
    github: https://github.com/Koenkk/zigbee2mqtt
    website: https://www.zigbee2mqtt.io
    support: https://github.com/Koenkk/zigbee2mqtt/issues
  upstream: {release: "2.14.3", released_at: "2026-11-01T06:40:40Z", archived: false}
  tier: verified   # set by CI (sdk/tools/app-gate --tier write), not by hand
spec:
  archs: [amd64, arm64]
  requires: {gpu: false, minMemoryMb: 256}
  web: {port: 8080}
  manifests: manifests/
  updates: {channel: stable, automerge: none}   # patch automerge needs a renovate.json entry (validate-apps check 8)
