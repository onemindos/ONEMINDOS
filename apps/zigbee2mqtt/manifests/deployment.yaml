# Zigbee2MQTT 2.14.3, upstream image (docker/Dockerfile at tag 2.14.3: alpine + node, no USER, EXPOSE 8080).
# The image runs as root by default; upstream documents running it as a non-root user with
# `user: 1000:1000` (Docker install guide, "Rootless container"), so the pod sets that UID/GID.
# v0 ships without device access: no /dev mount and no /run/udev, so only a network (TCP) Zigbee
# coordinator can be used. See README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
spec:
  replicas: 1
  # One writer: the Zigbee network database in /app/data and one coordinator connection.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zigbee2mqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zigbee2mqtt
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zigbee2mqtt
          image: ghcr.io/koenkk/zigbee2mqtt:2.14.3@sha256:fb4a6b0f6868ad1cd6a9996479802b2420e599c3463b62bbff8c8cd9a908f43a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Port 8080 serves the onboarding page on first start (lib/util/onboarding.ts, default
          # http://0.0.0.0:8080) and the frontend afterwards (frontend.port default 8080). Both answer
          # GET / with 200.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          # Upstream publishes no sizing. Requests follow the memory measured in the OneMind smoke test
          # (README.md, "Sizing"); the limit leaves room for a large Zigbee network.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data
