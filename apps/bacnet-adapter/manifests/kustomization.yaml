# SPDX-License-Identifier: Apache-2.0
# Namespace-agnostic: the gateway's kubernetes executor sets namespace app-bacnet-adapter (contract §3).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: bacnet-adapter
      app.kubernetes.io/part-of: onemind-apps
    includeSelectors: false
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: bacnet-adapter-code
    files:
      - fieldbus.py
      - bacnet_adapter.py
