# Scaffolded by sdk/tools/app-scaffold from github.com/grafana/grafana (contract §9.2), then
# completed from the image config (USER 472, EXPOSE 3000, /run.sh) and the Grafana docs:
# "Configure a Grafana Docker image" (GF_<SECTION>_<KEY> variables and the __FILE suffix) and
# the HTTP API page "Health API" (GET /api/health).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # SQLite (grafana.db) on a ReadWriteOnce volume: one writer.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Generates the first admin password once, on the data volume, instead of upstream's
        # default admin/admin. No Secret is committed (contract §11.2); README "First run" shows
        # how the owner reads it. Grafana uses it only when it creates its database.
        - name: admin-password
          image: docker.io/grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
          command:
            - sh
            - -c
            - |
              set -eu
              f=/var/lib/grafana/.onemind-admin-password
              if [ ! -s "$f" ]; then
                umask 077
                head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24 > "$f"
              fi
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: /var/lib/grafana/.onemind-admin-password
            # [analytics] reporting_enabled: no anonymous usage reports from the box.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          # The installation page "Hardware recommendations" lists 512 MB and 1 core minimum; the limits
          # match it.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
