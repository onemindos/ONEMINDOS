# SPDX-License-Identifier: Apache-2.0
# Scaffolded by sdk/tools/app-scaffold from github.com/Tautulli/Tautulli (contract §9.2), then
# completed from upstream at tag v2.19.1: Dockerfile (user tautulli, UID 1000; CMD python
# Tautulli.py --datadir /config; port 8181; HEALTHCHECK GET /status) and start.sh (the ENTRYPOINT:
# with TAUTULLI_DOCKER=True it runs groupmod, usermod and chown, then gosu to the tautulli user,
# all of which need root).
#
# Started as UID 1000 the user switch is not needed, so the container runs the image's CMD
# directly, without start.sh. TAUTULLI_DOCKER stays True (the image default) so Tautulli keeps its
# Docker behaviour (no self-update).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tautulli
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tautulli
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tautulli
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tautulli
          image: docker.io/tautulli/tautulli:v2.19.1@sha256:239cd6dbc429a0eb441bdf88a7a015871e2d4d6e02b6e6039af30c0487528a8e
          command: ["python", "Tautulli.py", "--datadir", "/config"]
          env:
            - name: TZ
              value: UTC
          ports:
            - name: http
              containerPort: 8181
              protocol: TCP
          startupProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          # Upstream publishes no sizing; a OneMind choice.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: tautulli-config
