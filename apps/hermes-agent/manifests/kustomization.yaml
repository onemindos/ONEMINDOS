# SPDX-License-Identifier: Apache-2.0
# Namespace-agnostic: the gateway's kubernetes executor sets namespace app-hermes-agent (contract §3).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/part-of: onemind-apps
    includeSelectors: false
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: hermes-agent-seed
    files:
      - seed/seed.py
      - seed/onemind.yaml
