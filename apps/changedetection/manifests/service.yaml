# Web UI and API on 5000 (docker-compose.yml).
apiVersion: v1
kind: Service
metadata:
  name: changedetection
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: changedetection
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
