# SPDX-License-Identifier: Apache-2.0
# Sonarr 4.0.20.3014, LinuxServer image (the Docker image upstream's wiki lists: wiki.servarr.com/sonarr/installation/docker).
# The image README (github.com/linuxserver/docker-sonarr, "Non-Root Operation") supports starting as a
# non-root user; PUID/PGID then have no effect and the init scripts take their LSIO_NON_ROOT_USER branch.
# s6-overlay 3.2.1.0 needs a writable /run: an emptyDir, which Kubernetes creates root-owned and group-
# writable, so S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES=1 lets its preinit accept it
# (s6-overlay libexec/preinit). GET /ping is anonymous (src/Sonarr.Http/Ping/PingController.cs).
#
# Pod: non-root, RuntimeDefault seccomp, no service-account token; containers: no privilege escalation, all capabilities dropped.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sonarr
        image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Etc/UTC
        - name: S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES
          value: '1'
        # The image sets LSIO_NON_ROOT_USER only when /run is owned by a non-root uid (/docker-mods). A
        # Kubernetes emptyDir is always root-owned, so without this the root-only init steps (usermod,
        # s6-setuidgid abc) run, fail without CAP_SETGID, and the app never starts (reproduced locally).
        - name: LSIO_NON_ROOT_USER
          value: '1'
        ports:
        - name: http
          containerPort: 8989
          protocol: TCP
        startupProbe:
          httpGet:
            path: /ping
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /config
        - name: tv
          mountPath: /tv
        - name: downloads
          mountPath: /downloads
        - name: run
          mountPath: /run
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sonarr-config
      - name: tv
        persistentVolumeClaim:
          claimName: sonarr-tv
      - name: downloads
        persistentVolumeClaim:
          claimName: sonarr-downloads
      - name: run
        emptyDir:
          sizeLimit: 1Gi
