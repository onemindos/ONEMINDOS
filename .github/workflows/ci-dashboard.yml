name: ci-dashboard

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/ci-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/ci-dashboard.yml'

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
