# SPDX-License-Identifier: Apache-2.0
name: ci-dashboard

on:
  workflow_dispatch:   # docs/testing/README.md §2 (test-all)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'dashboard/**'
      - 'ui/src/**'
      # The dashboard typechecks against the TS SDK generated from the spec (CI-16).
      - 'sdk/openapi/**'
      - 'sdk/ts/src/**'
      - '.github/actions/sdk-gen/**'
      - '.github/workflows/ci-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'ui/src/**'
      # The dashboard typechecks against the TS SDK generated from the spec (CI-16).
      - 'sdk/openapi/**'
      - 'sdk/ts/src/**'
      - '.github/actions/sdk-gen/**'
      - '.github/workflows/ci-dashboard.yml'

permissions:
  contents: read

concurrency:
  group: ci-dashboard-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dashboard:
    if: ${{ !github.event.pull_request.draft }}
    # CI-10 (#299): arm64-safe, no secrets. Local Mac runner when LOCAL_RUNNER=on and the event is trusted
    # (never a fork PR); otherwise GitHub-hosted. docs/learning/self-hosted-runner.md
    # merge_group only runs code already approved into the queue, so it is always trusted (no fork check); MQ_RUNNER unset keeps the old routing.
    runs-on: ${{ (vars.MQ_RUNNER == 'on' && github.event_name == 'merge_group') && fromJSON('["self-hosted","onemind-mq"]') || (vars.LOCAL_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-local"]') || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Generate the SDK code from the committed spec (CI-16, not committed)
        uses: ./.github/actions/sdk-gen
        with:
          langs: ts
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Shared runners can starve cold lazy imports when too many Vitest workers start together.
      - run: npm test -- --maxWorkers=2
      - run: npm run build
