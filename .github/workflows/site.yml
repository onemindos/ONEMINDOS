# SPDX-License-Identifier: Apache-2.0
# Website build and link check (site/README.md; docs/testing/CI-MATRIX.md §4). Builds on PRs; never
# deploys (hosting is a founder decision).
# The apps catalog is generated from apps/, so app changes rebuild the site too.
name: site

on:
  workflow_dispatch:   # docs/testing/README.md §2 (test-all)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'site/**'
      - 'apps/**'
      - '.github/workflows/site.yml'
      - 'scripts/check-links.py'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'apps/**'
      - '.github/workflows/site.yml'
      - 'scripts/check-links.py'

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    # CI-13 (#299): arm64-safe, no secrets, no Docker. Local Mac runner when LOCAL_RUNNER=on and the event is
    # trusted (never a fork PR); otherwise GitHub-hosted. docs/learning/self-hosted-runner.md
    runs-on: ${{ (vars.LOCAL_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Link check (every internal link and #fragment, links into this repository; offline)
        run: python3 -I ../scripts/check-links.py dist --repo-url https://github.com/onemindos/ONEMINDOS --repo-root ..
