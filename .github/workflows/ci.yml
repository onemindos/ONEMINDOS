# SPDX-License-Identifier: Apache-2.0
# Lint, unit tests, DCO, and OneMind's RAUC build on native runners (brief 30 D-B1.2, D-B1.4, B4.1).
name: ci
on:
  workflow_dispatch:   # docs/testing/README.md §2 (test-all)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:   # lets a GitHub merge queue be enabled later
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    # CI-10 (#299): arm64-safe, no secrets. Local Mac runner when LOCAL_RUNNER=on and the event is trusted
    # (never a fork PR); otherwise GitHub-hosted. docs/learning/self-hosted-runner.md
    # merge_group only runs code already approved into the queue, so it is always trusted (no fork check); MQ_RUNNER unset keeps the old routing.
    runs-on: ${{ (vars.MQ_RUNNER == 'on' && github.event_name == 'merge_group') && fromJSON('["self-hosted","onemind-mq"]') || (vars.DO_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-do"]') || (vars.LOCAL_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: scripts/lint.sh
      - name: App taxonomy is in sync (docs/design/TAXONOMY.md)
        run: python3 -I scripts/app-taxonomy.py --check
  unit:
    # CI-10 (#299): arm64-safe, no secrets. Local Mac runner when LOCAL_RUNNER=on and the event is trusted
    # (never a fork PR); otherwise GitHub-hosted. docs/learning/self-hosted-runner.md
    # merge_group only runs code already approved into the queue, so it is always trusted (no fork check); MQ_RUNNER unset keeps the old routing.
    runs-on: ${{ (vars.MQ_RUNNER == 'on' && github.event_name == 'merge_group') && fromJSON('["self-hosted","onemind-mq"]') || (vars.DO_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-do"]') || (vars.LOCAL_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get install -y python3-yaml
      # test_unit_security.py (systemd-analyze score gate) must run on Linux runners, never skip there.
      - run: python3 -I -m unittest discover -s test/unit -v
        env:
          ONEMIND_REQUIRE_SYSTEMD_ANALYZE: ${{ runner.os == 'Linux' && '1' || '0' }}
      # First boot runs with the gateway venv's Python and reuses onemind_core (box CA, NATS keys;
      # IMG-MESH-01): its hub tests need that venv, and skip under the system Python above
      # (so does the rescue-cert test in test_rescue_install.py, which signs with that CA).
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          # Exact version: "latest" resolves through the GitHub API, which times out now and then and fails the job. 0.13.9 is what CI ran when this was pinned.
          version: "0.13.9"
      - name: First-boot tests with the gateway's Python (onemind_core)
        run: |
          uv sync --project core --frozen --python 3.12 --quiet
          core/.venv/bin/python -I -m unittest discover -s test/unit -p 'test_firstboot.py' -v
          core/.venv/bin/python -I -m unittest discover -s test/unit -p 'test_rescue_install.py' -v
          core/.venv/bin/python -I -m unittest discover -s test/unit -p 'test_starting.py' -v
  mqtt-bridge:
    # Issue #199 (FLD-02): an MQTT 5 client round-trips a message through apps/mosquitto's bridge into
    # NATS and back, with the pinned Mosquitto and NATS images (apps/mosquitto/README.md "Bridge to NATS").
    # Needs Docker, so it runs on the onemind-kvm pool for trusted events and GitHub-hosted otherwise;
    # MOSQUITTO_BRIDGE_E2E=required turns a skip into a failure.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ (vars.KVM_RUNNER == 'on' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","onemind-kvm"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Mosquitto bridge tests (start.sh, and MQTT 5 round trip through NATS in Docker)
        env:
          MOSQUITTO_BRIDGE_E2E: required
          MOSQUITTO_BRIDGE_E2E_LOGS: "1"
        run: python3 -I -m unittest discover -s apps/mosquitto/tests -v
  changes:
    # CI-13 (#299): arm64-safe, no secrets, no Docker. Local Mac runner when LOCAL_RUNNER=on and the event is
    # trusted (never a fork PR); otherwise GitHub-hosted. docs/learning/self-hosted-runner.md
    # merge_group only runs code already approved into the queue, so it is always trusted (no fork check); MQ_RUNNER unset keeps the old routing.
    runs-on: ${{ (vars.MQ_RUNNER == 'on' && github.event_name == 'merge_group') && fromJSON('["self-hosted","onemind-mq"]') || (vars.LOCAL_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Change fragments are valid (changes/README.md)
        run: python3 -I scripts/changes.py check
      - name: Soft guard - CHANGELOG table edited directly
        if: github.event_name == 'pull_request' && github.head_ref != 'bot/changes-collect'
        run: |
          if git diff "origin/${{ github.base_ref }}...HEAD" -U0 -- CHANGELOG.md | grep -q '^+| '; then
            echo "::warning file=CHANGELOG.md::This PR edits the CHANGELOG table directly. Add changes/<branch>.md instead (see changes/README.md) so merges stop conflicting."
          fi
  dco:
    if: github.event_name == 'pull_request'
    # CI-13 (#299): arm64-safe, no secrets, no Docker. Local Mac runner when LOCAL_RUNNER=on and the event is
    # trusted (never a fork PR); otherwise GitHub-hosted. docs/learning/self-hosted-runner.md
    # merge_group only runs code already approved into the queue, so it is always trusted (no fork check); MQ_RUNNER unset keeps the old routing.
    runs-on: ${{ (vars.MQ_RUNNER == 'on' && github.event_name == 'merge_group') && fromJSON('["self-hosted","onemind-mq"]') || (vars.LOCAL_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Every commit carries a DCO sign-off (CONTRIBUTING.md)
        run: |
          bad=0
          for c in $(git rev-list --no-merges origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}); do
            git show -s --format=%B "$c" | grep -q '^Signed-off-by: ' || { echo "missing sign-off: $(git show -s --format='%h %s' "$c")"; bad=1; }
          done
          exit $bad
  rauc-build:
    if: ${{ !github.event.pull_request.draft }}
    # B4.1: RAUC v1.15.2 from tag + pinned commit 4fb7c798…, on both native architectures.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ (matrix.runner == 'ubuntu-24.04' && vars.KVM_RUNNER == 'on' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","onemind-kvm"]') || matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build RAUC (stage rauc-build)
        run: |
          docker buildx build -f os/rootfs/Containerfile --target rauc-build --progress plain \
            $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) . 2>&1 | tee rauc-build.log
          grep -q 'HEAD=4fb7c798d6ae412344fb8f8d310d773046af3441' rauc-build.log
          grep -E 'built: rauc v?1\.15\.2' rauc-build.log
