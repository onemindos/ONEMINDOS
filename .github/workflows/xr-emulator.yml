# SPDX-License-Identifier: Apache-2.0
# WebXR without a headset (issue #813, tests/e2e/README.md "Spatial"). IWER (Meta's Immersive Web Emulation
# Runtime, MIT) stands in for a Quest Pro and a Quest 3 inside headless Chromium; the specs enter and leave
# immersive-vr and immersive-ar on /spatial/diagnostics of a REAL hub (deploy/install.sh --role hub in a
# Debian 13 VM, the golden-path harness) and script the controllers and hands. They assert page state and
# draw counts, never frame rates. Proof on a real Quest Pro stays a hand step (needs:device-proof).
# Actions are pinned by commit as listed in os/versions.lock.yaml.
name: xr-emulator
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["dashboard/src/screens/spatial/**", "tests/e2e/spatial/**", "tests/e2e/lib/**", "tests/e2e/harness/**",
            "tests/e2e/playwright.config.ts", "tests/e2e/package.json", "tests/e2e/package-lock.json",
            ".github/workflows/xr-emulator.yml"]
  schedule:
    - cron: "41 4 * * *"   # nightly: changes elsewhere in the dashboard can break the spatial screens too
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xr-emulator-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  spatial:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ (vars.KVM_RUNNER == 'on' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","onemind-kvm"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.3"   # deploy/pins.env NODE_VERSION
      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: npm ci
        working-directory: tests/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: typecheck
        working-directory: tests/e2e
        run: npx tsc --noEmit
      - name: Spatial suite on a real hub (install.sh in a Debian 13 VM, then the spatial Playwright project)
        env:
          E2E_PW_WITH_DEPS: "1"
          E2E_PW_PROJECTS: spatial
        run: tests/e2e/harness/run.sh --backend qemu --no-verify
      - name: artifacts (screenshots and video of failures, report; never the secrets)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xr-emulator
          retention-days: 14
          path: |
            tests/e2e/out
            !tests/e2e/out/secrets
            !tests/e2e/out/vm
