# SPDX-License-Identifier: Apache-2.0
# Native Go fuzzing (go test -fuzz) of the parsers and checks onemindd trusts least: heartbeat and
# NATS subject handling, the heartbeat's RAUC and os-release parsers, and TUF metadata (version
# order, target selection, tampered channel files). ci-onemindd.yml already runs every target's
# seed corpus as a unit test; this job explores. Targets and their properties:
# docs/testing/PROPERTY-AND-FUZZ.md.
name: go-fuzz

on:
  # CI-11 (issue 298): informational, so never on every PR. A PR runs it only when it touches the
  # workflow's own harness; every change to the code it watches is covered on main, nightly and by hand.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["internal/**/*fuzz*_test.go", ".github/workflows/go-fuzz.yml"]
  push:
    branches: [main]
    paths: ["internal/**", "go.mod", "go.sum", ".github/workflows/go-fuzz.yml"]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-fuzz-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ (vars.KVM_RUNNER == 'on' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","onemind-kvm"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pkg: heartbeat, target: FuzzNodeIDSubject}
          - {pkg: heartbeat, target: FuzzStatusJSON}
          - {pkg: detect, target: FuzzParseRAUC}
          - {pkg: detect, target: FuzzParseKV}
          - {pkg: update, target: FuzzCompareVersions}
          - {pkg: update, target: FuzzSelect}
          - {pkg: update, target: FuzzTUFMetadataTampering}
    name: ${{ matrix.pkg }} ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false   # reused hosts: no shared module cache between jobs
      - name: go test -fuzz (30 s on a PR, 8 min at night)
        env:
          FUZZTIME: ${{ github.event_name == 'pull_request' && '30s' || '8m' }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/fuzz.log"
          if go test -run '^$' -fuzz "^${{ matrix.target }}\$" -fuzztime "$FUZZTIME" "./internal/${{ matrix.pkg }}" 2>&1 | tee "$log"; then
            exit 0
          fi
          # Go's fuzz engine sometimes fails a clean run with "context deadline exceeded" while it shuts
          # down at the end of -fuzztime (seen on PR #57, run 43570450213: 1.5M execs, no crasher). A real
          # finding always writes its input ("Failing input written to testdata/fuzz/..."), so only that
          # exact shutdown error with no input written passes, with a warning. Any other failure fails.
          if grep -q "context deadline exceeded" "$log" && ! grep -q "Failing input written" "$log" \
             && [ -z "$(git status --porcelain -- "internal/${{ matrix.pkg }}/testdata")" ]; then
            echo "::warning::${{ matrix.target }}: fuzz engine reported its own deadline at shutdown, no failing input; counted as a pass"
            exit 0
          fi
          exit 1
      # A failure writes the input to internal/<pkg>/testdata/fuzz/<target>/. Commit that file with
      # the fix: it then runs as a regression case in every `go test`.
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ matrix.pkg }}-${{ matrix.target }}
          path: internal/${{ matrix.pkg }}/testdata/fuzz/
          retention-days: 30
          if-no-files-found: ignore
