# SPDX-License-Identifier: Apache-2.0
# Real-browser quality gate for the ui/ demo and the dashboard (docs/testing/CI-MATRIX.md §1).
#   build:    ui demo (vite build) + dashboard mock build (VITE_MOCK=1), from the PR and, on a PR, also
#             from its base (the first parent of GitHub's merge commit, i.e. main as the PR merges into it);
#             ui/test pins, licences, typecheck
#   browsers: Playwright in Chromium, Firefox and WebKit, one job each: axe-core on every screen in
#             ui/test/e2e/screens.ts (light + dark, 1280 and 375 px), failing on any serious or critical
#             finding or console error; sign-in and navigation flows. On a PR also the visual comparison:
#             the screenshots are drawn from the base build, then the PR build is compared with them.
#   visual:   the verdict (CI-17, scripts/ui-visual-verdict.py). No screen differs: pass. Screens differ:
#             fail, unless the PR carries the label visual:accepted. The diffs are in playwright-report-<browser>.
#   visual-recheck: adding or removing a label starts a cheap run that re-uses the newest full run of
#             the commit (its axe, flows and screenshots) and decides again with the labels as they are now.
# Nothing is committed: no screenshot lives in git, and no job can write to the repository.
# A push to main or a manual run has no base to compare with: axe and flows only.
name: ui-quality
# Label runs are named so scripts/ui-visual-verdict.py can tell them apart; '' keeps GitHub's default name.
run-name: "${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && format('ui-quality: label re-check ({0} {1})', github.event.action, github.event.label.name) || '' }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - 'ui/**'
      - 'dashboard/**'
      - 'scripts/npm-licence-check.py'
      - 'scripts/ui-visual-verdict.py'
      - '.github/workflows/ui-quality.yml'
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'dashboard/**'
      - 'scripts/npm-licence-check.py'
      - 'scripts/ui-visual-verdict.py'
      - '.github/workflows/ui-quality.yml'
  workflow_dispatch:

permissions: {}

# A label re-check gets a group of its own: it must neither cancel nor be cancelled by the full run it reads.
concurrency:
  group: >-
    ui-quality-${{ github.event_name == 'pull_request' && github.event.action != 'labeled'
    && github.event.action != 'unlabeled' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # true on a PR event that renders the screens; false on push, manual runs and label re-checks.
  COMPARE: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  build:
    if: ${{ !github.event.pull_request.draft && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2 # the merge commit and its first parent (the base)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            dashboard/package-lock.json
            ui/test/package-lock.json
      - name: Browser-test dependencies are pinned and licence-clean
        run: python3 -I scripts/npm-licence-check.py ui/test --allow Apache-2.0 MIT MPL-2.0
      - name: Build the ui demo
        working-directory: ui
        run: npm ci && npm run build:demo
      - name: Build the dashboard (mock data, no gateway)
        working-directory: dashboard
        run: npm ci && npm run build:mock
      - name: Typecheck the browser tests
        working-directory: ui/test
        run: npm ci && npm run typecheck
      # The PR is checked out as GitHub's merge commit (PR on top of main). Its first parent is main as
      # the PR will merge into it, so only this PR's changes can differ, never another PR's.
      - name: Build the base (main) the screenshots are compared with
        if: ${{ env.COMPARE == 'true' }}
        run: |
          set -euo pipefail
          git worktree add --detach _base HEAD^1
          echo "base: $(git -C _base rev-parse HEAD)"
          (cd _base/ui && npm ci && npm run build:demo)
          # CI-16 (#386): once main stops committing the generated SDK, main's own script makes the TS
          # schema the dashboard imports. Before that, the committed file is used and there is no script.
          if [ -x _base/sdk/scripts/gen-code.sh ]; then _base/sdk/scripts/gen-code.sh ts; fi
          (cd _base/dashboard && npm ci && npm run build:mock)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-quality-builds
          path: |
            ui/dist-demo/
            dashboard/dist/
            _base/ui/dist-demo/
            _base/dashboard/dist/
          if-no-files-found: error
          retention-days: 3

  browsers:
    if: ${{ !github.event.pull_request.draft && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    name: ${{ matrix.browser }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: ui/test
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/test/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-quality-builds
          path: .
      - run: npm ci
      - name: Install ${{ matrix.browser }} (the build Playwright 1.64.1 pins) and its system libraries
        run: npx playwright install --with-deps "$BROWSER"
      - name: Playwright (axe on every screen, flows)
        run: npx playwright test --project="$BROWSER" --grep-invert @visual
      - name: Draw the reference screenshots from the base (main)
        if: ${{ !cancelled() && env.COMPARE == 'true' }}
        env:
          UI_DIST: ${{ github.workspace }}/_base/ui/dist-demo
          DASH_DIST: ${{ github.workspace }}/_base/dashboard/dist
          VISUAL_DIR: ${{ runner.temp }}/visual-base
          PW_REPORT: ${{ runner.temp }}/base-report
          PW_OUTPUT: ${{ runner.temp }}/base-results
          PW_GITHUB: '0'
        # A screen that fails to draw on the base gets no reference; the PR's run then lists it as changed.
        run: npx playwright test --project="$BROWSER" --grep @visual --update-snapshots=all || echo "::warning::some base screenshots could not be drawn"
      - name: Compare the PR with the base
        if: ${{ !cancelled() && env.COMPARE == 'true' }}
        env:
          VISUAL_DIR: ${{ runner.temp }}/visual-base
          PW_REPORT: playwright-report-visual
          PW_OUTPUT: test-results-visual
          PW_JSON: visual-results.json
          PW_GITHUB: '0'
        run: |
          # A difference makes Playwright exit 1; that is the verdict job's call, so carry on and list them.
          npx playwright test --project="$BROWSER" --grep @visual --update-snapshots=none || true
          mkdir -p "visual-changes-$BROWSER"
          python3 -I ../../scripts/ui-visual-verdict.py changes visual-results.json "visual-changes-$BROWSER/changes.txt"
      - name: Upload the report (traces, axe results, screenshot diffs)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            ui/test/playwright-report/
            ui/test/test-results/
            ui/test/playwright-report-visual/
            ui/test/test-results-visual/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the list of changed screens
        if: ${{ !cancelled() && env.COMPARE == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-changes-${{ matrix.browser }}
          path: ui/test/visual-changes-${{ matrix.browser }}/
          if-no-files-found: error
          retention-days: 14

  visual:
    needs: browsers
    if: ${{ !cancelled() && !github.event.pull_request.draft && github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the PR's timeline: when visual:accepted was added, when the newest commit came
      issues: read # the same timeline endpoint (repos/{repo}/issues/{pr}/timeline)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ui-visual-verdict.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: visual-changes-*
          path: ${{ runner.temp }}/changes
      - name: Decide (screens differ and no visual:accepted label added after the newest commit = fail)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REPORT_HINT: 'Diffs: artifact playwright-report-<browser>, open playwright-report-visual/index.html.'
        run: python3 -I scripts/ui-visual-verdict.py verdict "$RUNNER_TEMP/changes"

  # A label was added or removed. Re-rendering everything for a label would cost three browser jobs, so
  # this job waits for the newest full run of the same commit, requires its build, axe and flows to have
  # passed, and decides the visual verdict again with the labels as they are now. Its run is the newest
  # ui-quality run of the commit, so merge-gate reads this verdict (re-run merge-gate after labelling).
  visual-recheck:
    if: ${{ !github.event.pull_request.draft && (github.event.action == 'labeled' || github.event.action == 'unlabeled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70 # find-run waits up to 65 minutes (RECHECK_TIMEOUT_S) for the full run
    permissions:
      contents: read
      actions: read # find the full run of this commit and download its visual-changes-* artifacts
      pull-requests: read # the PR's timeline (labels and commits)
      issues: read # the same timeline endpoint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ui-visual-verdict.py
          sparse-checkout-cone-mode: false
      - name: Wait for the newest full run of this commit
        id: full
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I scripts/ui-visual-verdict.py find-run
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: visual-changes-*
          path: ${{ runner.temp }}/changes
          run-id: ${{ steps.full.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Decide again with the current labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REPORT_HINT: 'Diffs: artifact playwright-report-<browser> of the run named above.'
        run: python3 -I scripts/ui-visual-verdict.py verdict "$RUNNER_TEMP/changes"
