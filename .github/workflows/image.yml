# SPDX-License-Identifier: Apache-2.0
# Images per board from one Containerfile (brief 30 D-B1.5, D-B2.1, D-B2.2), then the battery.
# Debian 13 only (D-007). Artifacts are development images signed with throwaway keys.
name: image
on:
  pull_request:
    paths: ['os/**', 'test/qemu/**', 'cmd/**', 'internal/**', 'core/**', 'dashboard/**', 'ui/src/**', 'apps/**', 'go.mod', 'go.sum', '.dockerignore', 'Makefile', '.github/workflows/image.yml', '.github/workflows/battery.yml']
  push:
    branches: [main]
    paths: ['os/**', 'test/qemu/**', 'cmd/**', 'internal/**', 'core/**', 'dashboard/**', 'ui/src/**', 'apps/**', 'go.mod', 'go.sum', '.dockerignore', 'Makefile', '.github/workflows/image.yml', '.github/workflows/battery.yml']
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same PR cancels the superseded run; runs on main, tags and manual dispatches are never
# cancelled (each gets its own group).
concurrency:
  group: image-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {board: x86_64-efi, runner: ubuntu-24.04}
          - {board: vm,         runner: ubuntu-24.04}
          - {board: vm-do,      runner: ubuntu-24.04}
          - {board: arm64-efi,  runner: ubuntu-24.04-arm}
          - {board: rpi5,       runner: ubuntu-24.04-arm}   # no QEMU boot (Pi firmware): structure check + LT-PI5-01
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build rootfs
        run: |
          mkdir -p out
          docker buildx build -f os/rootfs/Containerfile --target rootfs --progress plain \
            --build-arg BOARD=${{ matrix.board }} $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=rootfs-debian-${{ matrix.board }} \
            --cache-to type=gha,mode=max,scope=rootfs-debian-${{ matrix.board }} \
            --output type=tar,dest=out/rootfs-debian-${{ matrix.board }}.tar .
      - name: Build tools image
        run: |
          docker buildx build -f os/rootfs/Containerfile --target tools --progress plain \
            $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=tools-${{ matrix.runner }} --cache-to type=gha,mode=max,scope=tools-${{ matrix.runner }} \
            --load -t onemind-tools:ci .
      - name: Assemble (throwaway dev keys, destroyed in the container)
        run: make image BOARD=${{ matrix.board }} TOOLS=onemind-tools:ci VERSION=0.1.0-dev.${{ github.run_number }}
      - name: Convert (raw.xz; VM formats for vm / vm-do)
        run: |
          sudo rm -f out/rootfs-*.tar
          make convert BOARD=${{ matrix.board }} TOOLS=onemind-tools:ci
          if [ "${{ matrix.board }}" = rpi5 ]; then
            make rpi5-check TOOLS=onemind-tools:ci
            make imager-json TOOLS=onemind-tools:ci VERSION=0.1.0-dev.${{ github.run_number }}
          fi
          sudo rm -f out/image-${{ matrix.board }}/*.img
          cat out/image-${{ matrix.board }}/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-debian-${{ matrix.board }}
          path: out/image-${{ matrix.board }}/
          retention-days: 14
          compression-level: 0
  # Smoke gate: one quick x86_64-efi first boot (F0-F4, test/qemu/CRITERIA-FIRSTBOOT.md) before the heavy
  # jobs (battery, cloud, installer) start, so a broken image fails here in minutes instead of in all of them.
  # Same build, fixtures and `make firstboot` as the battery's first-boot step; no criterion changes.
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
      - name: KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm 2>/dev/null && echo "accel: kvm" || echo "accel: tcg (no /dev/kvm on this runner)"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build rootfs (x86_64-efi)
        run: |
          mkdir -p out
          docker buildx build -f os/rootfs/Containerfile --target rootfs --progress plain \
            --build-arg BOARD=x86_64-efi $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=rootfs-debian-x86_64-efi \
            --cache-to type=gha,mode=max,scope=rootfs-debian-x86_64-efi \
            --output type=tar,dest=out/rootfs-debian-x86_64-efi.tar .
      - name: Build tools image
        run: |
          docker buildx build -f os/rootfs/Containerfile --target tools --progress plain \
            $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=tools-ubuntu-24.04 --cache-to type=gha,mode=max,scope=tools-ubuntu-24.04 \
            --load -t onemind-tools:ci .
      - name: Fixtures
        run: make fixtures BOARD=x86_64-efi UPTO=T5 TOOLS=onemind-tools:ci
      - name: First boot into OneMind (F0-F4)
        run: make firstboot BOARD=x86_64-efi FUPTO=F4 TOOLS=onemind-tools:ci
      - name: Summary and trimmed log
        if: always()
        run: |
          f=out/firstboot-x86_64-efi
          sudo chmod -R a+r out
          if [ -f $f/results.json ]; then python3 -I test/qemu/summary.py $f/results.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f $f/serial.log ]; then test/qemu/trim-log.sh $f/serial.log > $f/serial-trimmed.log; rm -f $f/serial.log; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-debian-x86_64-efi
          path: |
            out/firstboot-x86_64-efi/results.json
            out/firstboot-x86_64-efi/serial-trimmed.log
          retention-days: 14
  battery:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - {board: x86_64-efi, upto: T5, runner: ubuntu-24.04, firstboot: true}
          - {board: vm-do,      upto: T5, runner: ubuntu-24.04, firstboot: false}
          - {board: arm64-efi,  upto: T1, runner: ubuntu-24.04-arm, firstboot: true}
    uses: ./.github/workflows/battery.yml
    with:
      board: ${{ matrix.board }}
      upto: ${{ matrix.upto }}
      runner: ${{ matrix.runner }}
      firstboot: ${{ matrix.firstboot }}
  # Cloud images (docs/leap/core/CLOUD-IMAGES.md): one `cloud` rootfs, one image per cloud in the format
  # that cloud imports, then the cloud test on that exact artifact (test/qemu/CRITERIA-CLOUD.md).
  # Uploading to a cloud account is never done here (os/cloud/*-import.sh, run by the owner).
  cloud:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure, hetzner, proxmox]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - name: KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm 2>/dev/null && echo "accel: kvm" || echo "accel: tcg (no /dev/kvm on this runner)"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build the cloud rootfs
        run: |
          mkdir -p out
          docker buildx build -f os/rootfs/Containerfile --target rootfs --progress plain \
            --build-arg BOARD=cloud $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=rootfs-debian-cloud --cache-to type=gha,mode=max,scope=rootfs-debian-cloud \
            --output type=tar,dest=out/rootfs-debian-cloud.tar .
      - name: Build tools image
        run: |
          docker buildx build -f os/rootfs/Containerfile --target tools --progress plain \
            $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=tools-ubuntu-24.04 --cache-to type=gha,mode=max,scope=tools-ubuntu-24.04 \
            --load -t onemind-tools:ci .
      - name: Assemble and package (throwaway dev keys, destroyed in the container)
        run: |
          make cloud-image CLOUD=${{ matrix.cloud }} TOOLS=onemind-tools:ci VERSION=0.1.0-dev.${{ github.run_number }}
          sudo rm -f out/rootfs-*.tar
      - name: Cloud test (C0-C6 on the artifact)
        run: make cloud-test CLOUD=${{ matrix.cloud }} TOOLS=onemind-tools:ci
      - name: Summary; keep only the compressed artifacts
        if: always()
        run: |
          d=out/cloudboot-${{ matrix.cloud }}
          sudo chmod -R a+rw out
          if [ -f $d/results.json ]; then python3 -I test/qemu/summary.py $d/results.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f $d/serial.log ]; then test/qemu/trim-log.sh $d/serial.log > $d/serial-trimmed.log; rm -f $d/serial.log; fi
          rm -rf $d/work
          rm -f out/image-cloud-${{ matrix.cloud }}/*.raw out/image-cloud-${{ matrix.cloud }}/*.vhd
          cat out/image-cloud-${{ matrix.cloud }}/SHA256SUMS || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: image-debian-cloud-${{ matrix.cloud }}
          path: |
            out/image-cloud-${{ matrix.cloud }}/
            out/cloudboot-${{ matrix.cloud }}/
          retention-days: 14
          compression-level: 0
  # USB installer (os/boards/installer-x86_64/README.md): the x86_64-efi image packed onto a live
  # stick, then I1-I5 (test/qemu/CRITERIA-INSTALLER.md): boot the stick, install to an NVMe disk
  # through the menu, verify, reboot into OneMind. KVM here; TCG runs exceed the write budget.
  installer:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - name: KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm 2>/dev/null && echo "accel: kvm" || echo "accel: tcg (no /dev/kvm on this runner)"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build the x86_64-efi rootfs and tools image
        run: |
          mkdir -p out
          docker buildx build -f os/rootfs/Containerfile --target rootfs --progress plain \
            --build-arg BOARD=x86_64-efi $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=rootfs-debian-x86_64-efi \
            --output type=tar,dest=out/rootfs-debian-x86_64-efi.tar .
          docker buildx build -f os/rootfs/Containerfile --target tools --progress plain \
            $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=tools-ubuntu-24.04 --load -t onemind-tools:ci .
      - name: Image, then the installer stick (throwaway dev keys, destroyed in the container)
        run: |
          make image BOARD=x86_64-efi TOOLS=onemind-tools:ci VERSION=0.1.0-dev.${{ github.run_number }}
          sudo rm -f out/rootfs-debian-*.tar
          make installer BOARD=installer-x86_64 TOOLS=onemind-tools:ci
      - name: Installer test (I1-I5)
        run: make installer-test BOARD=installer-x86_64 TOOLS=onemind-tools:ci
      - name: Summary; keep only the stick image (compressed) and the logs
        if: always()
        run: |
          d=out/test-installer-x86_64
          # The container wrote out/ as root. chmod alone is not enough: xz tries to copy the owner and group of the
          # root-owned stick image onto the .xz and exits 2 ("Cannot set the file group") although the file is fine.
          sudo chown -R "$(id -u):$(id -g)" out
          sudo chmod -R a+rw out
          if [ -f $d/results.json ]; then python3 -I test/qemu/summary.py $d/results.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f $d/serial.log ]; then test/qemu/trim-log.sh $d/serial.log > $d/serial-trimmed.log; rm -f $d/serial.log; fi
          rm -rf $d/work
          for f in out/installer-x86_64/*.img; do [ -f "$f" ] && xz -T0 -3 "$f"; done
          cat out/installer-x86_64/SHA256SUMS || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: installer-debian-x86_64
          path: |
            out/installer-x86_64/
            out/test-installer-x86_64/
          retention-days: 14
          compression-level: 0
