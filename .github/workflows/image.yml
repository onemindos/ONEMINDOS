# SPDX-License-Identifier: Apache-2.0
# Images per board from one Containerfile (brief 30 D-B1.5, D-B2.1, D-B2.2), then the battery.
# Debian 13 only (D-007). Artifacts are development images signed with throwaway keys.
name: image
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['os/**', 'test/qemu/**', 'cmd/**', 'internal/**', 'core/**', 'dashboard/**', 'ui/src/**', 'apps/**', 'go.mod', 'go.sum', '.dockerignore', 'Makefile', '.github/workflows/image.yml', '.github/workflows/battery.yml']
  push:
    branches: [main, release/next]
    paths: ['os/**', 'test/qemu/**', 'cmd/**', 'internal/**', 'core/**', 'dashboard/**', 'ui/src/**', 'apps/**', 'go.mod', 'go.sum', '.dockerignore', 'Makefile', '.github/workflows/image.yml', '.github/workflows/battery.yml']
  # Nightly, 3:17 AM ET (08:17 UTC in winter, 09:17 in summer; off the hour on purpose). Builds tier 1 + 2.
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Also build tier 3 (vm-do, rpi5, aws, azure, gcp, hetzner) and run the vm-do and arm64-efi batteries'
        type: boolean
        default: false
permissions:
  contents: read
# WHICH MATRIX RUNS WHEN (founder, 2026-11-25: "tier 1 images and tier 2 images for now since we have devices to
# test them, and tier 3 as a PR for later; move Pi 5 to tier 3"; tier 3 is tracked in issue #1110).
# No test is weakened, only which entries run. The scope job output `full` decides about tier 3.
#   Tier 1 (every run that builds images: PR, push to main or release/next, nightly, any dispatch):
#     image x86_64-efi, the installer job (x86 USB installer), smoke (first boot F0-F4 + boot menu lock),
#     battery x86_64-efi up to T5 (with first boot and its firewall check).
#   Tier 2 (same runs): image arm64-efi, image vm (generic VM), cloud proxmox.
#   Tier 3 (ONLY workflow_dispatch with full=true): images vm-do and rpi5 (rpi5 has no QEMU boot: structure check
#     + LT-PI5-01), clouds aws, azure, gcp, hetzner, and the vm-do and arm64-efi batteries. Jetson is tier 3 too
#     and is not built here yet.
#   dataenc stays manual (dispatch) as before.
# The arm64-efi battery (T1) is tier 3 for now, not tier 2: F11 (time_to_dashboard 93.9 s against the 90 s budget)
# failed on the hosted arm64 runner. TODO: investigate that runner's speed (the budget is NOT to be changed);
# move the arm64-efi battery into the always-on matrix once F11 passes there. The arm64-efi IMAGE still builds.
# A release or a dev build needs the tier 3 artifacts, so it must come from a full dispatch run (see release.yml
# and dev-build.yml); the ordinary tier 1 + 2 runs do not carry them.
# Concurrency: a newer push to the same PR cancels that PR's superseded run (different PRs have different refs, so
# they never cancel each other); a newer push to release/next cancels the superseded release/next run; runs on
# main, the nightly schedule and manual dispatches are never cancelled (each gets its own group).
concurrency:
  group: image-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'push' && github.ref == 'refs/heads/release/next' && 'release-next') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/release/next') }}
jobs:
  # CI-14 (leap run): which part of this workflow the PR needs (scripts/ci-image-scope.py). A PR that only
  # changes the image's payload (core/, dashboard/, ui/src/, apps/, sdk/) gets the x86_64-efi first-boot smoke
  # (the gateway really starts on the image) plus e2e.yml's golden path; the tier 1 + 2 image builds, battery,
  # cloud and installer jobs run for OS PRs, on every push and on every dispatch. Tier 3 only on a full dispatch.
  scope:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ (vars.KVM_RUNNER == 'on' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","onemind-kvm"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      os: ${{ steps.s.outputs.os }}
      full: ${{ steps.full.outputs.full }}
      sb: ${{ steps.sb.outputs.sb }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: full
        name: Tier 3 too (full dispatch only)?
        env:
          FULL_INPUT: ${{ inputs.full }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$FULL_INPUT" = true ]; then
            echo full=true | tee -a "$GITHUB_OUTPUT"
          else
            echo full=false | tee -a "$GITHUB_OUTPUT"
          fi
      - id: s
        name: OS change or payload only?
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo os=true | tee -a "$GITHUB_OUTPUT"; exit 0; fi
          # Any API error (even on a later page, after earlier pages printed) means os=true. A rename also
          # lists its old path, so moving a file out of os/ still counts as an OS change.
          if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
               --jq '.[] | .filename, (.previous_filename // empty)' > files.txt; then
            echo os=true | tee -a "$GITHUB_OUTPUT"; exit 0
          fi
          python3 -I scripts/ci-image-scope.py < files.txt | tee -a "$GITHUB_OUTPUT"
      # S-13: the Secure Boot test (SB1-SB4) is slow, so on a PR it runs only when the files it covers change.
      # Push, dispatch and any API error run it.
      - id: sb
        name: Secure Boot files changed?
        run: |
          if [ ! -s files.txt ] || grep -Eq '^(os/secureboot/|os/rootfs/|os/assemble/|test/qemu/(secureboot|uki|CRITERIA-SECUREBOOT)|Makefile$|\.github/workflows/(image|battery)\.yml$)' files.txt; then
            echo sb=true | tee -a "$GITHUB_OUTPUT"
          else
            echo sb=false | tee -a "$GITHUB_OUTPUT"
          fi
  image:
    needs: scope
    if: ${{ !github.event.pull_request.draft && needs.scope.outputs.os == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # tier 1 + 2: x86_64-efi, vm, arm64-efi. full dispatch adds tier 3: vm-do, rpi5 (no QEMU boot: structure check + LT-PI5-01)
        include: ${{ fromJSON(needs.scope.outputs.full == 'true' && '[{"board":"x86_64-efi","runner":"ubuntu-24.04"},{"board":"vm","runner":"ubuntu-24.04"},{"board":"arm64-efi","runner":"ubuntu-24.04-arm"},{"board":"vm-do","runner":"ubuntu-24.04"},{"board":"rpi5","runner":"ubuntu-24.04-arm"}]' || '[{"board":"x86_64-efi","runner":"ubuntu-24.04"},{"board":"vm","runner":"ubuntu-24.04"},{"board":"arm64-efi","runner":"ubuntu-24.04-arm"}]') }}
    # CI-14: x86 + KVM on a Proxmox VE host when KVM_RUNNER=on and the event is trusted (allow-list); else GitHub-hosted
    runs-on: ${{ (matrix.runner == 'ubuntu-24.04' && vars.KVM_RUNNER == 'on' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","onemind-kvm"]') || matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build rootfs
        run: |
          mkdir -p out
          docker buildx build -f os/rootfs/Containerfile --target rootfs --progress plain \
            --build-arg BOARD=${{ matrix.board }} $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=rootfs-debian-${{ matrix.board }} \
            --cache-to type=gha,mode=max,scope=rootfs-debian-${{ matrix.board }} \
            --output type=tar,dest=out/rootfs-debian-${{ matrix.board }}.tar .
      - name: Build tools image
        run: |
          docker buildx build -f os/rootfs/Containerfile --target tools --progress plain \
            $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=tools-${{ matrix.runner }} --cache-to type=gha,mode=max,scope=tools-${{ matrix.runner }} \
            --load -t onemind-tools:ci .
      - name: Assemble (throwaway dev keys, destroyed in the container)
        run: make image BOARD=${{ matrix.board }} TOOLS=onemind-tools:ci VERSION=0.1.0-dev.${{ github.run_number }}
      - name: Convert (raw.xz; VM formats for vm / vm-do)
        run: |
          sudo rm -f out/rootfs-*.tar
          make convert BOARD=${{ matrix.board }} TOOLS=onemind-tools:ci
          if [ "${{ matrix.board }}" = rpi5 ]; then
            make rpi5-check TOOLS=onemind-tools:ci
            make imager-json TOOLS=onemind-tools:ci VERSION=0.1.0-dev.${{ github.run_number }}
          fi
          sudo rm -f out/image-${{ matrix.board }}/*.img
          cat out/image-${{ matrix.board }}/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-debian-${{ matrix.board }}
          path: out/image-${{ matrix.board }}/
          retention-days: 14
          compression-level: 0
  # Smoke gate: one quick x86_64-efi first boot (F0-F4, test/qemu/CRITERIA-FIRSTBOOT.md) before the heavy
  # jobs (battery, cloud, installer) start, so a broken image fails here in minutes instead of in all of them.
  # Same build, fixtures and `make firstboot` as the battery's first-boot step; no criterion changes.
  smoke:
    if: ${{ !github.event.pull_request.draft }}
    # CI-14: x86 + KVM on a Proxmox VE host when KVM_RUNNER=on and the event is trusted (allow-list); else GitHub-hosted
    runs-on: ${{ (vars.KVM_RUNNER == 'on' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","onemind-kvm"]') || 'ubuntu-24.04' }}
    # 90, not 45: on a busy KVM host a PASSING smoke takes about 44 minutes (tools image 6, fixtures 13, first boot
    # 20+), so 45 cancelled about half of them and each cancelled run cost 45 runner-minutes plus a re-run.
    # A broken image still fails early: test/qemu/firstboot.py has its own per-step timeouts (10 to 15 minutes).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
      - name: KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm 2>/dev/null && echo "accel: kvm" || echo "accel: tcg (no /dev/kvm on this runner)"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build rootfs (x86_64-efi)
        run: |
          mkdir -p out
          docker buildx build -f os/rootfs/Containerfile --target rootfs --progress plain \
            --build-arg BOARD=x86_64-efi $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=rootfs-debian-x86_64-efi \
            --cache-to type=gha,mode=max,scope=rootfs-debian-x86_64-efi \
            --output type=tar,dest=out/rootfs-debian-x86_64-efi.tar .
      - name: Build tools image
        run: |
          docker buildx build -f os/rootfs/Containerfile --target tools --progress plain \
            $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=tools-ubuntu-24.04 --cache-to type=gha,mode=max,scope=tools-ubuntu-24.04 \
            --load -t onemind-tools:ci .
      - name: Fixtures
        run: make fixtures BOARD=x86_64-efi UPTO=T5 TOOLS=onemind-tools:ci
      - name: First boot into OneMind (F0-F4)
        run: make firstboot BOARD=x86_64-efi FUPTO=F4 TOOLS=onemind-tools:ci
      # Boot menu lock (B1-B6, test/qemu/CRITERIA-BOOTLOCK.md): `e` at GRUB asks for a login. Runs after firstboot
      # because `make firstboot` removes the work disk it copied, and this copies the fixture disk again.
      - name: Boot menu lock (B1-B6)
        run: make bootlock BOARD=x86_64-efi TOOLS=onemind-tools:ci
      # Go back to the previous OS version (RB0-RB4, test/qemu/CRITERIA-ROLLBACK.md, P-16): a good update, then an
      # approved os-rollback through the host service boots slot A again and the gate commits it. Copies the fixture disk.
      - name: Go back to the previous version (RB0-RB4)
        run: make rollback BOARD=x86_64-efi TOOLS=onemind-tools:ci
      - name: Summary and trimmed log
        if: always()
        run: |
          f=out/firstboot-x86_64-efi
          sudo chmod -R a+r out
          if [ -f $f/results.json ]; then python3 -I test/qemu/summary.py $f/results.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f $f/serial.log ]; then test/qemu/trim-log.sh $f/serial.log > $f/serial-trimmed.log; rm -f $f/serial.log; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-debian-x86_64-efi
          path: |
            out/firstboot-x86_64-efi/results.json
            out/firstboot-x86_64-efi/serial-trimmed.log
            out/bootlock-x86_64-efi/results.json
            out/rollback-x86_64-efi/results.json
          retention-days: 14
  # Encrypted /data (E1-E4, test/qemu/CRITERIA-DATAENC.md): a software TPM boots a luks2 image. Manual only
  # (Actions > image > Run workflow on the branch) until the data layout default flips to luks2; CI is saturated
  # and this is a 45-minute KVM job. Its first run is the first time this code boots anywhere.
  dataenc:
    if: ${{ github.event_name == 'workflow_dispatch' && !github.event.pull_request.draft }}
    runs-on: ${{ (vars.KVM_RUNNER == 'on' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","onemind-kvm"]') || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build rootfs (x86_64-efi)
        run: |
          mkdir -p out
          docker buildx build -f os/rootfs/Containerfile --target rootfs --progress plain \
            --build-arg BOARD=x86_64-efi $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --output type=tar,dest=out/rootfs-debian-x86_64-efi.tar .
      - name: Build tools image
        run: |
          docker buildx build -f os/rootfs/Containerfile --target tools --progress plain \
            $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) --load -t onemind-tools:ci .
      - name: Fixtures with a blank, encrypt-on-first-boot data partition
        run: make fixtures BOARD=x86_64-efi UPTO=T5 DATA_FS=luks2 TOOLS=onemind-tools:ci
      - name: Encrypted data (E1-E4)
        run: make dataenc BOARD=x86_64-efi TOOLS=onemind-tools:ci
      - name: Summary
        if: always()
        run: |
          sudo chmod -R a+r out
          f=out/dataenc-x86_64-efi
          if [ -f $f/results.json ]; then python3 -I test/qemu/summary.py $f/results.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f $f/serial.log ]; then test/qemu/trim-log.sh $f/serial.log > $f/serial-trimmed.log; rm -f $f/serial.log; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dataenc-debian-x86_64-efi
          path: |
            out/dataenc-x86_64-efi/results.json
            out/dataenc-x86_64-efi/serial-trimmed.log
          retention-days: 14
  battery:
    if: ${{ !github.event.pull_request.draft && needs.scope.outputs.os == 'true' }}
    needs: [scope, smoke]
    strategy:
      fail-fast: false
      matrix:
        # always x86_64-efi to T5. Full dispatch (tier 3) adds vm-do and arm64-efi (T1: its F11 time_to_dashboard
        # failed at 93.9 s against 90 s on the hosted arm64 runner; investigate, do not change the budget).
        include: ${{ fromJSON(needs.scope.outputs.full == 'true' && '[{"board":"x86_64-efi","upto":"T5","runner":"ubuntu-24.04","firstboot":true,"firewall":true},{"board":"vm-do","upto":"T5","runner":"ubuntu-24.04","firstboot":false,"firewall":false},{"board":"arm64-efi","upto":"T1","runner":"ubuntu-24.04-arm","firstboot":true,"firewall":false}]' || '[{"board":"x86_64-efi","upto":"T5","runner":"ubuntu-24.04","firstboot":true,"firewall":true}]') }}
    uses: ./.github/workflows/battery.yml
    with:
      board: ${{ matrix.board }}
      upto: ${{ matrix.upto }}
      runner: ${{ matrix.runner }}
      firstboot: ${{ matrix.firstboot }}
      secureboot: ${{ matrix.board == 'x86_64-efi' && needs.scope.outputs.sb == 'true' }}
      firewall: ${{ matrix.firewall }}
  # Cloud images (docs/leap/core/CLOUD-IMAGES.md): one `cloud` rootfs, one image per cloud in the format
  # that cloud imports, then the cloud test on that exact artifact (test/qemu/CRITERIA-CLOUD.md).
  # Uploading to a cloud account is never done here (os/cloud/*-import.sh, run by the owner).
  cloud:
    if: ${{ !github.event.pull_request.draft && needs.scope.outputs.os == 'true' }}
    needs: [scope, smoke]
    strategy:
      fail-fast: false
      matrix:
        # tier 2: proxmox. Full dispatch (tier 3) adds aws, gcp, azure, hetzner.
        cloud: ${{ fromJSON(needs.scope.outputs.full == 'true' && '["proxmox","aws","gcp","azure","hetzner"]' || '["proxmox"]') }}
    # CI-14: x86 + KVM on a Proxmox VE host when KVM_RUNNER=on and the event is trusted (allow-list); else GitHub-hosted
    runs-on: ${{ (vars.KVM_RUNNER == 'on' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","onemind-kvm"]') || 'ubuntu-24.04' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - name: KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm 2>/dev/null && echo "accel: kvm" || echo "accel: tcg (no /dev/kvm on this runner)"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build the cloud rootfs
        run: |
          mkdir -p out
          docker buildx build -f os/rootfs/Containerfile --target rootfs --progress plain \
            --build-arg BOARD=cloud $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=rootfs-debian-cloud --cache-to type=gha,mode=max,scope=rootfs-debian-cloud \
            --output type=tar,dest=out/rootfs-debian-cloud.tar .
      - name: Build tools image
        run: |
          docker buildx build -f os/rootfs/Containerfile --target tools --progress plain \
            $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=tools-ubuntu-24.04 --cache-to type=gha,mode=max,scope=tools-ubuntu-24.04 \
            --load -t onemind-tools:ci .
      - name: Assemble and package (throwaway dev keys, destroyed in the container)
        run: |
          make cloud-image CLOUD=${{ matrix.cloud }} TOOLS=onemind-tools:ci VERSION=0.1.0-dev.${{ github.run_number }}
          sudo rm -f out/rootfs-*.tar
      - name: Cloud test (C0-C6 on the artifact)
        run: make cloud-test CLOUD=${{ matrix.cloud }} TOOLS=onemind-tools:ci
      - name: Summary; keep only the compressed artifacts
        if: always()
        run: |
          d=out/cloudboot-${{ matrix.cloud }}
          sudo chmod -R a+rw out
          if [ -f $d/results.json ]; then python3 -I test/qemu/summary.py $d/results.json >> "$GITHUB_STEP_SUMMARY"; fi
          # The masked last 400 lines too: the AWS C1 flake hangs before any evidence line is printed.
          if [ -f $d/serial.log ]; then
            test/qemu/trim-log.sh $d/serial.log > $d/serial-trimmed.log
            test/qemu/trim-log.sh --tail 400 $d/serial.log > $d/serial-tail.log
            test/qemu/trim-log.sh --diag $d/serial.log > $d/serial-diag.log
            rm -f $d/serial.log
          fi
          rm -rf $d/work
          rm -f out/image-cloud-${{ matrix.cloud }}/*.raw out/image-cloud-${{ matrix.cloud }}/*.vhd
          cat out/image-cloud-${{ matrix.cloud }}/SHA256SUMS || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: image-debian-cloud-${{ matrix.cloud }}
          path: |
            out/image-cloud-${{ matrix.cloud }}/
            out/cloudboot-${{ matrix.cloud }}/
          retention-days: 14
          compression-level: 0
  # USB installer (os/boards/installer-x86_64/README.md): the x86_64-efi image packed onto a live
  # stick, then I1-I5 (test/qemu/CRITERIA-INSTALLER.md): boot the stick, install to an NVMe disk
  # through the menu, verify, reboot into OneMind. KVM here; TCG runs exceed the write budget.
  installer:
    # tier 1 (see the rule at the top): every run that builds images
    if: ${{ !github.event.pull_request.draft && needs.scope.outputs.os == 'true' }}
    needs: [scope, smoke]
    # CI-14: x86 + KVM on a Proxmox VE host when KVM_RUNNER=on and the event is trusted (allow-list); else GitHub-hosted
    runs-on: ${{ (vars.KVM_RUNNER == 'on' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","onemind-kvm"]') || 'ubuntu-24.04' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - name: KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm 2>/dev/null && echo "accel: kvm" || echo "accel: tcg (no /dev/kvm on this runner)"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build the x86_64-efi rootfs and tools image
        run: |
          mkdir -p out
          docker buildx build -f os/rootfs/Containerfile --target rootfs --progress plain \
            --build-arg BOARD=x86_64-efi $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=rootfs-debian-x86_64-efi \
            --output type=tar,dest=out/rootfs-debian-x86_64-efi.tar .
          docker buildx build -f os/rootfs/Containerfile --target tools --progress plain \
            $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=tools-ubuntu-24.04 --load -t onemind-tools:ci .
      - name: Image, then the installer stick (throwaway dev keys, destroyed in the container)
        run: |
          make image BOARD=x86_64-efi TOOLS=onemind-tools:ci VERSION=0.1.0-dev.${{ github.run_number }}
          sudo rm -f out/rootfs-debian-*.tar
          make installer BOARD=installer-x86_64 TOOLS=onemind-tools:ci
      - name: Installer test (I1-I5)
        run: make installer-test BOARD=installer-x86_64 TOOLS=onemind-tools:ci
      - name: Keep the update bundles and the dev CA of this stick's image (same throwaway CA as the stick; see os/boards/installer-x86_64/UPDATES.md)
        if: success()
        run: |
          # The matrix job's x86_64-efi image has a different throwaway CA, so only the bundles built together with
          # the image inside this stick can update a box installed from it. Public CA certificate only, no key.
          # out/installer-x86_64 is root-owned (make installer runs in a container without --user); the next step chowns it back.
          sudo cp out/image-x86_64-efi/onemind-x86_64-efi-*.raucb out/image-x86_64-efi/dev-ca.cert.pem out/installer-x86_64/
          ls -l out/installer-x86_64
      - name: Summary; keep only the stick image (compressed) and the logs
        if: always()
        run: |
          d=out/test-installer-x86_64
          # The container wrote out/ as root. chmod alone is not enough: xz tries to copy the owner and group of the
          # root-owned stick image onto the .xz and exits 2 ("Cannot set the file group") although the file is fine.
          sudo chown -R "$(id -u):$(id -g)" out
          sudo chmod -R a+rw out
          if [ -f $d/results.json ]; then python3 -I test/qemu/summary.py $d/results.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f $d/serial.log ]; then test/qemu/trim-log.sh $d/serial.log > $d/serial-trimmed.log; rm -f $d/serial.log; fi
          rm -rf $d/work
          for f in out/installer-x86_64/*.img; do [ -f "$f" ] && xz -T0 -3 "$f"; done
          cat out/installer-x86_64/SHA256SUMS || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: installer-debian-x86_64
          path: |
            out/installer-x86_64/
            out/test-installer-x86_64/
          retention-days: 14
          compression-level: 0
