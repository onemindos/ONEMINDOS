# SPDX-License-Identifier: Apache-2.0
# deploy/ (contract poc-v0 §6): lint the scripts and units, check pins against os/versions.lock.yaml,
# dry-run install.sh for every target, test verify.sh/natscheck against a mock hub and a real NATS,
# bring up the compose dev hub and run verify.sh against it, and run the systemd end-to-end test
# (install.sh from an offline bundle on two Debian 13 systemd containers; ported from PR #27).
name: ci-deploy
on:
  workflow_dispatch:   # docs/testing/README.md §2 (test-all)
  pull_request:
    paths: ["deploy/**", "core/**", "cmd/**", "internal/**", "dashboard/**", "ui/src/**", "apps/**", "os/versions.lock.yaml", ".github/workflows/ci-deploy.yml"]
  push:
    branches: [main]
    paths: ["deploy/**", "core/**", "cmd/**", "internal/**", "dashboard/**", "ui/src/**", "apps/**", "os/versions.lock.yaml", ".github/workflows/ci-deploy.yml"]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: shellcheck (preinstalled on the runner image)
        run: |
          shellcheck -x deploy/install.sh deploy/bundle.sh deploy/verify/verify.sh deploy/verify/node-check.sh \
            deploy/compose/gen-tokens.sh deploy/verify/tests/e2e-systemd/run.sh deploy/verify/tests/e2e-systemd/entrypoint.sh
      - name: pins match os/versions.lock.yaml
        run: python3 -I deploy/check-pins.py
      - name: install.sh --dry-run for every target and role (no root, changes nothing)
        run: |
          set -eu
          for t in debian13 rpi5 jetson do; do
            bash deploy/install.sh --role hub --dry-run --target "$t" > "hub-$t.log"
            bash deploy/install.sh --role node --dry-run --target "$t" --hub http://hub.example.invalid:8080 \
              --token K10example::node:example > "node-$t.log"
            grep -q 'unsupported developer install, no OS rollback' "hub-$t.log"
            if grep -q 'K10example' "node-$t.log"; then echo "dry run printed the join token" >&2; exit 1; fi
          done
          grep -q 'cgroup_memory=1 cgroup_enable=memory' hub-rpi5.log
          grep -q 'DigitalOcean Cloud' hub-do.log && grep -q 'DigitalOcean Cloud' node-do.log
          ! grep -q 'DigitalOcean Cloud' hub-debian13.log
          if bash deploy/install.sh --role hub --target rpi5 >/dev/null 2>&1; then echo "--target without --dry-run must fail" >&2; exit 1; fi
          # A second line in --hub or --token would land in gateway.env or k3s's env file.
          if bash deploy/install.sh --role hub --dry-run --target debian13 \
               --hub "$(printf 'http://hub.example.invalid:8080\nONEMIND_EXECUTOR=noop')" >/dev/null 2>&1; then
            echo "a two-line --hub was accepted" >&2; exit 1
          fi
          if bash deploy/install.sh --role node --dry-run --target debian13 --hub http://hub.example.invalid:8080 \
               --token "$(printf 'K10example\nX=1')" >/dev/null 2>&1; then
            echo "a two-line --token was accepted" >&2; exit 1
          fi
      - name: bundle.sh refuses an --out folder it did not make (it empties --out before a build)
        run: |
          set -eu
          d=$(mktemp -d); touch "$d/keep.txt"
          if bash deploy/bundle.sh --arch amd64 --node-only --go local --out "$d" >/dev/null 2>&1; then
            echo "bundle.sh accepted a folder with other files as --out" >&2; exit 1
          fi
          test -f "$d/keep.txt"
      - name: verify.sh against a mock hub (every broken-hub case) and natscheck (mock + real NATS with TLS)
        run: python3 -I deploy/verify/tests/test_verify.py -v
      - name: systemd units
        run: |
          sudo touch /usr/local/bin/onemindd /usr/local/bin/nats-server && sudo chmod +x /usr/local/bin/onemindd /usr/local/bin/nats-server
          sudo install -d /opt/onemind/venv/bin && sudo ln -sf "$(command -v python3)" /opt/onemind/venv/bin/python
          systemd-analyze verify deploy/systemd/onemind-nats.service deploy/systemd/onemind-gateway.service deploy/systemd/onemindd.service
      - name: compose file is valid
        run: |
          mkdir -p deploy/compose/local && touch deploy/compose/local/tokens.yaml
          docker compose -f deploy/compose/compose.yaml config -q

  compose-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: compose up
        working-directory: deploy/compose
        run: ./gen-tokens.sh && docker compose up -d --build --wait gateway node-sim sim-rpi5 sim-jetson
      - name: verify.sh against the compose hub
        working-directory: deploy/compose
        run: ../verify/verify.sh http://127.0.0.1:8080 --token-file local/owner.token --agent-token-file local/agent.token
      - name: the simulated Raspberry Pi 5 and Jetson are online
        working-directory: deploy/compose
        run: |
          python3 -I - <<'EOF'
          import json, time, urllib.request
          tok, want, boards = open("local/owner.token").read().strip(), {"rpi5", "jetson-orin"}, set()
          for _ in range(30):
              rq = urllib.request.Request("http://127.0.0.1:8080/v1/nodes", headers={"Authorization": "Bearer " + tok})
              boards = {n["board"] for n in json.load(urllib.request.urlopen(rq, timeout=10)) if n["status"] == "online"}
              if want <= boards:
                  raise SystemExit(print("online boards:", sorted(boards)))
              time.sleep(2)
          raise SystemExit("missing boards: %s" % sorted(want - boards))
          EOF
      - name: logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color
      - name: compose down
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v

  # Ported from PR #27: deploy/bundle.sh, then install.sh --bundle on two Debian 13 containers with
  # systemd as PID 1 (hub + node), node-check on both, verify.sh with the kubernetes executor, an
  # app becoming Available in k3s, dry run and uninstall. Needs privileged Docker; about 10 minutes.
  e2e-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: bundle + hub + node + checks
        run: deploy/verify/tests/e2e-systemd/run.sh
