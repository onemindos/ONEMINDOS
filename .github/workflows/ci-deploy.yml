# SPDX-License-Identifier: Apache-2.0
# Deploy kit CI (contract sdk/contracts/poc-v0.md §6): shellcheck, install.sh dry runs
# for every target and role, the verify.sh / natscheck / sim-node tests, and
# `docker compose config` for the Mac hub. The full systemd-container end-to-end
# test (deploy/verify/tests/e2e-systemd/run.sh) needs privileged Docker and ~15 min;
# it is run by hand for now.
name: ci-deploy

on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/ci-deploy.yml"

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: shellcheck (preinstalled on the runner)
        run: |
          shellcheck --version
          shellcheck deploy/*.sh deploy/compose/*.sh deploy/verify/*.sh deploy/verify/tests/e2e-systemd/run.sh

      - name: install.sh --dry-run for every target and role
        run: |
          set -eu
          for t in debian13 rpi5 jetson do; do
            bash deploy/install.sh --role hub --dry-run --target "$t" > "hub-$t.log"
            grep -q 'UNSUPPORTED DEVELOPER INSTALL, NO OS ROLLBACK' "hub-$t.log"
            bash deploy/install.sh --role node --dry-run --target "$t" --hub hub.example.invalid --token omj1.aaaa.bbbb > "node-$t.log"
            echo "dry run ok: $t"
          done

      - name: verify / natscheck / sim-node tests (NATS tests use Docker)
        run: python3 -I deploy/verify/tests/test_verify.py -v

      - name: docker compose config (Mac hub)
        run: |
          mkdir -p deploy/compose/.secrets
          printf 'tokens: {}\n' > deploy/compose/.secrets/tokens.yaml
          docker compose -f deploy/compose/docker-compose.yml config -q
