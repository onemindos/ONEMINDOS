# SPDX-License-Identifier: Apache-2.0
# Public-repo hygiene gate (brief 30 §2 rule 9, D-B1.3). Make this a required check on main.
name: hygiene
on:
  workflow_dispatch:   # docs/testing/README.md §2 (test-all)
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (pinned, sha256-checked)
        run: |
          curl -fsSL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks && gitleaks version
      - name: make hygiene
        env:
          HYGIENE_BASE: origin/${{ github.base_ref || 'main' }}
        run: scripts/hygiene.sh
      - name: Self-test (planted key and home path must be caught)
        run: scripts/hygiene-selftest.sh
