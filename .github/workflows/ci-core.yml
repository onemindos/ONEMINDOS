# SPDX-License-Identifier: Apache-2.0
name: ci-core

on:
  workflow_dispatch:   # docs/testing/README.md §2 (test-all)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["core/**", "sdk/**", ".github/actions/sdk-gen/**", ".github/workflows/ci-core.yml"]
  push:
    branches: [main]
    paths: ["core/**", "sdk/**", ".github/actions/sdk-gen/**", ".github/workflows/ci-core.yml"]
  merge_group:   # no paths filter exists for this event; the plan job filters instead

permissions:
  contents: read

# A new push to a PR cancels that PR's older run; runs on main always finish (CI-03, #228).
concurrency:
  group: ci-core-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which shards run (scripts/ci-core-matrix.py): a PR push runs the 3 SQLite shards; the merge
  # queue runs the 4 PostgreSQL shards once per merge (founder, 2026-11-15: the org's 20 shared
  # runners were the bottleneck); pushes to main and manual runs run all 7.
  plan:
    if: ${{ !github.event.pull_request.draft }}
    # CI-13 (#299): arm64-safe, no secrets, no Docker. Local Mac runner when LOCAL_RUNNER=on and the event is
    # trusted (never a fork PR); otherwise GitHub-hosted. docs/learning/self-hosted-runner.md
    # merge_group only runs code already approved into the queue, so it is always trusted (no fork check); MQ_RUNNER unset keeps the old routing.
    runs-on: ${{ (vars.MQ_RUNNER == 'on' && github.event_name == 'merge_group') && fromJSON('["self-hosted","onemind-mq"]') || (vars.LOCAL_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      run: ${{ steps.pick.outputs.run }}
      sqlite: ${{ steps.pick.outputs.sqlite }}
      run_sqlite: ${{ steps.pick.outputs.run_sqlite }}
      postgresql: ${{ steps.pick.outputs.postgresql }}
      run_postgresql: ${{ steps.pick.outputs.run_postgresql }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: scripts/ci-core-matrix.py
          sparse-checkout-cone-mode: false
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: python3 scripts/ci-core-matrix.py

  # CI-03 (#228): the suite used to run twice in one job, SQLite (~33 min) then PostgreSQL + NATS
  # (~106 min). Now each backend is split into shards (3 SQLite, 4 PostgreSQL; one SQLite job on
  # 4 cores still took over 30 min in CI)
  # (ONEMIND_TEST_SHARD, tests/conftest.py), and every job runs pytest-xdist on all runner cores.
  # Each xdist worker gets its own PostgreSQL database; real-NATS tests share one worker.
  # Together the jobs run exactly the tests the old single job ran.
  # CI-13 (#299): one job per backend. The SQLite shards need no service containers, so they may run
  # on the Mac's local runner (arm64, no Docker); the PostgreSQL shards need postgres and nats
  # containers and stay GitHub-hosted. The check names are unchanged: test (<backend> <k>/<n>).
  test:
    name: test (${{ matrix.backend }} ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.run_sqlite == 'true'
    # Local Mac runner when LOCAL_RUNNER=on and the event is trusted (never a fork PR); otherwise
    # GitHub-hosted. docs/learning/self-hosted-runner.md
    # merge_group only runs code already approved into the queue, so it is always trusted (no fork check); MQ_RUNNER unset keeps the old routing.
    runs-on: ${{ (vars.MQ_RUNNER == 'on' && github.event_name == 'merge_group') && fromJSON('["self-hosted","onemind-mq"]') || (vars.DO_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-do"]') || (vars.LOCAL_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60   # a safety net (raised from 40, founder 2026-11-23); a shard takes about 15 min (CI-03 target: under 20)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.sqlite) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          # Exact version: "latest" resolves through the GitHub API, which times out now and then and fails the job. 0.13.9 is what CI ran when this was pinned.
          version: "0.13.9"
      # GitHub's image has Go and kustomize preinstalled and some core tests skip without them
      # (test_sdk_conformance, test_policy, security/test_sandbox_escapes). Install both, so the
      # local runner runs the same tests.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: kustomize (pinned, sha256-checked; amd64 or arm64)
        run: |
          sdk/tools/ci/install-tools.sh "$RUNNER_TEMP/bin" kustomize
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # test_sdk_conformance and test_mcp import the Python SDK and build the onemind CLI (Go SDK).
      - name: Generate the SDK code from the committed spec (CI-16, not committed)
        uses: ./.github/actions/sdk-gen
        with:
          langs: go py
      - name: nats-server for the real-bus tests (pinned and checksum-checked)
        run: bash sdk/tools/ci/install-nats.sh
      - name: Core suite (${{ matrix.backend }}, shard ${{ matrix.shard }})
        env:
          ONEMIND_TEST_SHARD: ${{ matrix.shard }}
          ONEMIND_PROPERTY_BACKEND: ${{ matrix.backend }}
          ONEMIND_PROPERTY_ARTIFACTS: ${{ github.workspace }}/property-evidence/${{ matrix.backend }}
          # Use SQLite; tests that need a NATS server start the pinned local binary.
          ONEMIND_TEST_DB_URL: ''
          ONEMIND_TEST_NATS_URL: ''
        run: make -C core test PYTEST_ARGS="-n auto --dist loadgroup --durations=20"
      - name: Retain property backend allocation manifests (never key files or databases)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: property-backends-${{ github.run_id }}-${{ matrix.backend }}-${{ strategy.job-index }}
          path: property-evidence/*/allocations-*.jsonl
          if-no-files-found: error
          retention-days: 14

  test-postgresql:
    name: test (${{ matrix.backend }} ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.run_postgresql == 'true'
    runs-on: ubuntu-24.04   # service containers need Docker; the local runner has none
    timeout-minutes: 60   # a safety net (raised from 40, founder 2026-11-23); a shard takes about 15 min (CI-03 target: under 20)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.postgresql) }}
    services:
      nats:
        image: nats:2.10-alpine
        ports: ["4222:4222"]
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: onemind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          # Exact version: "latest" resolves through the GitHub API, which times out now and then and fails the job. 0.13.9 is what CI ran when this was pinned.
          version: "0.13.9"
      # test_sdk_conformance and test_mcp import the Python SDK and build the onemind CLI (Go SDK).
      - name: Generate the SDK code from the committed spec (CI-16, not committed)
        uses: ./.github/actions/sdk-gen
        with:
          langs: go py
      - name: Throwaway test database, so skip disk syncs
        env:
          PGPASSWORD: test
        run: |
          psql -h 127.0.0.1 -U postgres -d onemind -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
      - name: nats-server for the real-bus tests (pinned and checksum-checked)
        run: bash sdk/tools/ci/install-nats.sh
      - name: Core suite (${{ matrix.backend }}, shard ${{ matrix.shard }})
        env:
          ONEMIND_TEST_SHARD: ${{ matrix.shard }}
          ONEMIND_PROPERTY_BACKEND: ${{ matrix.backend }}
          ONEMIND_PROPERTY_ARTIFACTS: ${{ github.workspace }}/property-evidence/${{ matrix.backend }}
          ONEMIND_TEST_DB_URL: postgresql://postgres:test@127.0.0.1:5432/onemind
          ONEMIND_TEST_NATS_URL: nats://127.0.0.1:4222
        run: make -C core test PYTEST_ARGS="-n auto --dist loadgroup --durations=20"
      - name: Retain property backend allocation manifests (never key files or databases)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: property-backends-${{ github.run_id }}-${{ matrix.backend }}-${{ strategy.job-index }}
          path: property-evidence/*/allocations-*.jsonl
          if-no-files-found: error
          retention-days: 14

  image:
    if: ${{ !github.event.pull_request.draft && github.event_name != 'merge_group' }} # built on ready PRs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build amd64 + arm64 (no push)
        run: docker buildx build --platform linux/amd64,linux/arm64 -f core/Dockerfile -t onemind-core:ci .
