# SPDX-License-Identifier: Apache-2.0
name: ci-core

on:
  workflow_dispatch:   # docs/testing/README.md §2 (test-all)
  pull_request:
    paths: ["core/**", "sdk/**", ".github/workflows/ci-core.yml"]
  push:
    branches: [main]
    paths: ["core/**", "sdk/**", ".github/workflows/ci-core.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      nats:
        image: nats:2.10-alpine
        ports: ["4222:4222"]
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: onemind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Unit + contract tests (SQLite, no NATS)
        run: make -C core test
      - name: Same suite on PostgreSQL + real NATS
        env:
          ONEMIND_TEST_DB_URL: postgresql://postgres:test@127.0.0.1:5432/onemind
          ONEMIND_TEST_NATS_URL: nats://127.0.0.1:4222
        run: cd core && uv run pytest -q

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build amd64 + arm64 (no push)
        run: docker buildx build --platform linux/amd64,linux/arm64 -f core/Dockerfile -t onemind-core:ci .
