# SPDX-License-Identifier: Apache-2.0
# QEMU battery (brief 30 D-B1.6, B13): rootfs -> fixtures -> boot tests, per board.
# Criteria: test/qemu/CRITERIA.md (pre-registered). Called by image.yml, nightly.yml and
# security-nightly.yml (which passes `snapshot`: the battery then builds from the commit plus the
# generated snapshot change, os/update/pick-snapshot.py apply, exactly as the release build does).
name: battery
on:
  workflow_call:
    inputs:
      board: {type: string, required: true}
      upto: {type: string, default: T5}
      leg: {type: string, default: debian}
      runner: {type: string, default: ubuntu-24.04}
      snapshot: {type: string, default: ''}
      firstboot: {type: boolean, default: false}
      firewall: {type: boolean, default: false}
  workflow_dispatch:
    inputs:
      board: {type: string, default: x86_64-efi}
      upto: {type: string, default: T5}
      leg: {type: string, default: debian}
      runner: {type: string, default: ubuntu-24.04}
permissions:
  contents: read
# Pull-request runs only: a newer push supersedes the old run. The group differs from the caller's
# (image-<ref>), otherwise a called workflow would cancel its own caller. Main, nightly and tags never cancel.
concurrency:
  group: battery-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-${{ inputs.board }}-${{ inputs.leg }}-${{ inputs.upto }}-${{ inputs.snapshot != '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  battery:
    # CI-14: x86 + KVM on a Proxmox VE host when KVM_RUNNER=on and the event is trusted (allow-list); the release-signing
    # workflow (security-nightly) always stays GitHub-hosted, so a home machine never vouches for a release.
    runs-on: ${{ (inputs.runner == 'ubuntu-24.04' && github.workflow != 'security-nightly' && vars.KVM_RUNNER == 'on' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","onemind-kvm"]') || inputs.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - name: KVM (record whether this job used KVM or TCG; brief 30 §3)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm 2>/dev/null && echo "accel: kvm" || echo "accel: tcg (no /dev/kvm on this runner)"
          nproc
      - name: Apply the security snapshot (generated change)
        if: inputs.snapshot != ''
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
        run: python3 -I os/update/pick-snapshot.py apply --snapshot "$SNAPSHOT" && git diff --stat
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build rootfs (${{ inputs.leg }}, ${{ inputs.board }})
        run: |
          mkdir -p out
          docker buildx build -f os/rootfs/Containerfile --target rootfs --progress plain \
            --build-arg BOARD=${{ inputs.board }} $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/${{ inputs.leg }}.args) \
            --cache-from type=gha,scope=rootfs-${{ inputs.leg }}-${{ inputs.board }} \
            --cache-to type=gha,mode=max,scope=rootfs-${{ inputs.leg }}-${{ inputs.board }} \
            --output type=tar,dest=out/rootfs-${{ inputs.leg }}-${{ inputs.board }}.tar .
      - name: Build tools image
        run: |
          docker buildx build -f os/rootfs/Containerfile --target tools --progress plain \
            $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=tools-${{ inputs.runner }} --cache-to type=gha,mode=max,scope=tools-${{ inputs.runner }} \
            --load -t onemind-tools:ci .
      - name: Fixtures (T0 build checks)
        run: make fixtures BOARD=${{ inputs.board }} LEG=${{ inputs.leg }} UPTO=${{ inputs.upto }} TOOLS=onemind-tools:ci
      - name: First boot into OneMind (F0-F4, test/qemu/CRITERIA-FIRSTBOOT.md)
        if: inputs.firstboot
        run: make firstboot BOARD=${{ inputs.board }} TOOLS=onemind-tools:ci
      - name: Host firewall scan from a second VM (FW1-FW4, test/qemu/CRITERIA-FIREWALL.md)
        if: inputs.firewall
        run: make firewall BOARD=${{ inputs.board }} TOOLS=onemind-tools:ci
      - name: Battery up to ${{ inputs.upto }}
        run: |
          sudo rm -f out/rootfs-*.tar
          make battery BOARD=${{ inputs.board }} UPTO=${{ inputs.upto }} TOOLS=onemind-tools:ci
      - name: Trim and mask the serial log
        if: always()
        run: |
          d=out/battery-${{ inputs.board }}
          if [ -f $d/serial.log ]; then sudo chmod -R a+r out; test/qemu/trim-log.sh $d/serial.log > $d/serial-trimmed.log; rm -f $d/serial.log; fi
          if [ -f $d/results.json ]; then python3 -I test/qemu/summary.py $d/results.json >> "$GITHUB_STEP_SUMMARY"; fi
          w=out/firewall-${{ inputs.board }}
          if [ -f $w/results.json ]; then python3 -I test/qemu/summary.py $w/results.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f $w/serial.log ]; then test/qemu/trim-log.sh $w/serial.log > $w/serial-trimmed.log; rm -f $w/serial.log; fi
          f=out/firstboot-${{ inputs.board }}
          if [ -f $f/results.json ]; then python3 -I test/qemu/summary.py $f/results.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f $f/serial.log ]; then test/qemu/trim-log.sh $f/serial.log > $f/serial-trimmed.log; rm -f $f/serial.log; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: battery-${{ inputs.leg }}-${{ inputs.board }}-${{ inputs.upto }}${{ inputs.snapshot != '' && '-security' || '' }}
          path: |
            out/battery-${{ inputs.board }}/
            out/firstboot-${{ inputs.board }}/results.json
            out/firstboot-${{ inputs.board }}/serial-trimmed.log
            out/firewall-${{ inputs.board }}/results.json
            out/firewall-${{ inputs.board }}/serial-trimmed.log
            out/fx-${{ inputs.board }}/t0.json
            out/fx-${{ inputs.board }}/SHA256SUMS
          retention-days: 30
