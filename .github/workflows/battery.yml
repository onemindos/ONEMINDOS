# SPDX-License-Identifier: Apache-2.0
# QEMU battery (brief 30 D-B1.6, B13): rootfs -> fixtures -> boot tests, per board.
# Criteria: test/qemu/CRITERIA.md (pre-registered). Called by image.yml and nightly.yml.
name: battery
on:
  workflow_call:
    inputs:
      board: {type: string, required: true}
      upto: {type: string, default: T5}
      leg: {type: string, default: debian}
      runner: {type: string, default: ubuntu-24.04}
  workflow_dispatch:
    inputs:
      board: {type: string, default: x86_64-efi}
      upto: {type: string, default: T5}
      leg: {type: string, default: debian}
      runner: {type: string, default: ubuntu-24.04}
permissions:
  contents: read
jobs:
  battery:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - name: KVM (record whether this job used KVM or TCG; brief 30 §3)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm 2>/dev/null && echo "accel: kvm" || echo "accel: tcg (no /dev/kvm on this runner)"
          nproc
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build rootfs (${{ inputs.leg }}, ${{ inputs.board }})
        run: |
          mkdir -p out
          docker buildx build -f os/rootfs/Containerfile --target rootfs --progress plain \
            --build-arg BOARD=${{ inputs.board }} $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/${{ inputs.leg }}.args) \
            --cache-from type=gha,scope=rootfs-${{ inputs.leg }}-${{ inputs.board }} \
            --cache-to type=gha,mode=max,scope=rootfs-${{ inputs.leg }}-${{ inputs.board }} \
            --output type=tar,dest=out/rootfs-${{ inputs.leg }}-${{ inputs.board }}.tar .
      - name: Build tools image
        run: |
          docker buildx build -f os/rootfs/Containerfile --target tools --progress plain \
            $(sed -n 's/^\([A-Z]*=.*\)/--build-arg \1/p' os/rootfs/debian.args) \
            --cache-from type=gha,scope=tools-${{ inputs.runner }} --cache-to type=gha,mode=max,scope=tools-${{ inputs.runner }} \
            --load -t onemind-tools:ci .
      - name: Fixtures (T0 build checks)
        run: make fixtures BOARD=${{ inputs.board }} LEG=${{ inputs.leg }} UPTO=${{ inputs.upto }} TOOLS=onemind-tools:ci
      - name: Battery up to ${{ inputs.upto }}
        run: |
          sudo rm -f out/rootfs-*.tar
          make battery BOARD=${{ inputs.board }} UPTO=${{ inputs.upto }} TOOLS=onemind-tools:ci
      - name: Trim and mask the serial log
        if: always()
        run: |
          d=out/battery-${{ inputs.board }}
          if [ -f $d/serial.log ]; then sudo chmod -R a+r out; test/qemu/trim-log.sh $d/serial.log > $d/serial-trimmed.log; rm -f $d/serial.log; fi
          if [ -f $d/results.json ]; then python3 -I test/qemu/summary.py $d/results.json >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: battery-${{ inputs.leg }}-${{ inputs.board }}-${{ inputs.upto }}
          path: |
            out/battery-${{ inputs.board }}/
            out/fx-${{ inputs.board }}/t0.json
            out/fx-${{ inputs.board }}/SHA256SUMS
          retention-days: 30
