# SPDX-License-Identifier: Apache-2.0
# Developer surface (docs/leap/dev/SDK.md §7, CLI.md, MCP.md): the committed OpenAPI spec must match
# core/ and the three SDKs must generate from it (their code is not committed, CI-16), the SDKs and the CLI must pass their tests, and all of them must
# pass conformance against a live gateway.
name: ci-sdk

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["sdk/**", "core/onemind_core/**", "cmd/onemind/**", "internal/mcpbridge/**", "go.mod", "go.sum",
            ".github/actions/sdk-gen/**", ".github/workflows/ci-sdk.yml"]
  push:
    branches: [main]
    paths: ["sdk/**", "core/onemind_core/**", "cmd/onemind/**", "internal/mcpbridge/**", "go.mod", "go.sum",
            ".github/actions/sdk-gen/**", ".github/workflows/ci-sdk.yml"]

permissions:
  contents: read

concurrency:
  group: ci-sdk-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stale:
    if: ${{ !github.event.pull_request.draft }}
    name: generated code is current
    # CI-10 (#299): arm64-safe, no secrets. Local Mac runner when LOCAL_RUNNER=on and the event is trusted
    # (never a fork PR); otherwise GitHub-hosted. docs/learning/self-hosted-runner.md
    # merge_group only runs code already approved into the queue, so it is always trusted (no fork check); MQ_RUNNER unset keeps the old routing.
    runs-on: ${{ (vars.MQ_RUNNER == 'on' && github.event_name == 'merge_group') && fromJSON('["self-hosted","onemind-mq"]') || (vars.LOCAL_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-local"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: sdk/ts
      - name: Committed OpenAPI spec matches core/, and the SDK code generates from it
        run: make -C sdk check-stale

  test:
    if: ${{ !github.event.pull_request.draft }}
    name: SDKs, CLI and bridge
    # CI-10 (#299): arm64-safe, no secrets. Local Mac runner when LOCAL_RUNNER=on and the event is trusted
    # (never a fork PR); otherwise GitHub-hosted. docs/learning/self-hosted-runner.md
    # merge_group only runs code already approved into the queue, so it is always trusted (no fork check); MQ_RUNNER unset keeps the old routing.
    runs-on: ${{ (vars.MQ_RUNNER == 'on' && github.event_name == 'merge_group') && fromJSON('["self-hosted","onemind-mq"]') || (vars.LOCAL_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-local"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: sdk/ts
      - name: Generate the SDK code from the committed spec (CI-16, not committed)
        uses: ./.github/actions/sdk-gen
        with:
          langs: go ts py
      - name: Go SDK, TS SDK, Python SDK
        run: make -C sdk test
      - name: CLI and MCP bridge
        run: |
          go vet ./cmd/onemind/... ./internal/mcpbridge/...
          go test -race -count=1 ./cmd/onemind/... ./internal/mcpbridge/...
      - name: Conformance against a live gateway (Python, Go, TS SDKs; CLI; MCP through the stdio bridge)
        run: |
          cd core && uv sync --quiet
          uv run pytest -q tests/test_sdk_conformance.py tests/test_mcp.py tests/test_mcp_catalogue.py tests/test_devsurface_api.py
