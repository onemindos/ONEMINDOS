# SPDX-License-Identifier: Apache-2.0
# Brand at one point (brand/README.md "How to change the brand").
#  - sync:  every file derived from brand/brand.json must be up to date (scripts/brand-sync.py --check).
#  - icons: the raster sizes brand/logo/png/ does not have (iOS, Android adaptive, apple-touch,
#           the desktop `tauri icon` source), made with Pillow and uploaded as an artifact.
name: brand

on:
  pull_request:
    paths:
      - 'brand/**'
      - 'scripts/brand-sync.py'
      - 'scripts/brand-icons.py'
      - 'ui/src/tokens/**'
      - 'ui/scripts/gen-tokens.ts'
      - 'dashboard/**'
      - 'site/**'
      - 'mobile/**'
      - 'desktop/**'
      - '.github/workflows/brand.yml'
  push:
    branches: [main]
    paths:
      - 'brand/**'
      - 'scripts/brand-sync.py'
      - 'scripts/brand-icons.py'
      - '.github/workflows/brand.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Node >= 22.6 runs ui/scripts/gen-tokens.ts --check (tokens.css follows the brand accent).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Derived brand files match brand/brand.json
        run: python3 -I scripts/brand-sync.py --check

  icons:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Pillow (Ubuntu package)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends python3-pil
      - name: Make the icon sizes the logo folder does not have
        run: /usr/bin/python3 -I scripts/brand-icons.py "$RUNNER_TEMP/brand-icons"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brand-icons
          path: ${{ runner.temp }}/brand-icons
          retention-days: 30
