# SPDX-License-Identifier: Apache-2.0
name: ci-ui

on:
  workflow_dispatch:   # docs/testing/README.md §2 (test-all)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'ui/**'
      - '.github/workflows/ci-ui.yml'
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/ci-ui.yml'

permissions:
  contents: read

concurrency:
  group: ci-ui-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    if: ${{ !github.event.pull_request.draft }}
    # CI-10 (#299): arm64-safe, no secrets. Local Mac runner when LOCAL_RUNNER=on and the event is trusted
    # (never a fork PR); otherwise GitHub-hosted. docs/learning/self-hosted-runner.md
    runs-on: ${{ (vars.LOCAL_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-local"]') || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
