# SPDX-License-Identifier: Apache-2.0
# App CI gate, wave 1 (sdk/contracts/poc-v0.md §9.4 checks 1, 3 (pinning), 6 (gitleaks) and 8).
# Licence, Trivy, ClamAV, cosign/Scorecard and the k3d smoke test are later waves.
name: ci-apps

on:
  workflow_dispatch:   # docs/testing/README.md §2 (test-all)
  pull_request:
    paths:
      - "apps/**"
      - "sdk/**"
      - ".github/workflows/ci-apps.yml"

permissions:
  contents: read

concurrency:
  group: ci-apps-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  KUSTOMIZE_VERSION: "5.8.3"
  KUSTOMIZE_SHA256: "cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61"
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  validate-apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r sdk/tools/requirements.txt

      - name: Install kustomize, kubeconform and gitleaks (pinned by version and sha256)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; dl="$RUNNER_TEMP/dl"
          mkdir -p "$bin" "$dl"
          fetch() { # url sha256 file
            curl -fsSL --retry 3 -o "$dl/$3" "$1"
            echo "$2  $dl/$3" | sha256sum -c -
            tar -xzf "$dl/$3" -C "$bin"
          }
          fetch "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            "$KUSTOMIZE_SHA256" kustomize.tar.gz
          fetch "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            "$KUBECONFORM_SHA256" kubeconform.tar.gz
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "$GITLEAKS_SHA256" gitleaks.tar.gz
          echo "$bin" >> "$GITHUB_PATH"

      - name: Validate apps
        run: python3 -I sdk/tools/validate-apps

      - name: Gitleaks (commits in this PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}" .
