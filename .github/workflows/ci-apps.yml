# SPDX-License-Identifier: Apache-2.0
# App CI gate (sdk/contracts/poc-v0.md §9.4, §11.1) on every PR that touches apps/ or the app tools.
#   validate: unit tests, validate-apps over EVERY app (schema, pins, limits, kubeconform, Renovate list),
#             generated READMEs up to date, gitleaks over the PR's commits. Runs on every run.
#   plan:     which apps the gate runs for (sdk/tools/app-select plan; logic in applib/selection.py).
#   gate:     sdk/tools/app-gate for each planned app (licence, pinning + archs, Trivy CVE + secrets,
#             ClamAV, cosign, Scorecard, non-root) plus the k3d smoke test (check 9)
#             The job fails when the PR claims more than the gate computes (metadata.tier above the
#             computed tier, or a committed scan.json "pass" the gate does not reproduce), or when a
#             tool fails. An app that honestly fails (tier blocked/community) can still merge: the
#             gateway refuses to install it without a passing scan (§10.3, §11.1).
# Which apps the gate runs for (founder decision 2026-11-25: speed up landings without weakening checks):
#   - a pull request into release/next or a feature branch: only the apps whose apps/<id>/ files it
#     changes, plus the apps whose licence-matrix rows it changes; EVERY app when it changes a shared gate
#     input (selection.SHARED_GATE_INPUTS: the gate's tools, its pinned tools and packages, the app schema,
#     this workflow); none when it changes no app (the gate job is skipped and the run still passes);
#   - a pull request into main (a landing), the merge queue, the nightly schedule and a manual run
#     (test-all): every app. The nightly run checks out release/next, where every PR lands.
# The scan.json each gate run writes is uploaded as an artifact; the committed scan.json is refreshed
# by .github/workflows/apps-rescan.yml. test/unit/test_ci_apps_plan.py locks this wiring in.
name: ci-apps

on:
  workflow_dispatch:   # docs/testing/README.md §2 (test-all)
  schedule:
    - cron: "47 6 * * *"   # nightly, every app on release/next (after apps-rescan at 04:17 and nightly)
  merge_group:   # the merge queue into main: every app
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/**"
      # Only the SDK files this gate reads (not all of sdk/**: the gateway, OpenAPI and language
      # SDKs have their own workflows and cannot change an app's gate result).
      - "sdk/tools/**"
      - "sdk/schema/**"
      - "test/gui/**"   # the GUI runtime bake-off; its logic is tested in sdk/tools/tests (#786)
      - "test/backup-wire/backup-probe/**"   # the drills' fixture app must load in the catalog (test_drill_fixture_apps.py)
      # validate-apps runs the gateway's own manifest check (PLAN-E6, #175): every onemind_core module it
      # imports at load (test/unit/test_ci_apps_plan.py follows the imports and fails on a missing one) ...
      - "core/onemind_core/__init__.py"
      - "core/onemind_core/catalog.py"
      - "core/onemind_core/manifest_convert.py"
      - "core/onemind_core/manifest_rules.py"
      - "core/onemind_core/machine_needs.py"
      - "core/onemind_core/filesig.py"
      - "core/onemind_core/systemlist.py"
      - "core/onemind_core/ai_policy.py"
      - "core/onemind_core/scan.py"
      - "core/onemind_core/appsecrets/__init__.py"
      - "core/onemind_core/appsecrets/spec.py"
      - "core/onemind_core/hostgrants/__init__.py"
      - "core/onemind_core/hostgrants/kinds.py"
      # validate-apps check 12 reads the NetworkPolicies the gateway writes (policy.py, its rules and imports, #786).
      - "core/onemind_core/policy.py"
      - "core/onemind_core/sections.py"
      # ... and the data files it reads: sandbox rules, reserved host ports, the image's system app list.
      - "sdk/policy/app-objects.yaml"
      - "sdk/policy/host-ports.yaml"
      - "os/rootfs/layers/onemind/usr/lib/onemind/system-apps.json"
      - ".github/actions/sdk-gen/**"   # generates the Go SDK the plugin validator is built with
      - "cmd/onemind/**"
      - "internal/plugin/**"
      - "go.mod"
      - "go.sum"
      - "research-output/evidence/license-matrix.csv"   # only the apps whose rows changed are gated
      - "renovate.json"
      - ".github/workflows/ci-apps.yml"

permissions:
  contents: read

concurrency:
  group: ci-apps-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: ${{ !github.event.pull_request.draft }}
    # CI-10 (#299): arm64-safe, no secrets. Local Mac runner when LOCAL_RUNNER=on and the event is trusted
    # (never a fork PR); otherwise GitHub-hosted. docs/learning/self-hosted-runner.md
    # merge_group only runs code already approved into the queue, so it is always trusted (no fork check); MQ_RUNNER unset keeps the old routing.
    runs-on: ${{ (vars.MQ_RUNNER == 'on' && github.event_name == 'merge_group') && fromJSON('["self-hosted","onemind-mq"]') || (vars.LOCAL_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A scheduled run starts on main; the nightly checks release/next, where every PR lands.
          ref: ${{ github.event_name == 'schedule' && 'release/next' || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go for the shared plugin validator
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      # cmd/onemind imports sdk/go, whose generated types are not committed (CI-16).
      - name: Generate the Go SDK code from the committed spec
        uses: ./.github/actions/sdk-gen
        with:
          langs: go

      - name: Build the box plugin validator
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/bin/onemind" ./cmd/onemind
          echo "ONEMIND_PLUGIN_VALIDATOR=$RUNNER_TEMP/bin/onemind" >> "$GITHUB_ENV"

      # setup-python has no 3.13 build for the local runner (Debian 13, arm64), so that runner uses Debian's
      # own Python 3.13 in a venv instead (the system Python refuses pip installs, PEP 668).
      - name: Set up Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Python (local runner)
        if: runner.environment != 'github-hosted'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies and pinned tools
        run: |
          python3 -m pip install --disable-pip-version-check -r sdk/tools/requirements.txt
          sdk/tools/ci/install-tools.sh "$RUNNER_TEMP/bin" kustomize kubeconform gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install real ClamAV for plugin EICAR tests
        run: |
          if ! command -v clamscan >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clamav
          fi
          command -v clamscan

      # The offline-map regression tests run the app's shipped JS in Node (#126, #299). Same pin as ci-sdk;
      # setup-node has a linux-arm64 build, so this one step serves the hosted and the local Debian runner.
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Check Node 22
        run: |
          node --version
          node --version | grep -q '^v22\.'

      - name: Unit tests (sdk/tools)
        run: python3 -I -m unittest discover -s sdk/tools/tests -v

      - name: Set up uv for the gateway refusal harness
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Verify app refusals at the gateway
        run: python3 -I sdk/tools/app-refusals

      - name: Validate apps
        run: python3 -I sdk/tools/validate-apps --plugin-validator "$ONEMIND_PLUGIN_VALIDATOR"

      - name: Shared bases are valid (apps/_bases, #786)
        run: python3 -I sdk/tools/app-factory base-check

      - name: Generated READMEs are up to date
        run: python3 -I sdk/tools/app-readme --check

      - name: Gitleaks (commits in this PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  # Scan artifacts must be available even when validation detects stale committed scans.
  plan:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ (vars.KVM_RUNNER == 'on' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","onemind-kvm"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.changed.outputs.apps }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A scheduled run starts on main; the nightly checks release/next, where every PR lands.
          ref: ${{ github.event_name == 'schedule' && 'release/next' || '' }}
          fetch-depth: 0
          persist-credentials: false

      # The plan itself: sdk/tools/app-select plan (logic and the shared input list in applib/selection.py,
      # scenarios in test/unit/test_ci_apps_plan.py). It prints the gate matrix as a JSON list; an empty
      # list skips the gate job and the run still passes (scripts/ci-gate.py counts skipped as passed).
      # A plan error fails this job, so the run fails: nothing is reported as passed without a plan.
      - name: Apps to gate
        id: changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          selector=(python3 -I sdk/tools/app-select)
          if ! python3 -I -c 'import yaml' 2>/dev/null; then
            python3 -m venv "$RUNNER_TEMP/app-list"
            "$RUNNER_TEMP/app-list/bin/python3" -m pip install -r sdk/tools/requirements.txt
            selector=("$RUNNER_TEMP/app-list/bin/python3" -I sdk/tools/app-select)
          fi
          apps=$("${selector[@]}" plan --event "$GITHUB_EVENT_NAME" --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA")
          jq -e 'type == "array"' <<<"$apps" >/dev/null
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "apps to gate: $(jq -r 'if length == 0 then "none" else join(" ") end' <<<"$apps")"

  gate:
    needs: plan
    # Not run when gate-kvm takes the trusted events below: this copy keeps the optional Docker Hub login (D18) and its
    # secret, so it only ever runs on GitHub-hosted runners.
    if: ${{ !github.event.pull_request.draft && (needs.plan.outputs.apps != '[]') && !(vars.KVM_RUNNER == 'on' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'schedule' && 'release/next' || '' }}
          persist-credentials: false

      - name: Set up Go for the shared plugin validator
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      # cmd/onemind imports sdk/go, whose generated types are not committed (CI-16).
      - name: Generate the Go SDK code from the committed spec
        uses: ./.github/actions/sdk-gen
        with:
          langs: go

      - name: Build the box plugin validator
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/bin/onemind" ./cmd/onemind
          echo "ONEMIND_PLUGIN_VALIDATOR=$RUNNER_TEMP/bin/onemind" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # D18: optional Docker Hub login, so docker.io pulls by trivy, crane and the k3d node image count against the
      # account's rate limit, not the runner's shared IP. Skipped when DOCKERHUB_TOKEN is not set and on pull
      # requests from forks (which never receive secrets). The token is only read by docker/login-action and is
      # never echoed. Images the k3s node itself pulls during the smoke test are not covered by this login.
      - name: Docker Hub login (optional, D18)
        if: env.HAS_DOCKERHUB == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install the gate's tools (pinned by version and sha256)
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r sdk/tools/requirements.txt
          sdk/tools/ci/install-tools.sh "$RUNNER_TEMP/bin" trivy crane cosign k3d kubectl kustomize kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # ClamAV from the Ubuntu archive (apt-verified); signatures are updated in this job (§9.4 check 5).
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          for i in 1 2 3; do sudo freshclam --stdout && break; sleep $((i * 20)); done
          clamscan --version

      - name: Throwaway k3s cluster (k3d)
        run: |
          k3d cluster create gate --wait --timeout 300s --no-lb \
            --image docker.io/rancher/k3s:v1.37.2-k3s1@sha256:21ea6e0fac4e3930c2ce8aa40ddd41a8b18cb3e9a0222c030dc005e7e88c4332
          kubectl get nodes

      - name: Resolve the app directory
        id: app-path
        env:
          APP: ${{ matrix.app }}
        run: |
          app_path=$(python3 -I sdk/tools/app-select path "$APP")
          echo "path=$app_path" >> "$GITHUB_OUTPUT"

      - name: App gate (§9.4 checks 2-9)
        env:
          APP_PATH: ${{ steps.app-path.outputs.path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 -I sdk/tools/app-gate --apps-dir "${APP_PATH%/*}" "${APP_PATH##*/}" --smoke --tier check --fail-on claim --clamav-db /var/lib/clamav \
            --workdir "$RUNNER_TEMP" --report "$RUNNER_TEMP/out/report.json" --sbom-dir "$RUNNER_TEMP/out/sbom"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-gate-${{ matrix.app }}
          path: |
            ${{ steps.app-path.outputs.path }}/scan.json
            ${{ runner.temp }}/out/
          if-no-files-found: ignore
          retention-days: 30

  gate-kvm:
    needs: plan
    # Same steps as `gate` minus the Docker Hub login and every secret: a job that mentions secrets.* gets them
    # delivered to its runner even when the step is skipped, and our hosts keep passwordless sudo, so this job
    # mentions none. A test keeps the two step lists in step.
    if: ${{ !github.event.pull_request.draft && (needs.plan.outputs.apps != '[]') && (vars.KVM_RUNNER == 'on' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) }}
    runs-on: [self-hosted, onemind-kvm]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      # The host is reused between jobs (only the VM is fresh in the KVM pool; a hand-run droplet is not), so
      # remove any leftover gate cluster first.
      - name: Remove a leftover gate cluster (reused host)
        run: |
          docker ps -aq --filter 'name=^k3d-gate-' | xargs -r docker rm -f || true
          docker network rm k3d-gate 2>/dev/null || true

      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'schedule' && 'release/next' || '' }}
          persist-credentials: false

      - name: Set up Go for the shared plugin validator
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      # cmd/onemind imports sdk/go, whose generated types are not committed (CI-16).
      - name: Generate the Go SDK code from the committed spec
        uses: ./.github/actions/sdk-gen
        with:
          langs: go

      - name: Build the box plugin validator
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/bin/onemind" ./cmd/onemind
          echo "ONEMIND_PLUGIN_VALIDATOR=$RUNNER_TEMP/bin/onemind" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the gate's tools (pinned by version and sha256)
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r sdk/tools/requirements.txt
          sdk/tools/ci/install-tools.sh "$RUNNER_TEMP/bin" trivy crane cosign k3d kubectl kustomize kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # ClamAV from the Ubuntu archive (apt-verified); signatures are updated in this job (§9.4 check 5).
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          for i in 1 2 3; do sudo freshclam --stdout && break; sleep $((i * 20)); done
          clamscan --version

      - name: Throwaway k3s cluster (k3d)
        run: |
          k3d cluster create gate --wait --timeout 300s --no-lb \
            --image docker.io/rancher/k3s:v1.37.2-k3s1@sha256:21ea6e0fac4e3930c2ce8aa40ddd41a8b18cb3e9a0222c030dc005e7e88c4332
          kubectl get nodes

      - name: Resolve the app directory
        id: app-path
        env:
          APP: ${{ matrix.app }}
        run: |
          app_path=$(python3 -I sdk/tools/app-select path "$APP")
          echo "path=$app_path" >> "$GITHUB_OUTPUT"

      - name: App gate (§9.4 checks 2-9)
        env:
          APP_PATH: ${{ steps.app-path.outputs.path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 -I sdk/tools/app-gate --apps-dir "${APP_PATH%/*}" "${APP_PATH##*/}" --smoke --tier check --fail-on claim --clamav-db /var/lib/clamav \
            --workdir "$RUNNER_TEMP" --report "$RUNNER_TEMP/out/report.json" --sbom-dir "$RUNNER_TEMP/out/sbom"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-gate-${{ matrix.app }}
          path: |
            ${{ steps.app-path.outputs.path }}/scan.json
            ${{ runner.temp }}/out/
          if-no-files-found: ignore
          retention-days: 30

      - name: Delete the gate cluster (reused host)
        if: always()
        run: |
          if command -v k3d >/dev/null 2>&1; then k3d cluster delete gate || true; fi
          docker ps -aq --filter 'name=^k3d-gate-' | xargs -r docker rm -f || true
          docker network rm k3d-gate 2>/dev/null || true
