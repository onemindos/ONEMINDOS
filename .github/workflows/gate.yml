# SPDX-License-Identifier: Apache-2.0
# The one required check for main (CI-02, issue 227; how it works: scripts/ci-gate.py).
# No `paths:` filter, so it reports on every PR and every merge-queue entry. It waits for every
# other workflow GitHub started for the same commit and fails if a blocking one failed. Founder:
# make `merge-gate` a required status check on main (repo settings); the per-workflow checks then
# need not be listed one by one. Not named `gate`: ci-apps, apps-gate-all and release already have
# jobs called `gate`, and a required check is matched by name, so a skipped one could satisfy it.
name: merge-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read
  actions: read   # list this commit's workflow runs
  pull-requests: read   # is the PR still a draft? (scripts/ci-gate.py still_draft)

# A new push to a PR replaces that PR's waiting gate.
concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  merge-gate:
    # CI-13 (#299): API-only (it polls this commit's runs), so it runs on the Mac's small gate pool when
    # LOCAL_GATE=on and the event is trusted (never a fork PR; merge_group is); otherwise GitHub-hosted.
    # Its own switch, not LOCAL_RUNNER: the runner loop sets LOCAL_GATE=on only while gate slots run, so an
    # empty or broken gate pool never stalls merges. docs/learning/self-hosted-runner.md
    runs-on: ${{ (vars.LOCAL_GATE == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","onemind-gate"]') || 'ubuntu-24.04' }}
    # The R530 KVM runner (CI-14) runs a PR's 13 x86 image/battery/cloud jobs on 5-6 job VMs, which takes
    # 3.5-4 h, so the gate waits up to 320 min (GATE_TIMEOUT_S) inside a 330-min job (GitHub-hosted max is 360).
    # A gate whose workflows finish early still passes early: it only polls while something is running.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: scripts/ci-gate.py
          sparse-checkout-cone-mode: false
      - name: Wait for this commit's workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          DRAFT: ${{ github.event.pull_request.draft && 'true' || 'false' }}
          PR: ${{ github.event.pull_request.number }}
          GATE_TIMEOUT_S: "19200"
        run: python3 -I scripts/ci-gate.py
