# SPDX-License-Identifier: Apache-2.0
# Generate from committed main nightly; preserve every fragment. Only the gate
# opens/reviews/merges the bot PR. Never push main, force-push or auto-merge.
name: changes-collect
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: read
concurrency:
  group: changes-collect
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # only this job; pushes bot/changes-collect, never main
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Generate documents (retain fragments)
        run: python3 -I scripts/changes.py generate
      - name: Push bot/changes-collect (no force)
        run: |
          if git diff --quiet -- CHANGELOG.md docs/leap/STATUS.md; then
            echo "nothing to generate"; exit 0
          fi
          if git ls-remote --exit-code --heads origin bot/changes-collect >/dev/null 2>&1; then
            git fetch origin bot/changes-collect
            if ! git merge-base --is-ancestor origin/bot/changes-collect HEAD; then
              echo "existing bot branch awaits the gate; retaining it unchanged"; exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b bot/changes-collect
          git add CHANGELOG.md docs/leap/STATUS.md
          git commit -s -m "chore(changes): generate CHANGELOG and STATUS from main fragments"
          git push origin HEAD:bot/changes-collect
