[project]
name = "onemind-sdk"
version = "0.1.0"
description = "Python client for the OneMind gateway API (sync and async), generated from OpenAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.2,<9",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onemind_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
