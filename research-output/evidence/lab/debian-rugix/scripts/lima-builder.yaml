# Disposable Lima build VM for the LAB-debian-rugix spike.
# Debian 13 arm64 cloud image (pinned by digest), Apple Virtualization (vz).
# Only the lab work folder is mounted; no home mount, no SSH agent forwarding.
vmType: vz
arch: aarch64
cpus: 10
memory: 24GiB
disk: 120GiB
images:
- location: https://cloud.debian.org/images/cloud/trixie/20261103-2651/debian-13-genericcloud-arm64-20261103-2651.qcow2
  arch: aarch64
  digest: sha512:5d3ecec46fd29605db4084388a1e2eb82fd19a80202898f962840ea73793261de721e505e3877c829ae86c37fdd2f6c205b0b3b1337a89d0d4b98d9081adc0c2
mountType: virtiofs
mounts:
- location: "{{.Env.LAB_WORK}}"
  mountPoint: /work
  writable: true
ssh:
  forwardAgent: false
containerd:
  system: false
  user: false
provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends docker.io docker-cli qemu-user-binfmt jq openssl git curl ca-certificates xz-utils zstd
    systemctl enable --now docker
