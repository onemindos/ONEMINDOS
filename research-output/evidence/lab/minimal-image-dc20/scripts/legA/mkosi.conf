# LAB-minimal-image-dc20 leg A: Debian 13 via mkosi (Debian package 25.3-7).
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
ImageId=onemind-deb

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=console=ttyS0,115200 console=tty1
Hostname=onemind-deb
Packages=
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-resolved
        systemd-boot
        systemd-boot-efi
        udev
        dbus
        iproute2
        iptables
        ca-certificates
        openssh-server
        e2fsprogs
        kmod
        util-linux
