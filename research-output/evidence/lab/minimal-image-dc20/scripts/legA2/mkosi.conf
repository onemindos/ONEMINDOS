# LAB-minimal-image-dc20 variant A2 (labelled, post-run): leg A + apparmor (k3s check-config needs apparmor_parser on Debian kernels).
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
ImageId=onemind-deb

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=console=ttyS0,115200 console=tty1
Hostname=onemind-deb
Packages=
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-resolved
        systemd-boot
        systemd-boot-efi
        udev
        dbus
        iproute2
        iptables
        ca-certificates
        openssh-server
        e2fsprogs
        kmod
        util-linux
        apparmor
