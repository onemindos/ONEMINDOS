// SPDX-License-Identifier: Apache-2.0
// Android-only Expo module: UnifiedPush (D-005, CORE-MOBILE-4). Autolinked from mobile/modules/.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'os.onemind'
version = '0.1.0'

android {
  namespace "os.onemind.unifiedpush"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // UnifiedPush Android connector: Apache-2.0 (Maven Central POM), released 2026-08-22.
  // Brings kotlin-stdlib and Google Tink (both Apache-2.0) for Web Push (RFC 8291) decryption.
  // No Google Play Services and no Firebase: the distributor is the person's own ntfy app.
  implementation "org.unifiedpush.android:connector:3.3.5"
}
