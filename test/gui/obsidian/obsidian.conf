; SPDX-License-Identifier: Apache-2.0
; Obsidian under the desktop base's supervisord (no user= key: everything runs as uid 1000). Electron's own setuid
; sandbox helper has no setuid bit in this image, so it runs with --no-sandbox; the container is the sandbox.
[program:obsidian]
environment=HOME="/home/neko",USER="neko",DISPLAY="%(ENV_DISPLAY)s"
command=/opt/Obsidian/obsidian --no-sandbox
stopsignal=INT
autorestart=true
priority=800
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
