# SPDX-License-Identifier: Apache-2.0
# Built-in descriptor (sdk/schema/onemind.builtin.schema.json). Read only because "photos" is on the signed list.
apiVersion: onemind.app/v1
kind: App
metadata:
  id: photos
  name: Photos
  description: The photo library and phone photo backup.
spec:
  routes:
    owns: [/v1/photos]
    calls:
      - GET /v1/photos/library
      - POST /v1/photos/sources
      - POST /v1/photos/uploads
      - GET /v1/photos/assets/{asset_id}/content
  search: {provider: photos, types: [photo]}
  share: {accepts: [file], verbs: [add]}
  backup:
    units:
      - {kind: dir, name: ONEMIND_PHOTOS_DIR}
      - {kind: table, name: photos_sources}
      - {kind: table, name: photos_assets}
      - {kind: table, name: photos_blobs}
      - {kind: table, name: photos_receipts}
      - {kind: table, name: photos_snapshots}
      - {kind: table, name: photos_uploads}
  data: {owns: [private, location], reads: []}
  phone: {entry: native, screen: photos}
