[project]
name = "onemind-core"
version = "0.1.0"
description = "OneMind OS Core gateway v0: REST API, action ledger, approvals, audit, node registry, app catalog"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.30,<3",
  "nats-py>=2.9,<3",
  "pyyaml>=6.0.1,<7",
  "jsonschema>=4.22,<5",
  "pydantic>=2.7,<3",
  "cryptography>=50.0.2,<51",
  "h11>=0.16,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
# PostgreSQL driver (BD-04 target datastore). The container image installs it.
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = [
  "pytest>=8.2,<9",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
onemind-gateway = "onemind_core.__main__:main"
onemind-audit-verify = "onemind_core.audit:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onemind_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "nats: needs a reachable NATS server (ONEMIND_TEST_NATS_URL)",
  "postgres: needs a reachable PostgreSQL (ONEMIND_TEST_PG_URL)",
]
