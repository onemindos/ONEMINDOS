# SPDX-License-Identifier: Apache-2.0
# Grants the app's role to every authenticated client of the cluster. Expected: R-02.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: escape}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: app}
subjects: [{kind: Group, name: "system:authenticated", apiGroup: rbac.authorization.k8s.io}]
