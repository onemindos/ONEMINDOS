# SPDX-License-Identifier: Apache-2.0
# Hands the app's role to a ServiceAccount of another namespace. Expected: R-02.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: escape}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: app}
subjects: [{kind: ServiceAccount, name: default, namespace: kube-system}]
