# ServiceAccount token trick: a legacy token Secret is filled with a token that never expires.
# Expected: gap. No app needs one; the rule file has no rule for it (secret type kubernetes.io/service-account-token).
apiVersion: v1
kind: Secret
metadata:
  name: escape
  annotations: {kubernetes.io/service-account.name: default}
type: kubernetes.io/service-account-token
