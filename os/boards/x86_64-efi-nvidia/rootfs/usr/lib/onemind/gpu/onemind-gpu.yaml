# SPDX-License-Identifier: Apache-2.0
# What k3s needs to hand a GPU to a pod (S-5): the "nvidia" RuntimeClass (k3s registers the matching containerd
# runtime itself when nvidia-container-runtime is on its PATH) and NVIDIA's device plugin, which tells Kubernetes
# the node has nvidia.com/gpu. A pod asks for it with `resources.limits: {nvidia.com/gpu: 1}`; one GPU, one pod.
# Plugin v0.20.2 (github.com/NVIDIA/k8s-device-plugin, Apache-2.0); image pinned by its multi-arch index digest
# (crane digest nvcr.io/nvidia/k8s-device-plugin:v0.20.2, 2026-11-21).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-device-plugin
    spec:
      runtimeClassName: nvidia
      priorityClassName: system-node-critical
      automountServiceAccountToken: false
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nvidia-device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.20.2@sha256:7673383d44a84bece724d9ca8feeadf4eee69cd46475fdff614cbbca6732d463
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
