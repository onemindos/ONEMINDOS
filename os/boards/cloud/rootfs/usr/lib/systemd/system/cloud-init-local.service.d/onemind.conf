# cloud-init runs before local-fs.target; make it wait for the writable paths it uses.
[Unit]
RequiresMountsFor=/var/lib/cloud /var/log /home /root /etc/systemd/network /var/lib/dhcpcd /var/lib/waagent
After=onemind-cloud-home.service
Wants=onemind-cloud-home.service
