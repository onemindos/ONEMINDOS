# SPDX-License-Identifier: Apache-2.0
# On a cloud the role comes from user-data, which cloud-init writes to
# /var/lib/cloud/instance/user-data.txt in its network stage (cloud-init >= 24.3 names that unit
# cloud-init-network.service; cloud-init.service before). Metadata-service clouds (EC2, GCE,
# Azure, Hetzner) have no seed disk to fall back to, so first boot must wait for it.
[Unit]
After=cloud-init-network.service cloud-init.service
