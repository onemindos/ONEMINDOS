# A cloud instance has a public address, and some clouds (Hetzner, DigitalOcean) have no default
# firewall: the setup wizard (which hands out the owner token) answers only on the instance itself.
# Reach it with `ssh -L 8080:localhost:8080 admin@<instance>` (docs/leap/core/CLOUD-IMAGES.md §4).
[Service]
IPAddressDeny=any
IPAddressAllow=localhost
