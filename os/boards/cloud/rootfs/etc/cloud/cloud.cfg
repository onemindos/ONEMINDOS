# OneMind cloud images: cloud-init configuration (docs/leap/core/CLOUD-IMAGES.md §2). Replaces
# Debian's cloud.cfg because the root filesystem is read-only: only modules that write to /data,
# /run, /home, /root or the tmpfs /etc/systemd/network are enabled, so `cloud-init status` ends
# "done". Each cloud-<name> board narrows datasource_list in
# /etc/cloud/cloud.cfg.d/90-onemind-datasource.cfg; this generic list is the `cloud` board's.
datasource_list: [ NoCloud, ConfigDrive, Ec2, GCE, Azure, Hetzner, None ]
users: [default]
disable_root: true
preserve_hostname: true
manage_etc_hosts: false
ssh_deletekeys: false
ssh_genkeytypes: []
resize_rootfs: false
growpart:
  mode: auto
  devices: [/data]
# Network config is rendered to /etc/systemd/network, a tmpfs, so render it on every boot.
updates:
  network:
    when: [boot]
cloud_init_modules: [seed_random, bootcmd, growpart, users_groups, ssh]
cloud_config_modules: [runcmd]
# scripts_vendor is left out on purpose: vendor scripts expect a writable root.
cloud_final_modules: [scripts_per_once, scripts_per_boot, scripts_per_instance, scripts_user,
                      ssh_authkey_fingerprints, keys_to_console, final_message]
system_info:
  distro: debian
  default_user:
    name: admin             # Azure: create the VM with --admin-username admin (/etc/passwd is read-only)
    gecos: OneMind admin
    shell: /bin/bash
    lock_passwd: false      # already locked in the image; true would rewrite /etc/shadow (read-only)
    sudo: null              # rule ships in /etc/sudoers.d/admin ("false" is deprecated since 22.2)
  network:
    renderers: [networkd]
  paths:
    cloud_dir: /var/lib/cloud/
    templates_dir: /etc/cloud/templates/
  ssh_svcname: ssh
