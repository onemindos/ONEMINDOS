# `nvbootctrl verify` (this unit's ExecStart) commits the booted slot. It runs only after the
# OneMind gate wrote its pass for *this* boot; otherwise the ExecStartPre fails and verify never
# runs, so the retry counter keeps falling and NVIDIA falls back to the other slot.
[Service]
ExecStartPre=/usr/lib/onemind/jetson/onemind-jetson wait-pass
TimeoutStartSec=20min
