# NVIDIA ships this unit as Type=simple, so "After=" in nv-l4t-bootloader-config.service only
# waits for it to *start*. Type=oneshot makes the ordering wait for the OneMind gate's verdict.
# (nv-rootfs-validation-config is the unit's name on L4T 39.2.1; a drop-in for an absent unit is ignored.)
[Service]
Type=oneshot
TimeoutStartSec=15min
