# NVIDIA's sample rootfs has no socat, and the builder installs no unpinned packages: serve the
# same one-line health answer (G6) with the rootfs's python3, still on 127.0.0.1:7070 only.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 -I /usr/lib/onemind/jetson/onemind_local_api.py
