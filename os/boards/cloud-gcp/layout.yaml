# SPDX-License-Identifier: Apache-2.0
# Cloud disks are billed by size, so the vm-do sizes (BD-DO-1): 4 GiB slots, a 16 GiB disk whose
# data partition cloud-init grows to the instance's volume at first boot. 16 GiB is a whole number
# of GiB (GCE requires it) and of MiB (Azure requires it). Labels are the 01 §4.3 contract.
table: gpt
disk_size: 16GiB
partitions:
  - {label: onemind-esp,      size: 1GiB,   type: esp,   fs: vfat, volume_id: 4F4E454D}  # GRUB + grubenv
  - {label: onemind-boot-a,   size: 512MiB, type: esp,   fs: vfat, fs_label: BOOT-A}     # kept for one layout contract
  - {label: onemind-boot-b,   size: 512MiB, type: esp,   fs: vfat, fs_label: BOOT-B}
  - {label: onemind-system-a, size: 4GiB,   type: linux, fs: rootfs, slot: A}
  - {label: onemind-system-b, size: 4GiB,   type: linux, fs: rootfs, slot: B}
  - {label: onemind-recovery, size: 1GiB,   type: linux, fs: none}
  - {label: onemind-data,     size: rest,   type: linux, fs: ext4}                       # grown at first boot
