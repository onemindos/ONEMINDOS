# OneMind vm-do cloud-init configuration (BD-DO-1). Replaces Debian's cloud.cfg, because the
# root filesystem is read-only: only modules that write to /data, /run, /home, /root or
# /etc/systemd/network (a tmpfs) are enabled, so `cloud-init status` can end "done".
# DigitalOcean requires ConfigDrive listed before NoCloud (DO Custom Images guide; C-BUILD-004).
datasource_list: [ ConfigDrive, NoCloud, None ]
users: [default]
disable_root: true
preserve_hostname: true
manage_etc_hosts: false
ssh_deletekeys: false
ssh_genkeytypes: []
resize_rootfs: false
growpart:
  mode: auto
  devices: [/data]
# Network config is rendered to /etc/systemd/network, a tmpfs, so render it on every boot.
updates:
  network:
    when: [boot]
cloud_init_modules: [seed_random, bootcmd, growpart, users_groups, ssh]
cloud_config_modules: [runcmd]
# scripts_vendor is left out on purpose: vendor scripts expect a writable root (findings F-08).
cloud_final_modules: [scripts_per_once, scripts_per_boot, scripts_per_instance, scripts_user,
                      ssh_authkey_fingerprints, keys_to_console, final_message]
system_info:
  distro: debian
  default_user:
    name: admin
    gecos: OneMind admin
    shell: /bin/bash
    lock_passwd: false      # already locked in the image; true would rewrite /etc/shadow (read-only)
    sudo: false             # rule ships in /etc/sudoers.d/admin
  network:
    renderers: [networkd]
  paths:
    cloud_dir: /var/lib/cloud/
    templates_dir: /etc/cloud/templates/
  ssh_svcname: ssh
