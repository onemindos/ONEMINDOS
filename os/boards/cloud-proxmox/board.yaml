# SPDX-License-Identifier: Apache-2.0
# Proxmox VE template, OVMF (docs/leap/core/CLOUD-IMAGES.md).
# No rootfs of its own: assembled from the `cloud` rootfs plus overlay/ (make cloud-image CLOUD=proxmox);
# `make rootfs BOARD=cloud-proxmox` fails on purpose (no rootfs/ directory here).
name: cloud-proxmox
arch: amd64
compatible: onemind-cloud-proxmox    # own RAUC compatible: an update bundle carries this cloud's overlay
route: grub-efi
rauc_bootloader: grub
grub_target: x86_64-efi
efi_binary: BOOTX64.EFI
console: "console=tty0 console=ttyS0,115200"
layout: layout.yaml
rootfs_from: cloud
overlay: overlay
outputs: [qcow2]
cloud: true
secure_boot: none
