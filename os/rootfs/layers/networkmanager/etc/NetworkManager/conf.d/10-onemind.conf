# NetworkManager on the hardware boards (Step 2 PR 3). The root is read-only: profiles live in
# /etc/NetworkManager/system-connections and state in /var/lib/NetworkManager, both bind mounts from /data
# (os/rootfs/layers/base/etc/fstab), so a saved Wi-Fi or static profile survives reboots and A/B updates.
[main]
plugins=keyfile
# DNS goes to systemd-resolved (the stub at 127.0.0.53 that /etc/resolv.conf points to), not to a file.
dns=systemd-resolved
# The box's name is the owner's (P-05: saved on /data and put back at boot by onemindd host apply-hostname).
# NetworkManager must not manage it: its default mode sets the image's static name (/etc/hostname, "onemind")
# back as the running name and would undo a rename at every boot; DHCP and reverse DNS must not rename it either.
hostname-mode=none

[keyfile]
# What the cluster and the mesh own. NetworkManager must never touch them: flannel and the CNI bridge are made
# by k3s, veth* are the pods' ends, tailscale0 belongs to tailscaled.
unmanaged-devices=interface-name:flannel*;interface-name:cni0;interface-name:veth*;interface-name:tailscale0

[connection]
# /etc/machine-id is transient on a read-only root (new at every boot), and NetworkManager derives its default
# DHCP client id and DUID from it. Use the MAC address instead, as the old networkd file did
# (ClientIdentifier=mac), so the lease and the address k3s binds to stay the same across reboots.
ipv4.dhcp-client-id=mac
ipv6.dhcp-duid=ll
ipv6.addr-gen-mode=eui64
