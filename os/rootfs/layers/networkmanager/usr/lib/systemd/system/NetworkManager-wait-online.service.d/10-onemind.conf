# Debian runs `nm-online -s`: wait until NetworkManager has tried every wired and Wi-Fi device. A second card
# that has a link but no DHCP server would hold k3s for the DHCP timeout (45 s). Without -s nm-online returns as
# soon as one connection is active, so an extra NIC is simply not required for "online". Still bounded: after
# NM_ONLINE_TIMEOUT seconds on a box with no network at all, boot goes on (k3s and the gateway work offline).
[Service]
Environment=NM_ONLINE_TIMEOUT=30
ExecStart=
ExecStart=/usr/bin/nm-online -q
