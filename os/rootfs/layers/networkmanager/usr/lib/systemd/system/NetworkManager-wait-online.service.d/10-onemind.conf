# Debian runs `nm-online -s`: wait until NetworkManager has tried every wired and Wi-Fi device. A second card
# that has a link but no DHCP server would hold k3s for the DHCP timeout (45 s), and even plain `nm-online`
# keeps waiting while any device is still activating. This unit waits for ONE connected device instead
# (usr/lib/onemind/nm-wait-online), so an extra NIC is simply not required for "online". Still bounded: after
# NM_ONLINE_TIMEOUT seconds on a box with no network at all, boot goes on (k3s and the gateway work offline).
[Service]
Environment=NM_ONLINE_TIMEOUT=30
ExecStart=
ExecStart=/usr/lib/onemind/nm-wait-online
