# SPDX-License-Identifier: Apache-2.0
# On a NetworkManager board k3s waits for NetworkManager-wait-online, so the node has an address when it
# registers. network-online.target already pulls that unit in (it is WantedBy network-online.target); the line
# here makes the ordering explicit and testable (test/qemu NW2).
[Unit]
Wants=NetworkManager-wait-online.service
After=NetworkManager-wait-online.service
