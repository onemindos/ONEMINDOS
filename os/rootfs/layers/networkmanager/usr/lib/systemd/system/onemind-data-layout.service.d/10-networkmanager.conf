# Bind-mount sources for the two NetworkManager folders (os/rootfs/layers/networkmanager/usr/lib/onemind/fstab.networkmanager).
[Service]
ExecStart=/bin/sh -c 'mkdir -p /data/state/etc-NetworkManager-system-connections /data/state/var-lib-NetworkManager; chmod 0700 /data/state/etc-NetworkManager-system-connections'
