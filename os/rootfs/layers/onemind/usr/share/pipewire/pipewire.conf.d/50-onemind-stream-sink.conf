# A virtual audio sink that is always there, on a box with a speaker and on one without. Streamed desktop apps
# and the box's own screen session always find an output, so an app that wants sound never fails for lack of a
# device, and the streaming runtime can record this sink's monitor. A real sound card (or a Bluetooth speaker)
# is preferred whenever one exists: this sink's priority is the lowest.
# Read by every PipeWire daemon in a user session (/usr/share/pipewire/pipewire.conf.d).
context.objects = [
    { factory = adapter
      args = {
          factory.name           = support.null-audio-sink
          node.name              = "onemind-stream-sink"
          node.description       = "OneMind stream"
          media.class            = Audio/Sink
          audio.position         = [ FL FR ]
          priority.session       = 1
          priority.driver        = 1
          monitor.channel-volumes = true
          object.linger          = true
      }
    }
]
