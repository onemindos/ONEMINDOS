# BlueZ settings for the boxes with a screen (x86_64-efi, rpi5). Debian's /etc/bluetooth/main.conf is left alone;
# bluetooth.service.d/10-onemind.conf points bluetoothd here with -f, so the choices are in the signed image.
#
# Off until the owner turns it on: with AutoEnable=false the adapter stays powered down when bluetoothd finds it.
# Never open for long: if the owner makes the box discoverable or pairable, it closes again after two minutes.
# AlwaysPairable=false: with no pairing agent registered (the owner's screen registers one only while a "pair a
# device" window is open) an incoming pairing request is refused, so a stranger in range cannot pair on their own.
# Everything else stays at the BlueZ default.
[General]
Name = OneMind
DiscoverableTimeout = 120
PairableTimeout = 120
AlwaysPairable = false
JustWorksRepairing = never

[Policy]
AutoEnable = false
