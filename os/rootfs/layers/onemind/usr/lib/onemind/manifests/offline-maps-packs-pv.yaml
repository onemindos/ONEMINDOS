apiVersion: v1
kind: PersistentVolume
metadata:
  name: offline-maps-packs
spec:
  capacity:
    storage: 16Gi
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /data/onemind/maps/packs
  claimRef:
    namespace: app-offline-maps
    name: offline-maps-packs
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            # If OneMind gains multiple k3s servers, use a dedicated first-boot hub label.
            - key: node-role.kubernetes.io/control-plane
              operator: In
              values: ["true"]
