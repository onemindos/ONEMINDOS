# Desktop apps from Flathub (#1097): the installation, each app's granted folder and the launch file the streaming
# runtime reads all live on /data (the root is read-only). The flatpak home holds only its caches.
d /data/onemind/flatpak 0755 root root -
d /data/onemind/flatpak/home 0700 root root -
d /data/onemind/desktop-apps 0755 root root -
d /data/onemind/desktop-session 0755 root root -
