# File sharing (FILES-SHARE-01, #235): the root is read-only, so the Unix accounts that only exist to name Samba's
# users (libnss-extrausers) live on /data, where `onemindd host serve` writes them (internal/smb).
L+ /var/lib/extrausers - - - - /data/onemind/samba/extrausers
