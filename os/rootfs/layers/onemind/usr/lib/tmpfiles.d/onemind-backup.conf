# IMG-BACKUP-01: folders onemindd's backup drop-in may write. systemd drops a ReadWritePaths=- entry
# whose folder is missing at service start, which would leave app volumes read-only for a restore
# (found by test/backup-wire). /run is empty at every boot, so this runs at every boot.
d /run/onemind/backup 0755 root root -
d /data/k3s/storage 0700 root root -
d /data/onemind/backup 0700 root root -
