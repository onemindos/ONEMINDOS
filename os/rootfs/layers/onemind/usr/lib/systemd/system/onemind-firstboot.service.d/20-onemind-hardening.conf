# Sandbox for the first-boot oneshot (image audit 2026-11-21, item 12). It still runs as root because it
# mounts the boot partition and writes per-box secrets, but it can no longer load kernel modules, change
# the clock, read the kernel log or create new namespaces. Scored by test/unit/test_unit_security.py.
[Service]
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
ProtectControlGroups=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
SystemCallArchitectures=native
PrivateTmp=yes
ProtectHome=read-only
