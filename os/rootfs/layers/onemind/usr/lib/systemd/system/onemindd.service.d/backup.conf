# IMG-BACKUP-01: what the backup agent inside onemindd needs on the image (the image twin of
# deploy/systemd/onemindd-backup.conf). onemindd normally holds no capabilities and sees a read-only
# disk. Backing up reads every app's files and a restore writes them back with their owners, so this
# grants exactly four capabilities and a short list of writable folders. The agent starts only when
# /data/onemind/backup/agent.json exists (onemind-firstboot writes it on a hub); every restore still
# needs a signed, owner-approved job (internal/backup/job.go).
[Service]
CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_DAC_OVERRIDE CAP_CHOWN CAP_FOWNER
# "-": a missing folder is skipped and then stays read-only for the whole run, so
# tmpfiles.d/onemind-backup.conf creates them before onemindd starts.
ReadWritePaths=-/data/onemind -/data/k3s/storage -/run/onemind/backup
# The owner's files on the @storage mount (#1148), so a restore can write them back. No tmpfiles line for it, on
# purpose: /data/storage existing is what tells data-storage.mount the disk is btrfs, so an ext4 box must not get one.
ReadWritePaths=-/data/storage
# SQLite online copies open the live database; in WAL mode (k3s) even a reader writes the -shm file.
ReadWritePaths=-/data/k3s/server/db
SystemCallFilter=
SystemCallFilter=@system-service
SystemCallFilter=~@clock @cpu-emulation @debug @module @mount @obsolete @raw-io @reboot @swap
# One-shot: create the device key if missing (the "-" lets onemindd start when backups are off).
ExecStartPre=-/usr/bin/onemindd backup-init
Nice=10
IOSchedulingClass=idle
