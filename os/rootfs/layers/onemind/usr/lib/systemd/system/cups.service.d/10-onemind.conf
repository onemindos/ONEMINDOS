# OneMind OS printing (Step 3): Debian's cups.service plus the read-only-root rules. cupsd writes to /etc/cups,
# /var/spool/cups, /var/cache/cups and /var/log/cups; the first three are bind mounts from /data/state (fstab), so
# the unit waits for them and never writes printers into the slot's read-only root. Docs: docs/learning/printing.md.
[Unit]
RequiresMountsFor=/data /etc/cups /var/spool/cups /var/cache/cups
After=onemind-data-layout.service

[Service]
ProtectHome=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
LockPersonality=yes
RestrictRealtime=yes
SystemCallArchitectures=native
