# The name the owner gave the box (Settings > About, `onemind name set`, host kind set-hostname, P-05) lives on
# /data/onemind/etc/hostname, because the root image is read-only. Put it back as the kernel's name now, before
# avahi starts (multi-user.target), so <name>.local answers after a reboot. No file (never renamed): nothing
# happens and the image's name stays. A leading "-" keeps a failure here from failing the data layout.
[Service]
ExecStartPost=-/usr/bin/onemindd host apply-hostname
