# Bluetooth on a box with a screen (Step 3): pairings are kept on the data partition, never on the read-only root,
# so they survive a reboot and an A/B update. The settings come from the image (-f), not from /etc/bluetooth.
# bluetoothd refuses to start if the data partition is not mounted (Requires), instead of writing keys nowhere.
# Only the boards that install bluez ship /usr/libexec/bluetooth/bluetoothd; every other board skips this unit.
# Debian starts bluetoothd only once the kernel shows a Bluetooth adapter (ConditionPathIsDirectory=/sys/class/bluetooth).
# On these boards it runs from boot, adapter or not: the owner's "turn Bluetooth on" has something to talk to, a USB
# dongle plugged in later is picked up at once, and a box with no radio (or a VM) still shows a running service.
[Unit]
ConditionPathIsDirectory=
Requires=var-lib-bluetooth.mount
After=var-lib-bluetooth.mount

[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd -f /usr/lib/onemind/bluetooth/main.conf
