# OneMind OS printing (Step 3): the state directories CUPS and ipp-usb write to, on the data partition, before the
# binds in /etc/fstab run. /etc/cups is seeded once from the image's copy (the cups-default folder), so a fresh data
# partition (factory reset, restore) boots with working defaults; an existing one is never overwritten.
# The "lp" group is gid 7 on Debian and Ubuntu (base-passwd), root-owned spool as cupsd itself expects.
[Service]
ExecStart=/bin/sh -c 'mkdir -p /data/state/etc-cups /data/state/var-spool-cups /data/state/var-cache-cups /data/state/var-lib-ipp-usb; [ -f /data/state/etc-cups/cupsd.conf ] || cp -a /usr/lib/onemind/cups-default/. /data/state/etc-cups/; chown 0:7 /data/state/var-spool-cups /data/state/var-cache-cups; chmod 0710 /data/state/var-spool-cups; chmod 0771 /data/state/var-cache-cups; chmod 0755 /data/state/var-lib-ipp-usb'
