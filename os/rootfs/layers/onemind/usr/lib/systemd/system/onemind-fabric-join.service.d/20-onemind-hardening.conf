# Sandbox for a root oneshot (image audit 2026-11-21, item 12): no kernel module, clock, kernel-log or
# namespace access, and no kernel tunables. Scored by test/unit/test_unit_security.py.
[Service]
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
ProtectControlGroups=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
SystemCallArchitectures=native
PrivateTmp=yes
ProtectHome=read-only
ProtectKernelTunables=yes
