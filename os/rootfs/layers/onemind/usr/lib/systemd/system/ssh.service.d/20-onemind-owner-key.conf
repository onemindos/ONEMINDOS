# Hardware boards: sshd starts only once the owner has added a key (`onemind-owner key-add`). Until then the
# unit is skipped and nothing listens on tcp/22. onemind-ssh-owner-key.path starts it when the key arrives.
# Cloud boards delete this file in their post-install.sh: cloud-init puts the key there after boot.
# ensure: sshd's PAM account check needs a shadow line for admin even though no password is used; the line is
# a locked one until the owner sets a console password.
[Unit]
ConditionFileNotEmpty=/home/admin/.ssh/authorized_keys

[Service]
ExecStartPre=+/usr/lib/onemind/onemind-owner ensure
