# Before every start of k3s: if its generated state is damaged (0-byte certificates, tokens or node password
# after a power cut, VM 501 bug 1), move it aside so k3s makes it again. Never touches the owner's data, apps'
# volumes or the gateway database. See onemind_k3s_state.py.
# ExecCondition, not ExecStartPre: when rebuilding the cluster state would need the owner (their apps are in the
# datastore, or it cannot be read), recover exits 3 and systemd skips k3s: not failed, and Restart=always does not
# retry it (systemctl show -p Result k3s prints exec-condition), so nothing opens or writes the old datastore
# until the owner approves "Reset k3s state" in the rescue console, which starts k3s again. Every other outcome,
# including a repair that could not run, exits 0 and k3s starts.
[Service]
ExecCondition=/usr/lib/onemind/onemind-k3s-state recover
