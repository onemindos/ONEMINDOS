# Before every start of k3s: if its generated state is damaged (0-byte certificates, tokens or node password
# after a power cut, VM 501 bug 1), move it aside so k3s makes it again. Leading "-": a failed repair never
# blocks k3s. Never touches the owner's data, apps' volumes or the gateway database; if the owner's apps are in
# the cluster it only alerts and waits for "Reset k3s state" in the rescue console. See onemind_k3s_state.py.
[Service]
ExecStartPre=-/usr/lib/onemind/onemind-k3s-state recover
