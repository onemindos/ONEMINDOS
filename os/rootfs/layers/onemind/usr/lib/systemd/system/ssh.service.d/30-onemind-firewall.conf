# SPDX-License-Identifier: Apache-2.0
# Host firewall (host.nft): 22/tcp is open from the LAN and the mesh only while sshd runs (the "ssh" chain), closed
# again when it stops. "+" runs nft outside the unit's sandbox. A firewall restart reloads host.nft and empties the
# chain, so sshd restarts with it and the rule comes back.
# Rate limit (P-06): a source may open at most 6 new connections a minute (burst 6), counted per address, IPv4 and
# IPv6 apart; the rest are dropped before sshd sees them. A person logging in a few times never notices; a guessing
# loop is slowed to a crawl. The drop rules go first, the accept rule last.
# The two counting sets are declared once in host.nft (dynamic, timeout). A "meter" statement would create a named set
# on every start, and the second start (SSH off then on) would be refused ("meter overlaps an existing set"), leaving
# the port with no limit. "add @set" reuses the declared set, so every start works. The limit rules have no "-": if one
# fails, ssh.service fails and the journal says why, and the accept rule (last) is never added, so the port stays closed.
[Unit]
PartOf=onemind-firewall.service
After=onemind-firewall.service

[Service]
ExecStartPost=-+/usr/sbin/nft flush chain inet onemind_host ssh
ExecStartPost=+/usr/sbin/nft add rule inet onemind_host ssh tcp dport 22 ct state new add @ssh_new_v4 { ip saddr timeout 1m limit rate over 6/minute burst 6 packets } drop
ExecStartPost=+/usr/sbin/nft add rule inet onemind_host ssh tcp dport 22 ct state new add @ssh_new_v6 { ip6 saddr timeout 1m limit rate over 6/minute burst 6 packets } drop
ExecStartPost=-+/usr/sbin/nft add rule inet onemind_host ssh tcp dport 22 accept
ExecStopPost=-+/usr/sbin/nft flush chain inet onemind_host ssh
