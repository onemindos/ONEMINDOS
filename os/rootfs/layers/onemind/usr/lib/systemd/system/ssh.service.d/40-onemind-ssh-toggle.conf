# The owner's SSH on/off switch (P-06). `onemind-owner ssh-off` creates this flag file on the data partition, so the
# choice survives a reboot and an A/B update; `ssh-on` removes it. While it exists ssh.service is skipped, and the
# owner-key path unit cannot start it either. All boards (hardware and cloud) carry this file.
[Unit]
RequiresMountsFor=/data/onemind/ssh
ConditionPathExists=!/data/onemind/ssh/disabled
