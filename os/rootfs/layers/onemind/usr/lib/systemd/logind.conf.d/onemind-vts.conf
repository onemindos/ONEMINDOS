# The box's text consoles: tty1 is the status screen (onemind-screen.service), tty2 the admin login (getty@tty2,
# enabled in the Containerfile), tty3 the owner recovery console with the emergency kit
# (onemind-recovery-console.service, design 25c). logind must not start a login prompt on tty3 (or tty4-6) when
# someone switches there, so automatic consoles stop at tty2 and none is reserved.
[Login]
NAutoVTs=2
ReserveVT=0
