# SPDX-License-Identifier: Apache-2.0
# Owner shell policy for every OneMind box (cloud and hardware). Debian's sshd_config includes this directory
# first, and sshd keeps the first value it reads, so these lines win over the package defaults.
# Host keys are per device and live on the data partition, never in the shared slot image
# (onemind-ssh-hostkeys.service makes them once).
HostKey /data/onemind/ssh/ssh_host_ed25519_key
HostKey /data/onemind/ssh/ssh_host_rsa_key
# Public key only, and only for the one owner account. No password ever crosses the network.
AllowUsers admin
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
