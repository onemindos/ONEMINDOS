# Desktop apps from Flathub (issue #1097): the one Flatpak installation OneMind uses, on /data so the root stays
# read-only and the apps survive a reboot and an A/B OS update. `onemindd host serve` is the only caller, and only for
# an install, update or removal an owner approved (internal/flatpak).
[Installation "onemind"]
Path=/data/onemind/flatpak
DisplayName=OneMind desktop apps
StorageType=harddisk
