# Kernel hardening baseline (KSPP, the Linux kernel's self-protection recommendations, plus the usual
# network hygiene). The kernel reads these at boot; they close doors that a normal home box never needs.
# Each value was chosen so k3s, Tailscale and the NATS leaf keep working. Not set on purpose:
# kernel.unprivileged_userns_clone and user.max_user_namespaces (rootless tools need them) and
# kernel.modules_disabled (it would block the USB and network drivers a power user plugs in).

# Hide kernel addresses and the kernel log from non-root users: a leaked address defeats KASLR.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# Profiling and BPF are root-only: both have a long record of local privilege escalation bugs.
kernel.perf_event_paranoid = 3
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# One process may only trace its own children, and a running kernel cannot be replaced by kexec.
kernel.yama.ptrace_scope = 1
kernel.kexec_load_disabled = 1
# The magic SysRq key can reboot or dump memory from a keyboard; off.
kernel.sysrq = 0
kernel.randomize_va_space = 2
# Refuse to auto-load a TTY line discipline module, and userfaultfd for non-root (exploit helpers).
dev.tty.ldisc_autoload = 0
vm.unprivileged_userfaultfd = 0
vm.mmap_min_addr = 65536

# Files: no core dumps from setuid programs, and stricter /tmp races (links, fifos, regular files).
fs.suid_dumpable = 0
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Network: no redirects or source routing, SYN cookies on, log impossible source addresses.
# rp_filter is 2 (loose), not 1 (strict): Tailscale and flannel route replies over a different
# interface than they arrive on, and strict mode would drop that traffic.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
