# The values the kubelet (k3s's node agent) insists on when it runs with protect-kernel-defaults
# (etc/rancher/k3s/config.yaml.d/20-onemind-hardening.yaml). With that flag the kubelet refuses to start
# if the kernel differs, instead of silently changing the kernel itself. So the image sets them here.
# Source: https://docs.k3s.io/security/hardening-guide
vm.panic_on_oom = 0
vm.overcommit_memory = 1
kernel.panic = 10
kernel.panic_on_oops = 1
kernel.keys.root_maxbytes = 25000000
kernel.keys.root_maxkeys = 1000000
