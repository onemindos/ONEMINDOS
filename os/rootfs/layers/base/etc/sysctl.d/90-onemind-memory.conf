# Swap is zram (RAM), so paging out is cheap: prefer it to dropping the page cache, and read one page at a
# time (no read-ahead is useful on zram). Values are the usual zram defaults (UNVERIFIED on this image
# until the QEMU memory test and the hardware run measure them).
vm.swappiness = 100
vm.page-cluster = 0
