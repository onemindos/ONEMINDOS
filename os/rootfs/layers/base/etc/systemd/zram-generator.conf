# Compressed swap in RAM (systemd-zram-generator). Cold pages of a big app are squeezed instead of the box
# running out of memory. Half the RAM, at most 4 GiB of zram; zstd compresses about 2 to 3 times.
# No swap file on the disk: that would wear flash and slow the control plane's own writes.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
