# smartd, the disk watcher (storage housekeeping, P-10). It runs in the background, asks every disk that speaks SMART
# how it is doing, and runs a short self-test now and then. When a disk reports trouble, smartd does not send e-mail
# (this box has no mail system): it runs /usr/lib/onemind/smartd-notify, which writes one line to
# /var/lib/smartmontools/onemind-alerts.jsonl (on /data). The host service reads that file and the hub turns each new
# line into an alert in Notifications. Nothing here changes a disk.
#
# DEVICESCAN  every disk smartd finds; a disk without SMART (a virtual disk, some USB bridges) is skipped quietly
# -a          the usual checks: health, usage and error-count attributes, error logs, self-test log
# -o on       let the disk run its own offline data collection
# -S on       let the disk save its attributes across power cycles
# -n standby,q  never spin up a sleeping disk just to check it; do not log the skip
# -s ...      short self-test every night at 02:00, long self-test on Saturdays at 03:00
# -W 4,60,70  warn when a disk's temperature changes by 4 degrees, is 60 C (warning) or 70 C (critical): the same
#             limits the Storage screen uses (internal/storage DefaultThresholds)
# -m <nomailer> -M exec ...  do not mail; run the script instead
# -M daily    remind once a day while the problem lasts (the script folds the reminders into one alert)
DEVICESCAN -a -o on -S on -n standby,q -s (S/../.././02|L/../../6/03) -W 4,60,70 -m <nomailer> -M exec /usr/lib/onemind/smartd-notify -M daily
