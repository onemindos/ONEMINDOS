# OneMind OS update settings (read by onemindd's updater; format and meaning: os/update/CHANNEL.md §4).
# Image default (founder decision on Z-02, 2026-11-28): ask first. The box checks the security channel
# and tells the owner; nothing installs or reboots until the owner approves. Automatic installs inside
# the maintenance window are an opt-in: Settings > Updates or `onemind update settings set --policy auto`,
# stored as the owner's copy under /data (owner.conf), which overrides this read-only default.
channel=security
url=https://github.com/onemindos/ONEMINDOS/releases/download/os-channel-security
window=02:00-05:00
policy=notify
