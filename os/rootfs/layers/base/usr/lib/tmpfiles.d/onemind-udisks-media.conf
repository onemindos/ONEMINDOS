# Debian's udisks2 mounts a drive the owner asks for under /media/<user>/, and /media is on the read-only root, so the
# mount failed (found in first-boot check F14). The image makes /media a symlink to /run/media (os/rootfs/Containerfile);
# this creates the target at every boot. /run is a tmpfs:
# a mounted drive never survives a reboot, which is what we want for a USB stick.
d /run/media 0755 root root -
