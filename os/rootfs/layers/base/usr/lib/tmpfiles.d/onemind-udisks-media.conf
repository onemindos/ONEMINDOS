# udisks2 mounts a drive the owner asks for under /run/media/<user>/ when /run/media exists, and under /media/<user>/
# otherwise. /media is on the read-only root, so the mount would fail (found in first-boot check F14). /run is a tmpfs:
# a mounted drive never survives a reboot, which is what we want for a USB stick.
d /run/media 0755 root root -
