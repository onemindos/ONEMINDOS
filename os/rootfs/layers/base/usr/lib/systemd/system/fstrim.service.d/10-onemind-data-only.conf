# Weekly TRIM (fstrim.timer) for the writable disk only. Debian's unit trims every filesystem in /etc/fstab, and the
# slot root is read-only: FITRIM on it fails with "Read-only file system" and the unit would end up failed every week.
# /data is the one filesystem that writes. --quiet-unsupported: a disk or a LUKS /data without discard is not an error.
# The same weekly run is a harmless catch-up if /data becomes btrfs, whose kernel already discards asynchronously.
[Service]
ExecStart=
ExecStart=/sbin/fstrim --verbose --quiet-unsupported /data
