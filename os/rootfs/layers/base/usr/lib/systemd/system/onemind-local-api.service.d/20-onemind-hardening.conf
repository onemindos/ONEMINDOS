# SPDX-License-Identifier: Apache-2.0
# Sandbox for the health-gate's local API stand-in (image audit 2026-11-21, item 12). It only answers one
# line on 127.0.0.1:7070, so it runs as a throwaway user with no capabilities, no files and loopback only.
# Scored by test/unit/test_unit_security.py.
[Service]
DynamicUser=yes
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictRealtime=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
UMask=0077
IPAddressAllow=localhost
IPAddressDeny=any
