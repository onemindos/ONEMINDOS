# SPDX-License-Identifier: Apache-2.0
# Keep the Kubernetes node's name when the owner renames the box (P-05). k3s names its node after the host name;
# a new name at the next boot would be a new node, and local-path volumes belong to the old one. The first rename
# (internal/host/rename.go) writes K3S_NODE_NAME=<the name before the rename> here, on the data partition, and k3s
# reads it as its --node-name. No file (never renamed): nothing changes. onemind-k3s-check reads the same file.
[Service]
EnvironmentFile=-/data/onemind/etc/k3s.env
