# Before the state folders are made and bound: remount /data with nodelalloc (ext4) or flushoncommit (btrfs), so a
# power cut never leaves files that are named on the disk but whose data is not (VM 501 bug 1, CRITERIA-FIRSTBOOT.md
# F26; see /usr/lib/onemind/data-durable and the /data line in /etc/fstab). Leading "-": it never fails the boot.
[Service]
ExecStartPre=-/usr/lib/onemind/data-durable /data
