# The edge profile (#751): one image on every box, and an edge (role "leaf", picked at install) never
# runs a k3s server. k3s stays enabled because a box boots it before it has a role (the battery and the
# setup wizard need it); once onemind-firstboot has written the role file, a leaf skips k3s here.
# ExecCondition exit 1 means "skipped": the unit is not failed and Restart=always does not retry it
# (systemctl show -p Result k3s prints exec-condition). No role file yet, or any other role: k3s runs.
[Service]
ExecCondition=/bin/sh -c '! grep -qsx leaf /data/onemind/etc/role'
