# SPDX-License-Identifier: Apache-2.0
# Only on a btrfs box whose @storage subvolume is mounted (data-storage.mount) with its .snapshots subvolume inside.
# An ext4 box (installed before #152), or one whose /data/storage did not mount, skips the run instead of failing: a
# failed unit is fatal to the health gate.
[Unit]
After=data-storage.mount
ConditionPathExists=/data/storage/.snapshots
After=onemind-firstboot.service

[Service]
UMask=0022
