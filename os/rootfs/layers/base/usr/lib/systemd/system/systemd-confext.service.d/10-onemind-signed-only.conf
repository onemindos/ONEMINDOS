# SPDX-License-Identifier: Apache-2.0
# Signed configuration extensions only (socket E3, T-W19-01, #186; test/qemu/CRITERIA-SYSEXT.md).
# A configuration extension (confext) adds files under /etc at boot. The same rules as
# systemd-sysext.service.d/10-onemind-signed-only.conf: signed dm-verity disk images only, keys only in the
# read-only /usr/lib/verity.d, no plain directories, read-only result. A confext image uses a root partition.
[Unit]
RequiresMountsFor=/data/state/var-lib-confexts
After=onemind-data-layout.service
Before=k3s.service

[Service]
ExecStartPre=/usr/lib/onemind/sysext-guard confext
ExecStart=
ExecStart=systemd-confext refresh --mutable=no --image-policy=root=signed+absent
ExecReload=
ExecReload=/usr/lib/onemind/sysext-guard confext
ExecReload=systemd-confext refresh --mutable=no --image-policy=root=signed+absent
