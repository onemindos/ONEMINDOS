# The monthly scrub of /data (/etc/default/btrfsmaintenance). Same guard as snapper: only on a btrfs box with @storage
# mounted (that is what proves /data is btrfs; an ext4 box has no /data/storage/.snapshots).
[Unit]
After=data-storage.mount
ConditionPathExists=/data/storage/.snapshots
