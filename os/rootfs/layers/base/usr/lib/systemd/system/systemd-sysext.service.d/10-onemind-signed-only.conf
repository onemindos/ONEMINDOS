# SPDX-License-Identifier: Apache-2.0
# Signed host extensions only (socket E3, T-W19-01, #186; test/qemu/CRITERIA-SYSEXT.md).
# A system extension (sysext) adds files under /usr and /opt of the read-only image at boot. OneMind merges
# only disk images whose dm-verity root hash is signed by a certificate in the read-only /usr/lib/verity.d:
#   --image-policy=root=signed+absent:usr=signed+absent  every partition used must be verity + signed
#   sysext-guard                                          refuses plain directories and keys in /etc or /run
#   --mutable=no                                          the merged /usr stays read-only
# /var/lib/extensions is a symlink to /data/state/var-lib-extensions (the data partition, kept across A/B
# updates): the merge waits for it, and without the data partition nothing merges.
[Unit]
RequiresMountsFor=/data/state/var-lib-extensions
After=onemind-data-layout.service
# Merged before k3s starts, so k3s and the apps see the extension's files from their first start.
Before=k3s.service

[Service]
ExecStartPre=/usr/lib/onemind/sysext-guard sysext
ExecStart=
ExecStart=systemd-sysext refresh --mutable=no --image-policy=root=signed+absent:usr=signed+absent
ExecReload=
ExecReload=/usr/lib/onemind/sysext-guard sysext
ExecReload=systemd-sysext refresh --mutable=no --image-policy=root=signed+absent:usr=signed+absent
