# Drop-in for onemindd.service: what the in-process backup agent (internal/backup, started as
# backup.Service() when agent.json exists) needs on top of the heartbeat agent's locked-down unit.
# Install as /etc/systemd/system/onemindd.service.d/backup.conf (deploy/backup.sh does).
#
# In plain words: there is ONE backup service and it lives inside onemindd, so there is no second
# unit. onemindd normally runs with every capability removed and a read-only filesystem. Backing
# up must read every app's files and restoring must write them back with their owners, so this
# drop-in grants exactly four capabilities and a short list of writable folders, and nothing else.
# The trade-off (the always-on heartbeat process holds those four capabilities) is accepted so that
# two processes never write the same backup state; every restore still needs a signed, owner
# approved job (internal/backup/job.go) and writes only after moving the old data aside.

[Service]
# Read any file (backup), write files back as their owners (restore).
CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_DAC_OVERRIDE CAP_CHOWN CAP_FOWNER
# "-": skipped when missing, and a skipped path stays read-only for the whole run of the service,
# so deploy/backup.sh creates these at boot (tmpfiles.d) before onemindd starts.
ReadWritePaths=-/data/onemind -/var/lib/rancher/k3s/storage -/run/onemind/backup -/var/lib/onemind-backup
# SQLite online copies open the live database; in WAL mode (k3s) even a reader writes the -shm file.
ReadWritePaths=-/var/lib/onemind -/var/lib/rancher/k3s/server/db
CacheDirectory=onemind-backup
# The base unit denies @privileged, which contains @chown; list the other groups one by one instead.
SystemCallFilter=
SystemCallFilter=@system-service
SystemCallFilter=~@clock @cpu-emulation @debug @module @mount @obsolete @raw-io @reboot @swap
# One-shot: create the device key if missing (the "-" lets onemindd start when backups are off).
ExecStartPre=-/usr/local/bin/onemindd backup-init
# restic and scratch restores are bulk work: never starve the apps or the heartbeat.
Nice=10
IOSchedulingClass=idle
