# SPDX-License-Identifier: Apache-2.0
# OneMind hub on a Mac with Docker (contract sdk/contracts/poc-v0.md §6): NATS, the gateway with
# the noop executor, the dashboard (built once, served by the gateway), one node (onemindd in a
# container) and two simulated machines, a Raspberry Pi 5 and a Jetson (simnode).
# DEVELOPMENT ONLY. Every port is bound to 127.0.0.1, so nothing is reachable from the network.
# NATS signs clients in with per-client nkeys like the image (the nats-keys service makes them).
# What this stack does NOT test: the image gives each machine its own leaf account with per-subject
# permissions (natsconf.py NODE_<id> accounts). Here the gateway, node-sim and both simulated machines
# are plain clients of the one hub account (ONEMIND), which has no per-subject permissions. A passing
# dev run therefore proves "every client needs a key", not "a machine can publish only its own subjects";
# that is covered by core/tests/test_natsconf.py and the image battery.
#
#   ./gen-tokens.sh                 # once: random owner + agent tokens into ./local/ (gitignored)
#   docker compose up -d --build    # from this directory
#   ../verify/verify.sh http://127.0.0.1:8080 --token-file local/owner.token \
#       --agent-token-file local/agent.token
#   docker compose down -v
name: onemind-dev

x-onemindd-build: &onemindd-build
  context: ../..
  dockerfile: deploy/compose/onemindd.Dockerfile

services:
  # One-shot: makes a NATS user key per client (a seed file, mode 0600, owned by that client's own uid:
  # the gateway 10001, node-sim 10002, sim-rpi5 10003, sim-jetson 10004, so no client can read another's
  # seed; the keys directory itself is listable) and its public key) and the hub's accounts file, the same way the image does (core/onemind_core/natsconf.py,
  # CORE-SEC-4 #161). Runs as root only to hand each seed to its client's uid; exits when done.
  nats-keys:
    build: &core-build
      context: ../..
      dockerfile: core/Dockerfile
    image: onemind-core:compose-dev
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        d=/nats/keys
        mkdir -p $$d
        for s in gateway observer node-sim sim-rpi5 sim-jetson; do python -m onemind_core.natsconf service-key $$d $$s >/dev/null; done
        rm -f /nats/accounts.conf
        python -m onemind_core.natsconf /nats/accounts.conf $$d
        # The observer (#620, N3) is the gateway's read-only reader of the server's connect events.
        chown 10001:10001 $$d/gateway.nk $$d/observer.nk
        chown 10002:10002 $$d/node-sim.nk
        chown 10003:10003 $$d/sim-rpi5.nk
        chown 10004:10004 $$d/sim-jetson.nk
        # nats-server resolves an include relative to the including file, so the config sits beside it.
        cp /src/nats.conf /nats/nats.conf
        chmod 0755 /nats $$d && chmod 0644 /nats/accounts.conf /nats/nats.conf
    volumes:
      - nats-config:/nats
      - ./nats.conf:/src/nats.conf:ro

  # The pinned image's nats-server (os/versions.lock.yaml; deploy/check-pins.py compares them). A client
  # with no key, or one this stack did not make, is refused.
  nats:
    image: docker.io/library/nats:2.15.3-alpine@sha256:558394a23dd3c36f2d3a64b51865fd09908010e80a542cea5e75c2af543ed62a
    command: ["-c", "/nats/nats.conf"]
    depends_on:
      nats-keys: {condition: service_completed_successfully}
    ports: ["127.0.0.1:4222:4222"]
    volumes:
      - nats-config:/nats:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Builds dashboard/ into the shared volume once per `up`, then exits.
  dashboard:
    image: docker.io/library/node:24.22.3-trixie-slim@sha256:af02d57b57719b9657a45199a79264a9437940cd55b3c7b3fc99615654f124a0
    working_dir: /build
    command:
      - sh
      - -ec
      - |
        # The TS SDK schema is generated, not committed (CI-16): run `make -C sdk gen-code` once.
        test -f /sdk/ts/src/gen/schema.ts || { echo "sdk/ts/src/gen/schema.ts is missing: run make -C sdk gen-code" >&2; exit 1; }
        cp -R /src/. /build/ && rm -rf /build/node_modules /build/dist
        npm ci --no-audit --no-fund --loglevel=error
        npm run build
        rm -rf /out/* && cp -R dist/. /out/ && chmod -R a+rX /out
    environment:
      npm_config_update_notifier: "false"
    volumes:
      - ../../dashboard:/src:ro
      # The dashboard compiles @onemind/ui from ../ui/src (vite.config.ts, tsconfig.json paths).
      - ../../ui/src:/ui/src:ro
      - ../../sdk/ts/src:/sdk/ts/src:ro
      - dashboard-dist:/out

  gateway:
    build: *core-build
    image: onemind-core:compose-dev
    depends_on:
      nats: {condition: service_healthy}
      dashboard: {condition: service_completed_successfully}
    environment:
      ONEMIND_TOKENS_FILE: /cfg/tokens.yaml
      ONEMIND_NATS_URL: nats://nats:4222
      ONEMIND_FABRIC_NATS_NKEY_SEED: /nats/keys/gateway.nk
      # The directory of <service>.pub/.nk keys: the gateway reads observer.nk here to watch the bus (N3).
      ONEMIND_FABRIC_NATS_SERVICE_KEYS: /nats/keys
      ONEMIND_EXECUTOR: noop
      ONEMIND_APPS_DIR: /opt/onemind/apps
      ONEMIND_DASHBOARD_DIST: /opt/onemind/dashboard
      ONEMIND_NODE_ID: compose-hub
      ONEMIND_INSTANCE_NAME: OneMind (compose dev)
      # DEV ONLY (contract §11.1): the apps on main have no scan.json yet, so a wave-2 gateway
      # would refuse every install. Allowed only with the noop executor; the gateway refuses it
      # with the kubernetes executor and logs a warning at startup.
      ONEMIND_ALLOW_UNSCANNED: "1"
    volumes:
      - ./local/tokens.yaml:/cfg/tokens.yaml:ro
      - ../../apps:/opt/onemind/apps:ro
      - dashboard-dist:/opt/onemind/dashboard:ro
      - gateway-data:/var/lib/onemind
      - nats-config:/nats:ro
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped

  # One simulated node: onemindd in a container, publishing heartbeats to the hub's NATS.
  node-sim:
    build: *onemindd-build
    image: onemindd:compose-dev
    depends_on:
      nats: {condition: service_healthy}
    environment:
      ONEMIND_NATS_URL: nats://nats:4222
      ONEMIND_NATS_NKEY_SEED: /nats/keys/node-sim.nk
      ONEMIND_NODE_ROLE: node
      ONEMIND_NODE_ID: compose-node-1
      # Inside the container: every interface, so the loopback-only port mapping below works.
      ONEMIND_AGENT_ADDR: ":7480"
    hostname: node-sim
    user: "10002:10002"
    ports: ["127.0.0.1:7480:7480"]
    volumes:
      - nats-config:/nats:ro
    restart: unless-stopped

  # Two simulated machines (ported from PR #27): onemindd's own agent code reading a Raspberry Pi 5
  # and a Jetson from internal/detect's fixture trees, so Nodes shows several boards on a Mac.
  # They report hardware that is not there; development only.
  sim-rpi5:
    build: *onemindd-build
    image: onemindd:compose-dev
    entrypoint: ["/usr/local/bin/simnode", "-root", "/fixture/rpi5", "-arch", "arm64", "-hostname", "sim-pi5"]
    depends_on:
      nats: {condition: service_healthy}
    environment:
      ONEMIND_NATS_URL: nats://nats:4222
      ONEMIND_NATS_NKEY_SEED: /nats/keys/sim-rpi5.nk
      ONEMIND_NODE_ROLE: node
      ONEMIND_NODE_ID: compose-sim-rpi5
    user: "10003:10003"
    volumes:
      - nats-config:/nats:ro
    restart: unless-stopped

  sim-jetson:
    build: *onemindd-build
    image: onemindd:compose-dev
    entrypoint: ["/usr/local/bin/simnode", "-root", "/fixture/jetson", "-arch", "arm64", "-hostname", "sim-jetson"]
    depends_on:
      nats: {condition: service_healthy}
    environment:
      ONEMIND_NATS_URL: nats://nats:4222
      ONEMIND_NATS_NKEY_SEED: /nats/keys/sim-jetson.nk
      ONEMIND_NODE_ROLE: node
      ONEMIND_NODE_ID: compose-sim-jetson
    user: "10004:10004"
    volumes:
      - nats-config:/nats:ro
    restart: unless-stopped

volumes:
  dashboard-dist:
  gateway-data:
  nats-config:
