# SPDX-License-Identifier: Apache-2.0
# OneMind hub on a Mac (contract section 6): NATS + gateway (noop executor) +
# dashboard served by the gateway + the real onemindd as the hub's own node +
# two simulated machines (Pi 5, Jetson) so the UI shows several machines.
#
#   cd deploy/compose && ./up.sh          # generates local tokens, builds, starts, waits
#   open http://localhost:8080            # sign in with the owner token up.sh prints
#   ./down.sh                              # stop (add -v to forget the ledger)
#
# Builds from this checkout: core/Dockerfile (gateway), dashboard/ (Vite app),
# cmd/onemindd (node agent). Nothing here is pulled except pinned base images.
name: onemind-dev

x-sim: &sim
  build: ./sim-node
  image: onemind/sim-node:dev
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    nats:
      condition: service_healthy

x-hub-node-id: &hub-node-id
  # The gateway reports this id as hub_node_id; the hub's onemindd heartbeats with it.
  # On a real hub both derive it from /etc/machine-id; containers have no shared one.
  ONEMIND_NODE_ID: "c0ffee0ac001"

services:
  nats:
    image: nats:2.15.2-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    # v0 shortcut: no NATS auth on the Mac; the port is bound to localhost only.
    # (deploy/install.sh turns token auth on for real hubs.)
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222", "--server_name", "onemind-mac-hub"]
    ports:
      - "127.0.0.1:${ONEMIND_NATS_PORT:-4222}:4222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: builds dashboard/ into a volume the gateway serves (no Node.js needed on the Mac).
  dashboard-build:
    image: node:22.23.5-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    working_dir: /work
    environment:
      VITE_MOCK: "0"
    command:
      - sh
      - -euc
      - |
        cd /src
        tar --exclude=./node_modules --exclude=./dist -cf - . | tar -C /work -xf -
        cd /work
        npm ci --no-audit --no-fund
        npm run build
        rm -rf /out/*
        cp -a /work/dist/. /out/
        echo "dashboard built into the dashboard-dist volume"
    volumes:
      - ../../dashboard:/src:ro
      - dashboard-dist:/out
    tmpfs:
      - /work:exec,size=1g

  gateway:
    build:
      # core/Dockerfile expects the repo root as context (it copies sdk/ for the app schema).
      context: ../..
      dockerfile: core/Dockerfile
    image: onemind/gateway:dev
    environment:
      <<: *hub-node-id
      ONEMIND_INSTANCE_NAME: OneMind (Mac compose)
      ONEMIND_NODE_ROLE: hub
      ONEMIND_EXECUTOR: noop
      ONEMIND_NATS_URL: nats://nats:4222
      ONEMIND_APPS_DIR: /srv/onemind/apps
      ONEMIND_DASHBOARD_DIST: /srv/onemind/dashboard
      ONEMIND_TOKENS_FILE: /run/onemind/tokens.yaml
      ONEMIND_DB_URL: sqlite:////var/lib/onemind/ledger.db
      ONEMIND_AUDIT_PATH: /var/lib/onemind/audit.jsonl
    volumes:
      - ../../apps:/srv/onemind/apps:ro
      - dashboard-dist:/srv/onemind/dashboard:ro
      - ./.secrets/tokens.yaml:/run/onemind/tokens.yaml:ro
      - gateway-data:/var/lib/onemind
    ports:
      - "127.0.0.1:${ONEMIND_HUB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      nats:
        condition: service_healthy
      dashboard-build:
        condition: service_completed_successfully
    restart: unless-stopped

  # The real node agent from cmd/onemindd: the hub's own machine in the Nodes screen.
  # Inside Docker it sees the Docker VM, so expect board "vm" and no k3s/RAUC.
  onemindd-hub:
    build:
      context: ../..
      dockerfile: deploy/compose/onemindd/Dockerfile
    image: onemind/onemindd:dev
    hostname: mac-hub
    environment:
      <<: *hub-node-id
      ONEMIND_NODE_ROLE: hub
      ONEMIND_NATS_URL: nats://nats:4222
      ONEMIND_AGENT_ADDR: 0.0.0.0:7480
    ports:
      - "127.0.0.1:${ONEMIND_AGENT_PORT:-7480}:7480"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  # Simulated machines (fake heartbeats on onemind.node.<id>.status every 10 s).
  sim-rpi5:
    <<: *sim
    hostname: sim-pi5
    environment:
      ONEMIND_NATS_URL: nats://nats:4222
      SIM_NAME: sim-pi5
      SIM_BOARD: rpi5
      SIM_ROLE: node

  sim-jetson:
    <<: *sim
    hostname: sim-jetson
    environment:
      ONEMIND_NATS_URL: nats://nats:4222
      SIM_NAME: sim-jetson
      SIM_BOARD: jetson-orin
      SIM_ROLE: node

volumes:
  nats-data:
  dashboard-dist:
  gateway-data:
