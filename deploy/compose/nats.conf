# OneMind dev hub NATS (deploy/compose). Same shape as the image's hub config (deploy/install.sh):
# every client signs in with its own nkey; the accounts file is made by the nats-keys service.
server_name: compose-hub
listen: 0.0.0.0:4222
http: 127.0.0.1:8222
max_payload: 1MB
include "/nats/accounts.conf"
